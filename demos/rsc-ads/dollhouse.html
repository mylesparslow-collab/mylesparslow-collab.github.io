  const s = AD.viewH * 0.55; Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 1, far: 70 }); sun.shadow.camera.updateProjectionMatrix();
  cam.left = -AD.viewH * W / H / 2; cam.right = -cam.left; cam.top = AD.viewH / 2; cam.bottom = -AD.viewH / 2;

function setT(t) {
  const [tx, ty, tz] = AD.target, TGT = new THREE.Vector3(tx, ty, tz);

  cam.lookAt(TGT); cam.zoom = 1.0 + 0.1 * eInOut(ramp(t, 0, 13));
  cam.setViewOffset(W, H, 0, 70, W, H); cam.updateProjectionMatrix();

  for (const it of K.items) {
    const st = P[it.p][0] + 0.15 + it.delay, p = ramp(t, st, st + it.dur), o = it.obj, b = it.base, s0 = it.scale0;
    o.position.copy(b); o.scale.copy(s0); o.rotation.x = o.rotation.x; o.visible = true;
    switch (it.kind) {

      case 'slide': o.visible = p > 0; o.position.y = b.y + (1 - eOut(p)) * 3; break;
      case 'hang': o.visible = p > 0; o.position.y = b.y + (1 - eBack(p)) * 4; break;
      case 'pop': o.visible = p > 0; o.scale.setScalar(0.001 + 0.999 * eBack(p)); break;
      case 'grow': o.visible = p > 0; o.scale.y = Math.max(0.001, eOut(p)); break;
      case 'sweepX': o.visible = p > 0; o.scale.x = Math.max(0.001, eOut(p)); break;
      case 'sweepZ': o.visible = p > 0; o.scale.z = Math.max(0.001, eOut(p)); break;
      case 'sweepY': o.visible = p > 0; o.scale.y = Math.max(0.001, eOut(p)); break;
      case 'out': { const q = 1 - eOut(p) ; o.visible = q > 0.002; o.position.y = b.y + p * p * 1.2; o.scale.setScalar(Math.max(0.001, q)); break; }
      case 'fall': { const f = p * p, sx = it.opts.sx ?? 0;
        o.position.set(b.x + f * (1.2 + sx), b.y - f * b.y, b.z + sx * f * 1.2); o.rotation.set(f * sx * 2.8, 0, f * 1.1);
        const q = 1 - ramp(p, 0.7, 1); o.visible = q > 0.002; o.scale.setScalar(Math.max(0.001, q)); break; }
    }
  }
  for (const d of K.dusts) { const st = P[d.p][0] + d.delay, dp = ramp(t, st, st + 1.6); d.m.opacity = 0.55 * Math.sin(Math.PI * dp);
    for (const bb of d.balls) { bb.s.position.y = 0.3 + dp * (1.5 + bb.r * 2); bb.s.scale.setScalar(0.6 + dp * 1.4); } }
  for (const pt of K.paints) { const st = P[pt.p][0] + 0.15 + pt.delay; pt.m.color.copy(pt.from).lerp(pt.to, eOut(ramp(t, st, st + pt.dur))); }
  // lights: come on at the end of their phase, with a short flicker
  for (const L of K.lights) { const at = P[L.p][1], on = eOut(ramp(t, at - 0.25, at + 0.35));
    const flick = t > at - 0.25 && t < at - 0.05 ? (Math.sin(t * 90) > 0 ? 1 : 0.3) : 1;
    if (L.obj.isLight) L.obj.intensity = L.max * on * flick;
    else { L.obj.userData.e0 ??= L.obj.emissiveIntensity; L.obj.emissiveIntensity = L.obj.userData.e0 + (L.max - L.obj.userData.e0) * on * flick; } }
  // mood warms as each phase is paid; the finished phase pulses once
  const paidN = P.reduce((s, [, b]) => s + eOut(ramp(t, b - 0.05, b + 0.45)), 0);
  hemi.intensity = 0.45 + 0.08 * paidN; sun.intensity = 0.95 + 0.12 * paidN;
  hemi.color.setHSL(0.58 - 0.035 * paidN, 0.45 - 0.05 * paidN, 0.82);
  renderer.toneMappingExposure = 0.9 + 0.035 * paidN;
  zones.forEach((z, i) => { z.intensity = [5, 5.5, 4, 4.5][i] * (AD.zoneK ?? 1) * eOut(ramp(t, P[i][1] - 0.05, P[i][1] + 0.45)); });
  for (const g of K.glows) { const u = t - P[g.p][1]; const pulse = u > -0.05 && u < 0.9 ? Math.sin(Math.PI * clamp((u + 0.05) / 0.95)) : 0;
    g.m.emissive.set(g.col); g.m.emissiveIntensity = Math.max(g.m.userData.e0 ?? 0, 0.45 * pulse); }

  // overlays
  $('h1').style.opacity = fade(t, T_H1, 0.01, 0.35); $('h2').style.opacity = fade(t, T_H2); $('h3').style.opacity = fade(t, T_H3);
  for (const id of ['h1', 'h2', 'h3']) { const o = +$(id).style.opacity; $(id).style.transform = `translateY(${(1 - o) * 24}px)`; }
  const tr = fade(t, [T_H2[0] - 0.2, T_END + 0.4]);
  $('tracker').style.opacity = tr; $('tracker').style.transform = `translateY(${(1 - tr) * 40}px)`;
  P.forEach(([a, b], i) => { const r = $('r' + i), paid = t >= b;
    r.classList.toggle('paid', paid); r.classList.toggle('building', t >= a && t < b);
    r.querySelector('.chip').textContent = paid ? 'Done · Paid ✓' : 'Building';
    r.style.transform = `scale(${paid ? 1 + 0.07 * Math.sin(Math.PI * clamp((t - b) / 0.35)) : 1})`; });
  const e = eInOut(ramp(t, T_END, T_END + 0.6));
  $('end').style.opacity = e; $('end').style.transform = `translateY(${(1 - e) * 120}px)`;
  [...$('end').children].forEach((c, k) => { const s = eOut(ramp(t, T_END + 0.3 + k * 0.18, T_END + 0.8 + k * 0.18)); c.style.opacity = s; c.style.translate = `0 ${(1 - s) * 30}px`; });
  composer.render();
  const clk = $('clock'); if (clk) clk.textContent = t.toFixed(1) + ' s';
}

// ---------- page ----------
const qs = new URLSearchParams(location.search), render = qs.has('render');
if (render) document.body.classList.add('render');
$('bar').innerHTML = Object.entries(ADS).map(([id, a]) => `<button data-id="${id}">${a.name}</button>`).join('') + '<span id="clock"></span>';
let t0 = performance.now();
$('bar').onclick = e => { const id = e.target.dataset?.id; if (id) { load(id); t0 = performance.now(); try { history.replaceState(null, '', '?ad=' + id); } catch (_) {} } };
load(ADS[qs.get('ad')] ? qs.get('ad') : 'kitchen');
window.setT = setT; window.load = load; window.DUR = DUR; window.ADS = Object.keys(ADS);
window.ready = document.fonts.ready.then(() => true);
function fit() { const s = render ? 1 : Math.min(innerWidth / W, (innerHeight - 56) / H); $('wrap').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
if (!render) { const loop = () => { const t = ((performance.now() - t0) / 1000) % (DUR + 1.0); setT(Math.min(t, DUR)); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
else setT(0);
</script>
</body>
