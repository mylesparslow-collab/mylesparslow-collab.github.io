<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNF Deal Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout: legal-workspace shell. Quiet sidebar of deals, deal page opens on its checklist; monochrome with status-only color. */
:root{
  --bg:#FFFFFF; --side:#F6F5F2; --ink:#121214; --muted:#6A6A70; --line:#E6E4DF; --hover:#EFEEEA; --field:#FFFFFF;
  --dark:#121214; --on-dark:#FFFFFF;
  --red:#B42318; --red-bg:#FDECEA; --green:#16733A; --green-bg:#E7F5EC; --amber:#9A4A00; --amber-bg:#FDF1E1; --blue:#1D4ED8; --blue-bg:#E8EEFC; --grey-bg:#F1F0ED;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace; --serif:"Newsreader",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141416; --side:#1A1A1D; --ink:#EDEDEF; --muted:#9C9CA3; --line:#2B2B30; --hover:#232327; --field:#1C1C1F; --dark:#EDEDEF; --on-dark:#141416;
  --red:#FF8F84; --red-bg:#3A1D1A; --green:#6FD495; --green-bg:#16301F; --amber:#F2B25C; --amber-bg:#352711; --blue:#93B1FF; --blue-bg:#1D2742; --grey-bg:#222226; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --side:#1A1A1D; --ink:#EDEDEF; --muted:#9C9CA3; --line:#2B2B30; --hover:#232327; --field:#1C1C1F; --dark:#EDEDEF; --on-dark:#141416;
  --red:#FF8F84; --red-bg:#3A1D1A; --green:#6FD495; --green-bg:#16301F; --amber:#F2B25C; --amber-bg:#352711; --blue:#93B1FF; --blue-bg:#1D2742; --grey-bg:#222226; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:12.5px}.pad{padding:24px 0}.pad0{margin:0 0 14px}

.app{display:grid;grid-template-columns:264px 1fr;min-height:100%}
#side{background:var(--side);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
#main{padding:28px max(36px,env(safe-area-inset-right,0px)) 64px 36px;min-width:0;max-width:1180px}
@media (max-width:860px){.app{grid-template-columns:1fr}#side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}#main{padding:22px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}.sidefoot{display:none}}

.brand{display:flex;gap:10px;align-items:center;padding:2px 4px}
.logo{width:30px;height:30px;border-radius:7px;background:var(--dark);color:var(--on-dark);display:grid;place-items:center;font-family:var(--serif);font-size:18px}
.brand b{display:block;font-size:14.5px;font-weight:600}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.side{display:grid;gap:2px}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 6px 4px;font-weight:500}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px;width:100%;font-weight:500}
.nav:hover{background:var(--hover)}.nav.on{background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.nav em{font-style:normal;font-size:11.5px;background:var(--dark);color:var(--on-dark);border-radius:99px;padding:0 7px;font-weight:600}
.nav.deal{display:grid;grid-template-columns:1fr;gap:3px}
.dn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm{font-size:11.5px;color:var(--muted);font-weight:400;font-family:var(--mono)}
.pb{display:block;height:3px;background:var(--line);border-radius:2px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ink)}
.none{color:var(--muted);font-size:13px;margin:4px 8px}
.sidefoot{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.45;padding:0 4px}

.btn{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 13px;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.dark{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.btn.dark:hover{opacity:.9}
.btn.full{width:100%;padding:9px}
.link{border:0;background:none;padding:0;text-decoration:underline;font-size:13px}
.danger{color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph > div:first-child{min-width:0}
.eyebrow{font-size:12px;color:var(--muted);margin:0 0 4px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3vw,34px);line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:80ch}
.h2{font-size:15px;font-weight:600;margin:34px 0 10px}

.stats{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.3fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.stat{padding:14px 16px;border-left:1px solid var(--line);display:grid;gap:2px;align-content:start;min-width:0}
.stat:first-child{border-left:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat b i{font-style:normal;color:var(--muted);font-weight:500;font-size:18px}
.stat b.sm{font-size:20px}
.stat small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.stat.main.bad{background:var(--red-bg)}.stat.main.bad b,.stat.main.bad small{color:var(--red)}
.stat.main.good{background:var(--green-bg)}.stat.main.good b{color:var(--green)}
@media (max-width:860px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs em,.filters em{font-style:normal;font-size:11.5px;color:var(--muted);background:var(--grey-bg);border-radius:99px;padding:0 7px;font-family:var(--mono)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 11px;font-size:13px;display:flex;gap:6px;align-items:center}
.filters button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.filters button[aria-pressed="true"] em{background:rgba(127,127,127,.25);color:inherit}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
table.list{border-collapse:collapse;width:100%;font-size:13.5px;min-width:620px}
table.list th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--side)}
table.list td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.list tbody tr:first-child td{border-top:0}
table.list td small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hover)}
.ck th:first-child{color:var(--ink);font-weight:600;font-size:13px}
.ck input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);margin-top:2px}
.tt{border:0;background:none;padding:0;text-align:left;font-weight:500}
.tt:hover{text-decoration:underline}
tr.isdone .tt{color:var(--muted);text-decoration:line-through}
.who{border:1px solid transparent;background:none;border-radius:5px;padding:3px 6px;width:100%;font-size:13px}
.who:hover,.who:focus{border-color:var(--line);background:var(--field)}
select{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:4px 6px;font-size:13px;max-width:100%}
.exp{display:grid;gap:8px;margin-top:8px}
.exp textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--field);width:100%;resize:vertical;font-size:13px}
.due{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.due.late{color:var(--red);font-weight:500}.due.soon{color:var(--amber)}
.srcs{display:flex;flex-wrap:wrap;gap:5px}
.src{font-size:11.5px;text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted);background:var(--bg);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.src::before{content:"↗ ";}
.src:hover{color:var(--ink);border-color:var(--muted)}
.badge{display:inline-block;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:99px;white-space:nowrap}
.b-req{background:var(--red-bg);color:var(--red)}.b-info{background:var(--amber-bg);color:var(--amber)}.b-rev{background:var(--blue-bg);color:var(--blue)}.b-no{background:var(--grey-bg);color:var(--muted)}.b-ok{background:var(--green-bg);color:var(--green)}
.kind{font-size:12px;font-family:var(--mono)}.k-stat{color:var(--red)}.k-con{color:var(--blue)}.k-ag{color:var(--amber)}.k-tar{color:var(--ink);font-weight:600}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.card.dim{opacity:.6}
.ct{display:grid;gap:6px;justify-items:start}
.card h3{font-size:15px;font-weight:600;margin:0}
.card p{margin:0;color:var(--muted);font-size:13.5px}

.scale{position:relative;height:74px;margin:6px 12px 20px}
.scale .line{position:absolute;left:0;right:0;top:36px;height:2px;background:var(--line)}
.mk{position:absolute;top:30px;width:2px;height:14px;background:var(--ink);font-style:normal}
.mk b{position:absolute;font-size:12px;font-weight:500;white-space:nowrap;transform:translateX(-50%);top:-24px}
.mk.today b{transform:none}
.mk.ear{background:var(--green)}.mk.ear b{color:var(--green);top:20px}.mk.ear.bad{background:var(--red)}.mk.ear.bad b{color:var(--red)}
.mk.out{background:var(--blue)}.mk.out b{color:var(--blue);top:20px}
.gapband{position:absolute;top:32px;height:10px;background:var(--red-bg)}

.empty{max-width:640px;padding:48px 0}
.empty p{color:var(--muted);font-size:15px;margin:12px 0 22px}
.what{list-style:none;padding:0;margin:34px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.what li{background:var(--bg);padding:14px 16px;color:var(--muted);font-size:13px}
.what b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
@media (max-width:560px){.what{grid-template-columns:1fr}}

.formgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
@media (max-width:1060px){.formgrid{grid-template-columns:1fr}.preview{position:static!important;order:-1}}
form{display:grid;gap:18px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:16px 18px 18px;margin:0;display:grid;gap:14px;min-width:0}
legend{font-weight:600;padding:0 6px;font-size:14px}
.fl{display:grid;gap:6px;font-size:13px;font-weight:500}
.fl input:not([type=radio]),.fl select{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--field);font-weight:400;font-size:14px;width:100%}
.opt{color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two,.qgrid{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;justify-self:start;background:var(--field)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:6px 12px;font-weight:400;font-size:13px;border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0}
.seg input:checked + span{background:var(--dark);color:var(--on-dark)}
.seg input:focus-visible + span{outline:2px solid var(--blue);outline-offset:-2px}
.fac{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:12px}
.fac:first-of-type{border-top:0;padding-top:0}
.preview{position:sticky;top:20px;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--side)}
.preview h3{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 6px;line-height:1.2}
.pv-date{margin:0 0 12px;font-size:13.5px}.pv-date.bad{color:var(--red)}
.pv{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:7px}
.pv li{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:start;font-size:13px}
.pv .badge{justify-self:start}

.docgrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1240px){.docgrid{grid-template-columns:1fr}}
.docgrid > section{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.drop{display:grid;gap:4px;place-items:center;text-align:center;border:1.5px dashed var(--line);border-radius:10px;padding:26px 16px;cursor:pointer;background:var(--side)}
.drop:hover,.drop.over{border-color:var(--ink)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop span{font-size:12.5px;color:var(--muted)}
.doclist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px}
.doclist li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.doclist li:first-child{border-top:0}
.dl{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.dl b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl small{color:var(--muted);font-size:12px}
.dl:hover b{text-decoration:underline}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.note ul{margin:6px 0 10px;padding-left:18px}
.note b{color:var(--ink);font-weight:500}
.emptyf{border:1px solid var(--line);border-radius:10px;padding:28px}
.emptyf h3,.fhead h3{margin:0;font-family:var(--serif);font-weight:500;font-size:22px}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.finding{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.fh{display:flex;gap:8px;align-items:center}
.cat{font-size:12px;color:var(--muted)}
.finding h4{margin:0;font-size:15px;font-weight:600}
.finding p{margin:0;font-size:13.5px;color:var(--muted)}
.quotes{display:grid;gap:6px}
.q{display:grid;gap:4px;text-align:left;border:0;border-left:2px solid var(--line);background:var(--side);padding:8px 12px;border-radius:0 6px 6px 0;font-family:var(--serif);font-size:15px;line-height:1.5}
.q:hover{border-left-color:var(--ink)}
.q mark{background:var(--amber-bg);color:var(--ink);padding:0 2px}
.q cite{font-family:var(--sans);font-style:normal;font-size:11.5px;color:var(--muted)}
.btn.small{padding:4px 10px;font-size:12.5px}
#viewer{position:fixed;inset:0;z-index:8}
.vbg{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.vpanel{position:absolute;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr}
.vpanel header{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px 16px;border-bottom:1px solid var(--line)}
.vpanel header b{display:block;font-weight:600}.vpanel header small{color:var(--muted);font-size:12px}
.vtext{margin:0;overflow:auto;padding:20px 24px 48px;white-space:pre-wrap;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.vtext mark{background:var(--amber-bg);color:var(--ink);outline:2px solid var(--amber);border-radius:2px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--dark);color:var(--on-dark);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:9}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<div class="app"><aside id="side"></aside><main id="main"></main></div>
<div id="toast" role="status" hidden></div>
<div id="viewer" hidden></div>
<script>
/* SNF deal rules engine. Deterministic: answers in, filings / dates / tasks / requests out.
   Every output carries a source. Rules reflect the public sources in the Oct 29, 2026 research memo
   and must be verified by counsel before reliance. */
(function(global){
const P=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const F=dt=>dt.toISOString().slice(0,10);
const addDays=(s,n)=>F(new Date(P(s).getTime()+n*864e5));
const diff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const maxD=(...ds)=>ds.filter(Boolean).sort((a,b)=>P(b)-P(a))[0];

const SRC={
  afl:{t:'CDPH AFL 23-17 (AB 1502 prior approval)',u:'https://www.cdph.ca.gov/Programs/CHCQ/LCP/Pages/AFL-23-17.aspx'},
  n9167:{t:'CDPH 9167 Current Licensee Notice',u:'https://www.cdph.ca.gov/CDPH%20Document%20Library/ControlledForms/cdph9167.pdf'},
  chow:{t:'CDPH SNF change of ownership packet',u:'https://www.cdph.ca.gov/Programs/CHCQ/LCP/Pages/AppPacket/SNF-CHOW.aspx'},
  chowck:{t:'CDPH SNF CHOW provider checklist',u:'https://www.cdph.ca.gov/Programs/CHCQ/LCP/Pages/SNF-CHOW-Provider-Checklist.aspx'},
  chio:{t:'CDPH SNF change of indirect ownership checklist',u:'https://www.cdph.ca.gov/Programs/CHCQ/LCP/Pages/SNF-CHIO-Provider-Checklist.aspx'},
  cfr489:{t:'42 CFR 489.18 (Medicare CHOW)',u:'https://www.ecfr.gov/current/title-42/chapter-IV/subchapter-G/part-489/subpart-A/section-489.18'},
  cfr516:{t:'42 CFR 424.516 (reporting changes)',u:'https://www.ecfr.gov/current/title-42/chapter-IV/subchapter-B/part-424/subpart-P/section-424.516'},
  cmsatt:{t:'CMS SNF attachment guidance, Feb 24 2026',u:'https://www.cms.gov/files/document/guidance-snf-attachment-855a.pdf'},
  cmsdata:{t:'CMS SNF CHOW data guidance v1.3',u:'https://data.cms.gov/sites/default/files/2026-07/SNF_CHOW_Data_Guidance.pdf'},
  dhcs:{t:'DHCS provider enrollment options',u:'https://www.dhcs.ca.gov/providers-partners/provider-enrollment-options/'},
  ohca:{t:'HCAI OHCA notice rules (amended Nov 2, 2026)',u:'https://hcai.ca.gov/affordability/ohca/assess-market-consolidation/mcn-cmir-faqs/'},
  hud:{t:'HUD Handbook 4232.1, Section III',u:'https://www.hud.gov/hudclips/handbooks/housing-4232-1'},
  ag:{t:'CA Attorney General nonprofit health facility review',u:'https://www.oag.ca.gov/charities/nonprofithosp'},
  oig:{t:'HHS-OIG exclusions (LEIE)',u:'https://www.oig.hhs.gov/exclusions/'},
  chf:{t:'CDPH Cal Health Find',u:'https://www.cdph.ca.gov/Programs/CHCQ/LCP/CalHealthFind/pages/home.aspx'},

      const k=/(?:hire|employ|appoint|terminate|supervise|direct)[^.;]{0,80}(?:Administrator|Director of Nursing|staff|employees)|approv\w*[^.;]{0,40}(?:budget|capital expenditure)|(?:control|manage)[^.;]{0,40}(?:bank accounts|operating accounts|cash)/i.exec(t);
      if(k&&!pow)pow=cite(d,p,t,k.index,k[0].length);
    });
    if(def&&pow)out.push({id:'ctl:'+d.id,sev:'high',cat:'Control',title:`Manager gets operating control at signing (${d.name})`,
      why:'The agreement takes effect when signed and gives the manager authority over staff, budgets or cash. California requires CDPH approval before a management change that hands over operating responsibility (AB 1502). Consider tying the effective date to CDPH approval or closing.',quotes:[def,pow],src:Rules.SRC.afl});

/* ---------- dates vs the deal ---------- */
function parseDate(s){const m=new RegExp(`(${MONTHS})\\s+(\\d{1,2}),\\s*(\\d{4})`).exec(s);if(!m)return null;const mo=MONTHS.split('|').indexOf(m[1])+1;return `${m[3]}-${String(mo).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`}
function dateIssues(docs,deal,fmt){
  const out=[];
  const re=new RegExp(`["“](Outside Date|Termination Date|End Date)["”][^.]{0,120}?((?:${MONTHS})\\s+\\d{1,2},\\s*\\d{4})`,'g');
  each(docs.filter(isAPA),re,(d,p,t,m)=>{
    const dt=parseDate(m[2]);if(!dt)return;
    if(!deal.outside)out.push({id:'date:'+d.id+dt,sev:'low',cat:'Dates',title:`Agreement sets the outside date at ${fmt(dt)}`,why:'The deal record has no outside date. Add it so the timeline can check the approvals against it.',quotes:[cite(d,p,t,m.index,m[0].length)],fix:{outside:dt}});
    else if(dt!==deal.outside)out.push({id:'date:'+d.id+dt,sev:'high',cat:'Dates',title:`Outside date doesn't match: ${fmt(dt)} in the agreement, ${fmt(deal.outside)} in the deal record`,why:'One of them is wrong. The timeline and every approval check use the deal record.',quotes:[cite(d,p,t,m.index,m[0].length)],fix:{outside:dt}});
  });
  return out;
}

/* ---------- conditions to closing cover the required approvals ---------- */
function conditionGaps(docs,regimes){
  const apas=docs.filter(isAPA);if(!apas.length)return[];
  const text=apas.map(d=>d.pages.join('\n')).join('\n');
  const tests={cdph:/CDPH|Department of Public Health|license (?:approval|issued)|AB 1502/i,hud:/HUD|Housing and Urban Development|Section 232/i,ag:/Attorney General/i,landlord:/landlord|lessor/i,ohca:/OHCA|Health Care Affordability|HCAI/i,medi:/Medi-Cal|DHCS/i};
  const out=[];
  regimes.filter(r=>r.status==='req'&&tests[r.id]).forEach(r=>{
    if(!tests[r.id].test(text))out.push({id:'cp:'+r.id,sev:'high',cat:'Conditions',title:`Purchase agreement never mentions: ${r.name}`,why:`This deal needs it, but the purchase agreement doesn't refer to it anywhere. It should usually be a condition to closing with a covenant to pursue it.`,quotes:[],src:r.src[0],task:`Add ${r.name} as a condition to closing in the purchase agreement`});
  });
  return out;
}

/* ---------- blanks, signers ---------- */
function blanks(docs){
  const out=[];const re=/\[(?:●|•|\*|_{2,}|TBD|TBC|insert[^\]]{0,40}|bracket[^\]]{0,20}|\s*)\]|_{6,}/gi;
  docs.forEach(d=>{const qs=[];d.pages.forEach((t,p)=>{re.lastIndex=0;let m;while((m=re.exec(t)))qs.push(cite(d,p,t,m.index,m[0].length))});
    if(qs.length)out.push({id:'blank:'+d.id,sev:'med',cat:'Drafting',title:`${qs.length} blank${qs.length>1?'s':''} left in ${d.name}`,why:'Placeholders that still need a value before signing.',quotes:qs.slice(0,3),meta:qs.length>3?`+${qs.length-3} more`:''})});
  return out;
}
function signers(docs){
  const out=[];const re=/By:\s*(?:\/s\/)?\s*([^\n]{0,60})\n?\s*(?:Name:\s*([^\n]{0,60})\n?\s*)?Title:\s*([^\n]{2,60})/g;
  each(docs,re,(d,p,t,m)=>{
    const title=m[3].trim();
    if(/\b(Chief Executive|CEO|President(?!.*Vice)|Managing Member|Manager|Sole Member|General Partner|Secretary)\b/i.test(title)&&!/vice|assistant|associate|director of/i.test(title))return;
    out.push({id:'sig:'+d.id+':'+m.index,sev:'low',cat:'Authority',title:`Signer's authority: ${title} (${d.name})`,why:'Titles below the top officer usually need a board or member resolution or an incumbency certificate.',quotes:[cite(d,p,t,m.index,m[0].length)],request:[`Incumbency certificate or authorizing resolution for the signer on ${d.name}`]});
  });
  return out;
}
function facilityMentions(docs,deal){
  if(!docs.length)return[];
  const all=docs.map(d=>d.pages.join(' ')).join(' ').toLowerCase();
  return deal.facilities.filter(f=>f.name&&!all.includes(f.name.toLowerCase())).map(f=>({id:'fac:'+f.id,sev:'low',cat:'Coverage',title:`${f.name} isn't named in any uploaded document`,why:'Either its documents haven\'t been uploaded yet, or the documents use a different name for it.',quotes:[]}));
}

function check(deal,docs,regimes,fmt){
  if(!docs.length)return[];
  const ents=entities(docs);
  return[...earlyControl(docs),...nameIssues(ents),...dateIssues(docs,deal,fmt),...conditionGaps(docs,regimes),...missingAttachments(docs),...blanks(docs),...signers(docs),...facilityMentions(docs,deal)];
}

/* verify an AI quote really appears in the document */
function locate(docs,docId,quote){
  const d=docs.find(x=>x.id===docId);if(!d||!quote)return null;
  const words=norm(quote).replace(/[“”"]/g,'"').split(' ').filter(Boolean);if(words.join(' ').length<12)return null;
  const re=new RegExp(words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/"/g,'["“”]')).join('\\s+'),'i');
  for(let p=0;p<d.pages.length;p++){const m=re.exec(d.pages[p]);if(m)return cite(d,p,d.pages[p],m.index,m[0].length)}

/* Claude review: optional, per document, quotes verified locally */
async function aiReview(d,docId){
  const doc=d.docs.find(x=>x.id===docId),a=analyze(d,TODAY);
  const text=doc.pages.map((t,i)=>doc.pages.length>1?`[Page ${i+1}]\n${t}`:t).join('\n\n').slice(0,90000);
  const brief=`Deal: ${STRUCT[d.structure]}. We represent the ${d.side}. Facilities: ${d.facilities.map(f=>f.name).join(', ')}. Target closing ${d.target}${d.outside?`, outside date ${d.outside}`:''}. Required approvals: ${a.regimes.filter(r=>r.status==='req').map(r=>r.name).join('; ')}.`;
  const prompt=`You are reviewing a document in a California skilled nursing facility (SNF) transaction for an associate at a law firm.\n${brief}\n\nFind up to 8 issues a careful transactional lawyer would raise: inconsistent party names, control or authority shifting before regulatory approval, approvals or consents not covered, risky allocation of Medicare/Medi-Cal liabilities, missing protections for the client side, ambiguous dates, internal cross-reference errors. Do not give legal conclusions; flag and explain.\n\nReturn ONLY a JSON array. Each item: {"title": short, "severity": "high"|"med"|"low", "why": 1-2 plain sentences, "quote": an EXACT verbatim passage of 8-40 words copied from the document that shows the issue}.\n\nDOCUMENT: ${doc.name}\n"""\n${text}\n"""`;
  const out=await AI.json(prompt,{modelTier:'complex'});
  const items=Array.isArray(out)?out:(out&&out.items)||[];
  let dropped=0;const findings=[];
  items.forEach((it,k)=>{const q=DocCheck.locate(d.docs,docId,it.quote);if(!q){dropped++;return}
    findings.push({id:`ai:${docId}:${k}:${(it.title||'').slice(0,20)}`,sev:['high','med','low'].includes(it.severity)?it.severity:'med',cat:'Claude review',ai:true,title:String(it.title||'Issue'),why:String(it.why||''),quotes:[q]})});
  return{findings,dropped,at:TODAY};
}

function docAct(act,t,d){
  const F=id=>docFindings(d,analyze(d,TODAY)).find(f=>f.id===id);
  if(act==='closeview'){document.getElementById('viewer').hidden=true;return true}
  if(act==='samples'){d.docs=(d.docs||[]).concat(SAMPLE_DOCS.map(s=>({id:fid(),name:s.name,kind:'Text',pages:[s.text],added:TODAY})));save();render();toast('Sample documents loaded');return true}
  if(act==='rmdoc'){d.docs=d.docs.filter(x=>x.id!==t.dataset.id);if(d.ai)delete d.ai[t.dataset.id];save();render();return true}
  if(act==='dismiss'){(d.dismissed=d.dismissed||{})[t.dataset.f]=1;save();render();return true}
  if(act==='undismiss'){d.dismissed={};save();render();return true}
  if(act==='fix'){const f=F(t.dataset.f);if(f&&f.fix){Object.assign(d,f.fix);save();render();toast('Deal record updated')}return true}
  if(act==='totask'){const f=F(t.dataset.f);if(f){(d.custom=d.custom||[]).push({id:'c'+fid(),from:f.id,ws:'From document check',title:f.task||f.title,due:addDays(TODAY,7),src:f.src?[f.src]:[{t:f.quotes[0]?f.quotes[0].docName:'Document check'}]});save();render();toast('Added to checklist')}return true}
  if(act==='toreq'){const f=F(t.dataset.f);if(f){(d.extraReq=d.extraReq||[]);f.request.forEach(r=>d.extraReq.push({from:f.id,to:d.side==='seller'?'Buyer':'Seller',item:r.startsWith('Incumbency')?r:`Copy of ${r}`,why:'Referenced in the documents but not provided'}));save();render();toast('Added to document requests')}return true}
  if(act==='ai'){if(!AI)return true;t.disabled=true;t.textContent='Claude is reading…';
    aiReview(d,t.dataset.id).then(r=>{(d.ai=d.ai||{})[t.dataset.id]=r;save();render();toast(`${r.findings.length} finding${r.findings.length===1?'':'s'} from Claude${r.dropped?` · ${r.dropped} dropped (quote not found)`:''}`)})
      .catch(e=>{render();toast(e&&e.code==='not_granted'?'Claude review not allowed here':'Claude review failed. Try again.')});return true}
  return false;
}

async function addFiles(list){
  const d=deal();if(!d)return;let ok=0;
  for(const f of list){try{const x=await DocCheck.extract(f);if(!x.pages.join('').trim())throw new Error(`${f.name}: no text found (scanned image?)`);(d.docs=d.docs||[]).push({id:fid(),...x,added:TODAY});ok++}catch(e){toast(e.message)}}
  if(ok){try{save()}catch(e){}render();toast(`${ok} document${ok>1?'s':''} added`)}
}
document.addEventListener('change',e=>{if(e.target.id==='files'){addFiles([...e.target.files]);e.target.value=''}});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#drop');if(z){e.preventDefault();z.classList.add('over')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#drop');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#drop');if(z){e.preventDefault();z.classList.remove('over');addFiles([...e.dataTransfer.files])}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){e.stopPropagation();openViewer(b.dataset.view,+b.dataset.p||0,b.dataset.i!=null?+b.dataset.i:null,+b.dataset.l||0)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('viewer').hidden=true});
if(window.pdfjsLib)try{pdfjsLib.GlobalWorkerOptions.workerSrc=''}catch(e){}
/* ?demo=checklist|docs opens the example deal (used for screenshots and portfolio links) */
try{const dm=new URLSearchParams(location.search).get('demo');if(dm&&!DB.deals.length){const x=example();x.docs=SAMPLE_DOCS.map(s=>({id:fid(),name:s.name,kind:'Text',pages:[s.text],added:TODAY}));DB.deals.push(x);save();V.view='deal';V.dealId=x.id;V.tab=dm==='docs'?'documents':'checklist'}}catch(e){}
render();
</script>
