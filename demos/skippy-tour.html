<script>window.TOUR = {"steps": [{"img": "../assets/skippy-ask.jpg", "focus": [0.25, 0.2, 0.55, 0.25], "chapter": "Ask", "title": "Ask a question about a whole matter", "text": "A lawyer asks which contracts in a seven-document acquisition need counterparty consent. The model and effort level are chosen right in the prompt box."}, {"img": "../assets/skippy-approval.jpg", "focus": null, "chapter": "Approve", "title": "Nothing leaves the Mac without approval", "text": "Before anything is sent, an approval sheet lists exactly which documents go, how many passages each, where they go and which model reads them. Declining is always an option, and both choices are logged."}, {"img": "../assets/skippy-cited.jpg", "focus": [0.05, 0.12, 0.66, 0.7], "chapter": "Answer", "title": "An answer with pinpoint citations", "text": "The answer works through each agreement and cites the page and paragraph behind every point."}, {"img": "../assets/skippy-cited.jpg", "focus": [0.7, 0.04, 0.3, 0.92], "chapter": "Source", "title": "Click a citation, see the clause", "text": "The cited passage opens beside the answer with the exact language highlighted, here the change-of-control clause in the supply agreement."}, {"img": "../assets/skippy-review.jpg", "focus": [0.05, 0.2, 0.69, 0.72], "chapter": "Review", "title": "Review tables across many documents", "text": "Add columns such as parties, effective date, governing law or term, and Skippy fills the grid for every document, with each cell linked to its source."}, {"img": "../assets/skippy-redline.jpg", "focus": [0.15, 0.15, 0.62, 0.7], "chapter": "Draft", "title": "Drafting and redlines", "text": "Ask for a change in plain words and Skippy proposes it as a redline you accept or reject, then exports Word with tracked changes."}, {"img": "../assets/skippy-chronology.jpg", "focus": [0.05, 0.1, 0.93, 0.8], "chapter": "Chronology", "title": "A sourced chronology of facts", "text": "The chronology workflow pulls every dated event out of the record, from the complaint to a deposition excerpt, and cites each one."}, {"img": "../assets/skippy-citecheck.jpg", "focus": [0.18, 0.27, 0.65, 0.7], "chapter": "Cite Check", "title": "Check every citation before you file", "text": "Cite Check looks up each case, flags citations that do not exist or name the wrong case, and lists statutes and regulations to verify by hand."}, {"img": "../assets/skippy-deadlines.jpg", "focus": [0.05, 0.15, 0.84, 0.48], "chapter": "Deadlines", "title": "Deadlines with the arithmetic shown", "text": "Federal rule deadlines count weekends and federal holidays and show the reasoning, ready to add to the firm calendar."}, {"img": "../assets/skippy-audit.jpg", "focus": [0.05, 0.15, 0.94, 0.25], "chapter": "Audit", "title": "A tamper-evident audit log", "text": "Every import, approval, refusal, request and export is written to a hash-chained log, so a firm can show exactly what was sent and who approved it."}]};</script>
