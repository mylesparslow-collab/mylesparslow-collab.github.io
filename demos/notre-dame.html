<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed text-mode canvas with the cathedral on a turntable; caption and time-of-day controls fade in on pointer movement. */
:root {
  color-scheme: dark;
  --night: #07080c;
  --stone: #e6dcc6;
  --stone-dim: #958b78;
  --gold: #e3b062;
  --line: rgba(230, 220, 198, .2);
  --f-name: "Cormorant SC", "Iowan Old Style", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

html, body { height: 100%; }
body { background: var(--night); color: var(--stone); overflow: hidden; font-family: var(--f-mono);

#c, #g { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#g { filter: blur(6px) saturate(1.3); mix-blend-mode: screen; opacity: .75; pointer-events: none; }
.vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%); }
#ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px;
  padding: 44px max(20px, calc(env(safe-area-inset-right, 0px) + 16px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(20px, calc(env(safe-area-inset-left, 0px) + 16px));
  background: linear-gradient(to top, rgba(0,0,0,.7), transparent); transition: opacity .6s ease; pointer-events: none; }
#ui > * { pointer-events: auto; }
body.idle #ui { opacity: 0; }
body.idle #ui > * { pointer-events: none; }
body.idle { cursor: none; }
.cap { display: grid; gap: 3px; min-width: 0; }
h1 { margin: 0; font: 500 clamp(26px, 3.6vw, 40px)/1 var(--f-name); letter-spacing: .02em; text-wrap: balance; }
.cap p { margin: 0; font-size: 12px; color: var(--stone-dim); }
#phase { color: var(--gold); }
nav { display: flex; flex-wrap: wrap; gap: 6px; }
nav button { font: 500 12px/1 var(--f-mono); color: var(--stone); background: rgba(8,9,12,.55); border: 1px solid var(--line); border-radius: 3px; padding: 9px 11px; cursor: pointer; }

<canvas id="c"></canvas><canvas id="g"></canvas>
<div class="vig"></div>
<div id="ui">
  <div class="cap">
    <h1>Notre-Dame de Paris</h1>
    <p>Drag to turn it &middot; <span id="phase">golden hour</span></p>
  </div>
  <nav aria-label="Time of day">
    <button data-m="auto" aria-pressed="true">cycle</button>
    <button data-m="0.1" aria-pressed="false">day</button>
    <button data-m="0.31" aria-pressed="false">golden hour</button>
    <button data-m="0.66" aria-pressed="false">night</button>
  </nav>
</div>

<script>
