<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Hollow Hours</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one full-bleed animated text-mode canvas; a quiet caption bar fades in only when the pointer moves. */
:root {
  color-scheme: dark;
  --void: #050508;
  --bone: #d9d1bd;
  --bone-dim: #8a8373;
  --ember: #e0782a;
  --line: rgba(217, 209, 189, .18);
  --f-title: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body {
  background: var(--void); color: var(--bone); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--f-mono);
}
#stage { position: fixed; inset: 0; transition: opacity .7s ease; }
#stage.out { opacity: 0; }
#c, #g { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#g { filter: blur(7px) saturate(1.25); mix-blend-mode: screen; opacity: .8; pointer-events: none; }
.vig { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
body.idle { cursor: none; }

#ui {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 48px max(20px, calc(env(safe-area-inset-right, 0px) + 16px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(20px, calc(env(safe-area-inset-left, 0px) + 16px));
  background: linear-gradient(to top, rgba(0,0,0,.78), transparent);
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;
  transition: opacity .6s ease, transform .6s ease;
}
body.idle #ui { opacity: 0; transform: translateY(8px); pointer-events: none; }
.cap { min-width: 0; display: grid; gap: 2px; }
.num { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--bone-dim); }
h1 { margin: 0; font: 400 clamp(26px, 4vw, 40px)/1.05 var(--f-title); letter-spacing: .01em; text-wrap: balance; }
.note { margin: 0; font-size: 12px; color: var(--bone-dim); }
nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
nav button {
  font: 500 12px/1 var(--f-mono); color: var(--bone); background: rgba(10,10,14,.55);
  border: 1px solid var(--line); border-radius: 3px; padding: 9px 11px; cursor: pointer; letter-spacing: .04em;
}
nav button:hover { border-color: var(--bone-dim); }
nav button:focus-visible { outline: 1px solid var(--ember); outline-offset: 2px; }
nav button[aria-pressed="true"] { color: var(--ember); border-color: rgba(224,120,42,.5); }
#dots { display: flex; gap: 4px; padding: 0 6px; }
#dots button { padding: 9px 7px; min-width: 26px; }
#dots button[aria-current="true"] { color: var(--void); background: var(--bone); border-color: var(--bone); }
@media (max-width: 1100px) { #dots { display: none; } }
</style>

<div id="stage"><canvas id="c"></canvas><canvas id="g"></canvas></div>
<div class="vig"></div>
<div id="ui">
  <div class="cap">
    <span class="num" id="num"></span>
    <h1 id="name"></h1>
    <p class="note" id="note"></p>
  </div>
  <nav aria-label="Scenes">
    <button id="prev" aria-label="Previous scene">&lsaquo; prev</button>
    <div id="dots"></div>
    <button id="next" aria-label="Next scene">next &rsaquo;</button>
    <button id="auto" aria-pressed="true">cycle</button>
    <button id="fs">fullscreen</button>
  </nav>
</div>

<script>
(() => {
"use strict";
// ---------- core helpers ----------
const RAMP = " .,:;-~=+*ox%#&@";
const LV = RAMP.length;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const mix = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PERM = new Uint8Array(512);
{ const r = rng(1337), p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; }
const hash2 = (x, y) => PERM[PERM[x & 255] + (y & 255)] / 255;
function n2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1, nm = 0; for (let k = 0; k < o; k++) { s += a * n2(x * f + k * 17.1, y * f + k * 9.7); nm += a; a *= 0.5; f *= 2.03; } return s / nm; }
const n1 = x => n2(x, 0.5);
function sdTri(px, py, ax, ay, bx, by, cx, cy) {
  const e0x = bx - ax, e0y = by - ay, e1x = cx - bx, e1y = cy - by, e2x = ax - cx, e2y = ay - cy;
  const v0x = px - ax, v0y = py - ay, v1x = px - bx, v1y = py - by, v2x = px - cx, v2y = py - cy;
  const h0 = clamp((v0x * e0x + v0y * e0y) / (e0x * e0x + e0y * e0y), 0, 1);
  const h1 = clamp((v1x * e1x + v1y * e1y) / (e1x * e1x + e1y * e1y), 0, 1);
  const h2 = clamp((v2x * e2x + v2y * e2y) / (e2x * e2x + e2y * e2y), 0, 1);
  const q0x = v0x - e0x * h0, q0y = v0y - e0y * h0, q1x = v1x - e1x * h1, q1y = v1y - e1y * h1, q2x = v2x - e2x * h2, q2y = v2y - e2y * h2;
  const s = Math.sign(e0x * e2y - e0y * e2x);
  const d = Math.min(q0x * q0x + q0y * q0y, q1x * q1x + q1y * q1y, q2x * q2x + q2y * q2y);
  const g = Math.min(s * (v0x * e0y - v0y * e0x), s * (v1x * e1y - v1y * e1x), s * (v2x * e2y - v2y * e2x));
  return -Math.sqrt(d) * Math.sign(g);
}
function sdBox(px, py, bx, by) { const dx = Math.abs(px) - bx, dy = Math.abs(py) - by; return Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) + Math.min(Math.max(dx, dy), 0); }

// ---------- grid / renderer ----------
const cvs = document.getElementById("c"), ctx = cvs.getContext("2d", { alpha: false });
const gcv = document.getElementById("g"), gctx = gcv.getContext("2d");
let W = 0, H = 0, DPR = 1, fs = 14, cw = 8, chh = 16, ox = 0, oy = 0;
let PX, PY, KEY, ORD, CNT = new Int32Array(4 * LV + 1);
const GC = [];
const gs = code => GC[code] || (GC[code] = String.fromCharCode(code));
function slopeGlyph(dx, dy) {
  let d = Math.atan2(dy * chh, dx * cw) * 180 / Math.PI; if (d < 0) d += 180;
  return d < 22.5 || d >= 157.5 ? 45 : d < 67.5 ? 92 : d < 112.5 ? 124 : 47;
}
const S = {
  cols: 0, rows: 0, n: 0, A: 1, U: null, V: null, val: null, chn: null, gly: null,
  toCell(u, v) { return [(u * H + W / 2 - ox) / cw - 0.5, (v * H + H / 2 - oy) / chh - 0.5]; },
  idx(c, r) { c = Math.round(c); r = Math.round(r); return (c < 0 || r < 0 || c >= this.cols || r >= this.rows) ? -1 : r * this.cols + c; },
  plot(c, r, code, v, ch, force) { const i = this.idx(c, r); if (i < 0) return; if (force || v >= this.val[i]) { this.val[i] = v; this.chn[i] = ch; this.gly[i] = code; } },
  text(cc, r, str, v, ch) { const c0 = Math.round(cc - (str.length - 1) / 2); for (let k = 0; k < str.length; k++) if (str[k] !== " ") this.plot(c0 + k, r, str.charCodeAt(k), v, ch, true); },
  line(c0, r0, c1, r1, v, ch, force) {
    const dx = c1 - c0, dy = r1 - r0, steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))) || 1, code = slopeGlyph(dx, dy);
    for (let s = 0; s <= steps; s++) this.plot(c0 + dx * s / steps, r0 + dy * s / steps, code, v, ch, force);
  },
  lineUV(u0, v0, u1, v1, v, ch, force) { const a = this.toCell(u0, v0), b = this.toCell(u1, v1); this.line(a[0], a[1], b[0], b[1], v, ch, force); },
};

function buildPal(p) {
  const chans = p.slice(); while (chans.length < 4) chans.push(chans[0]);
  return chans.map(stops => { const out = []; for (let l = 0; l < LV; l++) { const t = l / (LV - 1) * (stops.length - 1); const k = Math.min(stops.length - 2, Math.floor(t)); const f = t - k; const a = stops[k], b = stops[k + 1]; out.push(`rgb(${Math.round(mix(a[0], b[0], f))},${Math.round(mix(a[1], b[1], f))},${Math.round(mix(a[2], b[2], f))})`); } return out; });
}

function draw(sc) {
  const { n, val, chn, gly } = S, cols = sc.colors;
  ctx.fillStyle = sc.bg; ctx.fillRect(0, 0, W, H);
  CNT.fill(0);
  for (let i = 0; i < n; i++) {
    let l = (val[i] * LV) | 0; if (l >= LV) l = LV - 1;
    if (l <= 0) { if (!gly[i]) { KEY[i] = 4 * LV; continue; } l = 1; }
    const k = chn[i] * LV + l; KEY[i] = k; CNT[k]++;
  }
  let acc = 0; const start = new Int32Array(4 * LV + 1);
  for (let k = 0; k < 4 * LV; k++) { start[k] = acc; acc += CNT[k]; }
  const total = acc;
  for (let i = 0; i < n; i++) { const k = KEY[i]; if (k < 4 * LV) ORD[start[k]++] = i; }
  let cur = -1;
  for (let j = 0; j < total; j++) {
    const i = ORD[j], k = KEY[i];
    if (k !== cur) { cur = k; ctx.fillStyle = cols[(k / LV) | 0][k % LV]; }
    ctx.fillText(gly[i] ? gs(gly[i]) : RAMP[k % LV], PX[i], PY[i]);
  }
  if (cvs.width && cvs.height) { gctx.clearRect(0, 0, gcv.width, gcv.height); gctx.drawImage(cvs, 0, 0, gcv.width, gcv.height); }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  gcv.width = Math.max(1, Math.round(W / 3)); gcv.height = Math.max(1, Math.round(H / 3));
  fs = clamp(Math.round(Math.min(H / 54, W / 96)), 9, 22);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.font = `${fs}px "IBM Plex Mono", ui-monospace, Menlo, monospace`;
  ctx.textBaseline = "top";
  cw = ctx.measureText("M").width; chh = Math.round(fs * 1.16);
  S.cols = Math.floor(W / cw); S.rows = Math.floor(H / chh); S.n = S.cols * S.rows; S.A = W / H;
  ox = (W - S.cols * cw) / 2; oy = (H - S.rows * chh) / 2;
  const n = S.n;
  S.U = new Float32Array(n); S.V = new Float32Array(n); S.val = new Float32Array(n); S.chn = new Uint8Array(n); S.gly = new Uint16Array(n);
  PX = new Float32Array(n); PY = new Float32Array(n); KEY = new Uint16Array(n); ORD = new Int32Array(n);
  for (let r = 0; r < S.rows; r++) for (let c = 0; c < S.cols; c++) {
    const i = r * S.cols + c; PX[i] = ox + c * cw; PY[i] = oy + r * chh;
    S.U[i] = (ox + (c + 0.5) * cw - W / 2) / H; S.V[i] = (oy + (r + 0.5) * chh - H / 2) / H;
  }
  if (scene) scene.init(S);
}

// shared: gnarled tree, thick limbs into a silhouette mask, thin twigs as line glyphs
function growTree(S, mask, twigs, x, y, ang, len, th, depth, r) {
  const segs = [];
  const grow = (x, y, a, len, th, d) => {
    let cx = x, cy = y;
    for (let p = 0; p < 3; p++) { a += (r() - 0.5) * 0.4; const nx = cx + Math.cos(a) * len / 3, ny = cy + Math.sin(a) * len / 3; segs.push([cx, cy, nx, ny, th]); cx = nx; cy = ny; }
    if (d <= 0) return;
    const kids = d > 5 ? 2 : (r() < 0.55 ? 2 : 3);
    for (let k = 0; k < kids; k++) grow(cx, cy, a + (k - (kids - 1) / 2) * (0.55 + r() * 0.4) + (r() - 0.5) * 0.3, len * (0.66 + r() * 0.14), th * 0.62, d - 1);
  };
  grow(x, y, ang, len, th, depth);
  const thin = 0.5 * chh / H;
  for (const [x0, y0, x1, y1, t] of segs) {
    if (t < thin * 0.55) { const a = S.toCell(x0, y0), b = S.toCell(x1, y1); const dx = b[0] - a[0], dy = b[1] - a[1], st = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))) || 1, code = slopeGlyph(dx, dy); for (let s = 0; s <= st; s++) { const i = S.idx(a[0] + dx * s / st, a[1] + dy * s / st); if (i >= 0) twigs.set(i, code); } continue; }
    const rad = Math.max(t, thin * 0.6);
    const a = S.toCell(Math.min(x0, x1) - rad, Math.min(y0, y1) - rad), b = S.toCell(Math.max(x0, x1) + rad, Math.max(y0, y1) + rad);
    for (let rr = Math.max(0, Math.floor(a[1])); rr <= Math.min(S.rows - 1, Math.ceil(b[1])); rr++)
      for (let cc = Math.max(0, Math.floor(a[0])); cc <= Math.min(S.cols - 1, Math.ceil(b[0])); cc++) {
        const i = rr * S.cols + cc, px = S.U[i] - x0, py = S.V[i] - y0, ex = x1 - x0, ey = y1 - y0;
        const h = clamp((px * ex + py * ey) / (ex * ex + ey * ey), 0, 1);
        if (Math.hypot(px - ex * h, py - ey * h) < rad) { mask[i] = 1; twigs.delete(i); }
      }
  }
}

// ---------- scenes ----------
const graveyard = {
  name: "The Graveyard", note: "fog rolls in over the old stones", bg: "#06060b",
  pal: [[[12, 12, 20], [120, 112, 92], [226, 216, 178], [255, 250, 228]],
        [[10, 12, 20], [62, 78, 98], [146, 164, 182], [214, 226, 236]],
        [[14, 14, 22], [150, 160, 200], [255, 255, 255]],
        [[8, 6, 16], [60, 42, 92], [150, 112, 186]]],
  init(S) {
    const r = rng(7), { n, U, V, A } = S, m = this.mask = new Uint8Array(n);
    this.star = new Float32Array(n); for (let i = 0; i < n; i++) this.star[i] = r();
    const hill = u => 0.2 + 0.03 * Math.sin(u * 2.3 + 1) + 0.018 * Math.sin(u * 5.1 + 2);
    for (let i = 0; i < n; i++) if (V[i] > hill(U[i])) m[i] = 1;
    this.mu = A * (A > 1 ? 0.17 : 0.05); this.mv = -0.25;
    const treeU = this.mu + Math.min(0.36, A * 0.18);
    const fill = (u0, v0, u1, v1, test) => { const a = S.toCell(u0, v0), b = S.toCell(u1, v1); for (let rr = Math.max(0, Math.floor(a[1])); rr <= Math.min(S.rows - 1, Math.ceil(b[1])); rr++) for (let cc = Math.max(0, Math.floor(a[0])); cc <= Math.min(S.cols - 1, Math.ceil(b[0])); cc++) { const i = rr * S.cols + cc; if (test(U[i], V[i])) m[i] = 1; } };
    const count = Math.max(4, Math.round(A * 7));
    for (let k = 0; k < count; k++) {
      const u = -A / 2 + (k + 0.2 + r() * 0.6) * (A / count);
      if (Math.abs(u - treeU) < 0.05) continue;
      const w = 0.03 + r() * 0.03, type = (r() * 3) | 0, h = w * (type === 1 ? 2.2 : 1.4 + r() * 1.1), base = hill(u) + 0.015, tilt = (r() - 0.5) * 0.28;
      const c = Math.cos(tilt), s = Math.sin(tilt);
      fill(u - h, base - h - 0.03, u + h, base + 0.02, (x, y) => {
        const lx = x - u, ly = y - base, X = lx * c + ly * s, Y = -lx * s + ly * c;
        if (Y > 0.02 || Y < -h) return false;
        if (type === 0) return Math.abs(X) < w / 2 && (Y > -h + w / 2 || Math.hypot(X, Y + h - w / 2) < w / 2);
        if (type === 1) return Math.abs(X) < w * 0.17 || (Math.abs(Y + h * 0.72) < w * 0.15 && Math.abs(X) < w * 0.5);
        const tip = h * 0.14; if (Y > -h + tip) return Math.abs(X) < (w / 2) * (1 - 0.3 * (-Y / h));
        return Math.abs(X) < (w / 2) * 0.72 * ((Y + h) / tip);
      });
    }
    this.twigs = new Map();
    growTree(S, m, this.twigs, treeU, hill(treeU) + 0.02, -Math.PI / 2 - 0.16, 0.17, 0.017, 7, r);
    this.bats = [...Array(7)].map(() => ({ u0: r() * 9, sp: (0.04 + r() * 0.05) * (r() < 0.5 ? -1 : 1), v0: -0.42 + r() * 0.3, f: 1 + r(), ph: r() * TAU }));
  },
  frame(S, t) {
    const { n, U, V, val, chn, gly, A } = S, m = this.mask, st = this.star, mu = this.mu, mv = this.mv, mr = 0.095;
    for (let i = 0; i < n; i++) {
      const u = U[i], v = V[i];
      let b = 0.03 + 0.07 * sstep(-0.5, 0.2, v), c = 3;
      if (st[i] > 0.993 && v < 0.08) { b = 0.22 + 0.4 * (0.5 + 0.5 * Math.sin(t * 1.7 + st[i] * 900)); c = 2; }
      const du = u - mu, dv = v - mv, d = Math.sqrt(du * du + dv * dv);
      if (d < mr) { const k = d / mr; b = (0.8 + 0.55 * (fbm(du * 24 + 3, dv * 24 + 5, 3) - 0.5)) * (0.7 + 0.3 * Math.sqrt(1 - k * k)); c = 0; }
      else { const h = 0.34 * Math.exp(-(d - mr) * 10); if (h > b) { b = h; c = 0; } }
      const bank = sstep(-0.06, 0.16, v) * (1 - sstep(0.18, 0.3, v));
      if (bank > 0) { const f = bank * (0.2 + 0.32 * fbm(u * 3 + t * 0.02, v * 8, 3)); if (f > b) { b = f; c = 1; } }
      if (v < 0.12) { const cl = sstep(0.5, 0.7, fbm(u * 1.6 + t * 0.022, v * 4.5 + 7, 4)); if (cl > 0) { const lit = 0.1 + 0.6 * Math.exp(-d * 4.5); b = mix(b, lit, cl * 0.85); if (cl > 0.35) c = 1; } }
      if (m[i]) b = 0;
      const g = sstep(0.1, 0.4, v);
      if (g > 0) { const f = g * sstep(0.4, 0.75, fbm(u * 2.4 - t * 0.07, v * 7 + t * 0.03, 4) * 0.6 + fbm(u * 1.3 + t * 0.045 + 9, v * 4, 3) * 0.5) * 0.62; if (f > b) { b = f; c = 1; } }
      val[i] = b; chn[i] = c;
    }
    for (const [i, code] of this.twigs) if (val[i] < 0.3 || chn[i] === 0) { val[i] = chn[i] === 0 ? 0.12 : 0.2; chn[i] = 3; gly[i] = code; }
    const span = A + 0.4, frames = ["\\v/", "-v-", "/v\\", "-v-"];
    for (const bt of this.bats) {
      const u = ((bt.u0 + bt.sp * t) % span + span) % span - span / 2, v = bt.v0 + 0.03 * Math.sin(t * bt.f + bt.ph) + 0.01 * Math.sin(t * bt.f * 3.1);
      const p = S.toCell(u, v); S.text(p[0], Math.round(p[1]), frames[((t * 9 + bt.ph) | 0) % 4], 0.5, 3);
    }
  }
};

const pumpkin = {
  name: "The Lantern", note: "a candle burns inside the carved gourd", bg: "#070504",
  pal: [[[16, 6, 2], [120, 40, 6], [232, 112, 22], [255, 196, 100]],
        [[34, 16, 0], [205, 125, 22], [255, 218, 96], [255, 250, 222]],
        [[6, 10, 4], [42, 72, 22], [118, 156, 56]],
        [[8, 5, 10], [46, 24, 40], [98, 54, 72]]],
  init() { const r = rng(31); this.embers = [...Array(34)].map(() => ({ u: (r() - 0.5), sp: 0.05 + r() * 0.09, ph: r() * TAU, off: r() })); },
  frame(S, t) {
    const { n, U, V, val, chn, gly } = S;
    const flick = 0.74 + 0.26 * (n1(t * 7) * 0.6 + n1(t * 13 + 5) * 0.4);

const lab = {
  name: "The Laboratory", note: "it's alive", bg: "#040608",
  pal: [[[10, 14, 24], [92, 132, 222], [192, 216, 255], [255, 255, 255]],
        [[14, 8, 4], [112, 62, 30], [202, 122, 62], [255, 192, 122]],
        [[5, 10, 10], [26, 62, 64], [62, 122, 122], [112, 182, 176]],
        [[6, 6, 8], [30, 30, 38], [72, 72, 86]]],
  init() { this.r = rng(77); this.bolt = null; this.life = 0; this.next = 1.2; this.flash = 0; },
  gen(x0, y0, x1, y1, disp, depth, out) {

    const ox = mx - dy / l * (r() - 0.5) * disp, oy = my + dx / l * (r() - 0.5) * disp;
    this.gen(x0, y0, ox, oy, disp / 2, depth - 1, out); this.gen(ox, oy, x1, y1, disp / 2, depth - 1, out);
    if (depth >= 3 && r() < 0.4) { const a = Math.atan2(dy, dx) + (r() - 0.5) * 1.6; this.gen(ox, oy, ox + Math.cos(a) * l * 0.35, oy + Math.sin(a) * l * 0.35, disp / 3, depth - 2, out); }
  },
  frame(S, t, dt) {
    const { n, U, V, val, chn, A } = S, r = this.r, cx = Math.min(0.42, A * 0.38);

      const sh = v > -0.12 && Math.abs(u) < Math.min(0.36, 0.12 + (v + 0.12) * 3);

    if (this.life > 0) {
      const out = [], sx = this.side * cx, ex = this.tgt < 0.5 ? -sx : sx * 0.2 + (this.tgt - 0.5) * 0.4, ey = this.tgt < 0.5 ? -0.06 : -0.48;
      this.gen(sx, -0.06, ex, ey, 0.18, 6, out);

  }

const drain = {

const streetlamp = {
  name: "The Streetlamp", note: "a visitor waits in the fog", bg: "#04050a",
  pal: [[[6, 8, 14], [72, 80, 94], [172, 176, 182], [246, 240, 226]],
        [[10, 8, 4], [122, 98, 52], [232, 202, 122], [255, 246, 202]],
        [[6, 6, 10], [42, 42, 54], [92, 92, 112]],
        [[3, 4, 10], [18, 22, 40], [40, 48, 82]]],
  init(S) {
    const r = rng(41), A = S.A; this.mask = new Uint8Array(S.n); this.twigs = new Map();
    const tu = -A / 2 + 0.04; growTree(S, this.mask, this.twigs, tu, 0.34, -Math.PI / 2 - 0.12, 0.17, 0.018, 7, r);
  },
  frame(S, t) {
    const { n, U, V, val, chn, gly, A } = S, m = this.mask;
    const lu = -A * 0.18, lv = -0.27, hx = A * 0.14, wu = hx + Math.min(0.12, A * 0.1), wv = -0.24, gr = 0.33;
    const bdx = -0.88, bdy = 0.48, mu = lu + 0.1;
    const lf = 0.9 + 0.1 * n1(t * 3) - (hash2(Math.floor(t * 20), 4) < 0.02 ? 0.4 : 0), bf = 0.75 + 0.25 * n1(t * 0.6 + 3);
    for (let i = 0; i < n; i++) {
      const u = U[i], v = V[i];
      const fog = fbm(u * 2 + t * 0.04, v * 3 + t * 0.01, 4);
      let b = 0.04 + 0.16 * fog * sstep(0.5, -0.3, v), c = 3;

const birds = {
  name: "The Birds", note: "they keep gathering", bg: "#0b0c0f",
  pal: [[[12, 13, 16], [92, 97, 106], [176, 181, 187], [228, 230, 232]],
        [[4, 4, 6], [16, 16, 20], [30, 30, 36]],
        [[10, 10, 12], [50, 52, 58], [96, 99, 106]]],
  init(S) {
    const r = this.r = rng(55), A = S.A;
    this.poles = []; for (let p = -A / 2 - 0.2; p < A / 2 + 1.2; p += 1.05) this.poles.push(p + 0.25);
    this.wires = [[-0.12, -0.085, 0.07], [-0.12, 0.085, 0.07], [-0.04, -0.06, 0.05], [-0.04, 0.06, 0.05]];
    this.slots = [];
    for (let w = 0; w < 4; w++) for (let u = -A / 2 + 0.04; u < A / 2 - 0.02; u += 0.034 + r() * 0.03) this.slots.push({ w, u, dir: r() < 0.5 ? -1 : 1, from: (r() - 0.5) * 2, j: r() });
    for (let k = this.slots.length - 1; k > 0; k--) { const j = (r() * (k + 1)) | 0; [this.slots[k], this.slots[j]] = [this.slots[j], this.slots[k]]; }
  },
  wireY(w, u) {
    const [y, off, sag] = this.wires[w], p0 = this.poles[0] + off, left = p0 + Math.floor((u - p0) / 1.05) * 1.05, q = (u - left) / 1.05;
    return y + sag * 4 * q * (1 - q);
  },
  frame(S, t) {
    const { n, U, V, val, chn, gly, A } = S, cyc = 52, ph = t % cyc, land = 40;
    for (let i = 0; i < n; i++) {
      const u = U[i], v = V[i];
      let b = 0.55 - 0.25 * v + 0.14 * (fbm(u * 1.2 + t * 0.02, v * 2.5, 4) - 0.5), c = 0;
      const tl = 0.37 - 0.06 * fbm(u * 5, 0.2, 3); if (v > tl) { b = 0.07; c = 2; }
      for (const p of this.poles) { const du = u - p; if ((Math.abs(du) < 0.008 && v > -0.16 && v < tl) || (Math.abs(v + 0.12) < 0.006 && Math.abs(du) < 0.1) || (Math.abs(v + 0.04) < 0.006 && Math.abs(du) < 0.075)) { b = 0.05; c = 2; } }
      val[i] = b; chn[i] = c;
    }
    for (let w = 0; w < 4; w++) { let pu = -A / 2 - 0.05, pv = this.wireY(w, pu); for (let u = pu + 0.025; u < A / 2 + 0.06; u += 0.025) { const v = this.wireY(w, u); S.lineUV(pu, pv, u, v, 0.04, 1, true); pu = u; pv = v; } }

      const s = this.slots[k], bu = s.u, bv = this.wireY(s.w, s.u), arrive = Math.pow((k + 1) / (this.slots.length * 1.05), 1 / 1.4) * land;
      const ft = ph - arrive, off = ph > land ? ph - land - s.j * 2.5 : -1;
      if (off > 0) { const p = S.toCell(bu + s.dir * off * 0.25 + Math.sin(off * 3 + k) * 0.02, bv - off * 0.3 - off * off * 0.05); S.text(p[0], Math.round(p[1]), frames[((t * 10 + k) | 0) % 4], 0.04, 1); continue; }
      if (ft < 1.2) { const q = 1 - ft / 1.2, p = S.toCell(bu + s.from * q * 0.6, bv - q * 0.3); S.text(p[0], Math.round(p[1]), frames[((t * 10 + k) | 0) % 4], 0.04, 1); continue; }
      const a0 = S.toCell(bu - sz, bv - sz * 1.4), a1 = S.toCell(bu + sz, bv);
      for (let rr = Math.max(0, Math.floor(a0[1])); rr <= Math.min(S.rows - 1, Math.ceil(a1[1])); rr++) for (let cc = Math.max(0, Math.floor(a0[0])); cc <= Math.min(S.cols - 1, Math.ceil(a1[0])); cc++) {
        const i = rr * S.cols + cc, x = (U[i] - bu) / sz * s.dir, y = (V[i] - bv) / sz;
        const body = ((x - 0.05) / 0.55) ** 2 + ((y + 0.5) / 0.38) ** 2 < 1, head = Math.hypot(x + 0.45, y + 0.95) < 0.24, tail = x > 0.4 && x < 0.95 && Math.abs(y + 0.25 - (x - 0.4) * 0.4) < 0.1;
        if (body || head || tail) { val[i] = 0.012; chn[i] = 1; gly[i] = 0; }

const SC = [pumpkin, graveyard, cauldron, watchers, manor, ghosts, web, catacombs, hallway, tape, nosferatu, lab, drain, streetlamp, birds];
SC.forEach(s => s.colors = buildPal(s.pal));

// ---------- loop + ui ----------
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const speed = reduce ? 0.4 : 1;
let scene = null, idx = 0, T = 0, last = 0, auto = true, switching = false, autoAt = 0;
const AUTO_SECS = 50;
const $ = id => document.getElementById(id);
const stage = $("stage");
try { const v = localStorage.getItem("hh-auto"); if (v !== null) auto = v === "1"; } catch (e) {}

const dots = $("dots");
SC.forEach((s, k) => { const b = document.createElement("button"); b.textContent = String(k + 1); b.setAttribute("aria-label", s.name); b.addEventListener("click", () => go(k)); dots.appendChild(b); });

function show(k) {
  idx = (k + SC.length) % SC.length; scene = SC[idx]; T = 0; autoAt = performance.now();
  scene.init(S);
  $("num").textContent = `No. ${idx + 1} of ${SC.length}`; $("name").textContent = scene.name; $("note").textContent = scene.note;
  [...dots.children].forEach((b, j) => b.setAttribute("aria-current", j === idx ? "true" : "false"));
  try { history.replaceState(null, "", "#" + scene.name.split(" ")[1].toLowerCase()); } catch (e) {}
}
function go(k) {
  if (switching) return; switching = true; stage.classList.add("out");
  setTimeout(() => { show(k); stage.classList.remove("out"); switching = false; }, 700);
}
function setAuto(v) { auto = v; $("auto").setAttribute("aria-pressed", String(v)); autoAt = performance.now(); try { localStorage.setItem("hh-auto", v ? "1" : "0"); } catch (e) {} }

$("prev").addEventListener("click", () => go(idx - 1));
$("next").addEventListener("click", () => go(idx + 1));
$("auto").addEventListener("click", () => setAuto(!auto));
$("fs").addEventListener("click", () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} });
window.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(idx + 1); else if (e.key === "ArrowLeft") go(idx - 1);
  else if (e.key === " ") { e.preventDefault(); setAuto(!auto); }
  else if (e.key === "f" || e.key === "F") $("fs").click();
  else if (/^[0-9]$/.test(e.key)) { const k = e.key === "0" ? 9 : +e.key - 1; if (k < SC.length) go(k); }
  wake();
});
let idleT = 0;
function wake() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2600); }
window.addEventListener("pointermove", e => { mouse.u = (e.clientX - W / 2) / H; mouse.v = (e.clientY - H / 2) / H; mouse.at = performance.now(); wake(); });
window.addEventListener("pointerdown", wake);
window.addEventListener("resize", () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 120); });
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}

function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / 30 - 2) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.n === 0) { if (window.innerWidth && window.innerHeight) resize(), scene.init(S); return; }
  T += dt * speed;
  S.val.fill(0); S.chn.fill(0); S.gly.fill(0);
  scene.frame(S, T, dt * speed);
  draw(scene);
  if (auto && !switching && now - autoAt > AUTO_SECS * 1000) go(idx + 1);
}

const start = () => {
  resize();
  setAuto(auto);
  const h = (location.hash || "").slice(1);
  const k = SC.findIndex(s => s.name.split(" ")[1].toLowerCase() === h);
  show(k >= 0 ? k : 0);
  wake();
  requestAnimationFrame(t => { last = t; loop(t); });
};
(document.fonts && document.fonts.load) ? Promise.race([document.fonts.load(`16px "IBM Plex Mono"`), new Promise(r => setTimeout(r, 1500))]).then(start, start) : start();
})();
