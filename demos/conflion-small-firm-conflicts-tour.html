<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newton's Small Firm Conflicts Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>/* A light or dark choice made with the page's own button wins over the device setting. */ try { const th = localStorage.getItem('newton-theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pixelify+Sans:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one 800x480 scene, scaled to fit, with Newton living inside it; his speech bubble sits under it, chapter dots under that. */
:root {
  --bg: #e6efe8;
  --stage: #f4f8f4;
  --surface: #ffffff;
  --surface-2: #eef4ef;
  --line: #cddbd1;
  --ink: #17251e;
  --muted: #55675d;
  --green: #2c6a4f;
  --green-2: #3f8a68;
  --on-green: #ffffff;
  --mint: #d8eadf;
  --amber-bg: #f8ead2;
  --amber: #8a5a12;
  --tabby: #e9903f;
  --brass: #d2ad6a;
  --navy: #1f3b6e;
  --brand: var(--green); --on-brand: var(--on-green); --brand-2: var(--green-2);
  --hi: #b4322a; --hi-bg: #fbe2de;
  --mid: #93650c; --mid-bg: #fbefd4;
  --lo: #2c6a4f; --lo-bg: #dcefe3;
  --shadow: 0 14px 34px rgba(23, 50, 36, .14);
  --f-display: 'Fredoka', 'Baloo 2', ui-rounded, 'Nunito', system-ui, sans-serif;
  --f-ui: 'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-pixel: 'Pixelify Sans', ui-monospace, 'SF Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1813; --stage: #14221b; --surface: #1b2c23; --surface-2: #213429; --line: #2f4638;
    --ink: #e5efe8; --muted: #a2b6aa; --green: #4f9e78; --green-2: #6cb891; --on-green: #08130d; --mint: #23402f;
    --amber-bg: #3a2f1c; --amber: #f0c47a; --tabby: #f2a55c; --brass: #e2c07f; --navy: #6d8fd0;
    --hi: #ff8f84; --hi-bg: #45231f; --mid: #f0c47a; --mid-bg: #3d321c; --lo: #7fd0a6; --lo-bg: #1f3a2b;
    --shadow: 0 14px 34px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1813; --stage: #14221b; --surface: #1b2c23; --surface-2: #213429; --line: #2f4638;
  --ink: #e5efe8; --muted: #a2b6aa; --green: #4f9e78; --green-2: #6cb891; --on-green: #08130d; --mint: #23402f;
  --amber-bg: #3a2f1c; --amber: #f0c47a; --tabby: #f2a55c; --brass: #e2c07f; --navy: #6d8fd0;
  --hi: #ff8f84; --hi-bg: #45231f; --mid: #f0c47a; --mid-bg: #3d321c; --lo: #7fd0a6; --lo-bg: #1f3a2b;
  --shadow: 0 14px 34px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.page { max-width: 960px; margin: 0 auto; display: grid; gap: 14px; }
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header.top h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.35rem, 3.6vw, 1.9rem); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
header.top .tag { font-family: var(--f-pixel); font-size: .8rem; color: var(--green); background: var(--mint); padding: 3px 9px; border-radius: 999px; }

/* Stage */
.wrap { position: relative; width: 100%; aspect-ratio: 800 / 480; max-width: 100%; border-radius: 22px; overflow: hidden; background: var(--stage); box-shadow: var(--shadow); border: 1px solid var(--line); }
.vp { position: absolute; left: 0; top: 0; width: 800px; height: 480px; transform-origin: 0 0; font-size: 17px; }
.bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; background: var(--mint); opacity: .7; animation: drift 18s ease-in-out infinite alternate; }
.blob.b2 { animation-duration: 23s; animation-direction: alternate-reverse; background: var(--amber-bg); }
.blob.b3 { animation-duration: 29s; }
@keyframes drift { to { transform: translate(40px, -26px) scale(1.12); } }
.paw { position: absolute; width: 22px; height: 22px; opacity: .14; color: var(--green); animation: paw 14s linear infinite; }
@keyframes paw { 0% { transform: translateY(40px) rotate(0); opacity: 0; } 15% { opacity: .16; } 85% { opacity: .16; } 100% { transform: translateY(-520px) rotate(80deg); opacity: 0; } }
.sc { position: absolute; inset: 0; }
canvas.fx { position: absolute; inset: 0; pointer-events: none; z-index: 40; }

/* Newton */
.newton { position: absolute; left: 0; top: 0; width: 132px; height: 120px; z-index: 30; will-change: transform; }
.nt-shadow { position: absolute; left: 22px; right: 22px; bottom: -6px; height: 12px; border-radius: 50%; background: rgba(20, 40, 28, .16); }
.nt-body { position: absolute; inset: 0; transform-origin: 50% 100%; }
.nt-body img { position: absolute; bottom: 0; left: 50%; image-rendering: pixelated; transform: translateX(-50%); }
.nt-body.flip img { transform: translateX(-50%) scaleX(-1); }
.zzz { position: absolute; font-family: var(--f-pixel); color: var(--green); font-size: 22px; animation: zz 2.6s ease-out infinite; }
@keyframes zz { from { transform: translate(0, 0) scale(.6); opacity: 0; } 30% { opacity: 1; } to { transform: translate(30px, -70px) scale(1.2); opacity: 0; } }

/* Speech bubble */
.bubble { position: relative; background: var(--surface); border: 2px solid var(--ink); border-radius: 20px; padding: 14px 18px 14px 18px; min-height: 5.6em; box-shadow: 4px 5px 0 var(--ink); display: flex; gap: 12px; align-items: flex-start; }
.bubble .tail { position: absolute; top: -14px; left: 12%; width: 24px; height: 14px; transition: left .9s cubic-bezier(.2, .8, .2, 1); }
.bubble .tail::before { content: ""; position: absolute; inset: 0; background: var(--ink); clip-path: polygon(0 100%, 50% 0, 100% 100%); }
.bubble .tail::after { content: ""; position: absolute; left: 4px; right: 4px; top: 5px; bottom: -3px; background: var(--surface); clip-path: polygon(0 100%, 50% 0, 100% 100%); }
.bubble .who { font-family: var(--f-pixel); font-size: .78rem; color: var(--tabby); flex: none; padding-top: 4px; letter-spacing: .04em; }
.bubble p { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(1.02rem, 2.4vw, 1.3rem); line-height: 1.38; min-width: 0; text-wrap: pretty; }
.bubble p .caret { display: inline-block; width: .5em; height: 1em; vertical-align: -.12em; background: var(--tabby); margin-left: 2px; border-radius: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* Controls */
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { font: 600 .95rem var(--f-ui); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
.btn:hover { border-color: var(--green); }
.btn:focus-visible, .dot:focus-visible, .play-big:focus-visible { outline: 3px solid var(--tabby); outline-offset: 2px; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--on-green); min-width: 104px; justify-content: center; }
.btn svg { width: 16px; height: 16px; }
.now { margin-left: auto; font-size: .92rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.now b { color: var(--ink); }
.progress { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--tabby)); border-radius: inherit; }
.shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 22px; align-items: start; }
.shell .page { margin: 0; max-width: none; }
.menu { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 10px; display: grid; gap: 2px; max-height: calc(100vh - 32px); overflow: auto; }
.menu .mh { font: 600 .74rem var(--f-pixel); letter-spacing: .06em; color: var(--muted); padding: 10px 8px 4px; text-transform: uppercase; }
.menu .mh:first-child { padding-top: 2px; }
.menu .mh.extra { color: var(--amber); }
.menu button { all: unset; box-sizing: border-box; cursor: pointer; font: 500 .92rem var(--f-ui); color: var(--ink); padding: 6px 8px 6px 10px; border-radius: 9px; display: flex; gap: 8px; align-items: baseline; line-height: 1.3; }
.menu button .i { font: 600 .72rem var(--f-ui); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.4em; }
.menu button:hover { background: var(--surface-2); }
.menu button:focus-visible { outline: 3px solid var(--tabby); outline-offset: 1px; }
.menu button[aria-current="true"] { background: var(--mint); font-weight: 600; }
.menu button[aria-current="true"] .i { color: var(--green); }
.menu button.seen .i::after { content: " ✓"; color: var(--green); }
.menu-btn { display: none; margin-left: auto; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu { display: none; position: static; max-height: none; grid-row: 2; }
  .menu.open { display: grid; }
  .shell .page { grid-row: 1; }
  .menu-btn { display: inline-flex; }
  .shell { gap: 0; }
  .menu.open { margin-top: -6px; margin-bottom: 14px; }
}
.dot { font: 600 .8rem var(--f-ui); border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
.dot[aria-current="true"] { background: var(--mint); border-color: var(--green); color: var(--ink); }
.dot.seen { color: var(--ink); }
.note { font-size: .84rem; color: var(--muted); margin: 2px 0 0; line-height: 1.45; }

/* Mock app pieces (inside the 800x480 scene) */
.win { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.win-bar { height: 38px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 15px; }
.win-bar .dots { display: flex; gap: 6px; } .win-bar .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.brand { display: inline-flex; align-items: center; gap: 7px; font: 600 16px var(--f-ui); }
.brand svg { width: 20px; height: 20px; }
.pill { font: 700 10px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; background: var(--mint); color: var(--green); padding: 3px 7px; border-radius: 999px; }
.win-title { margin-left: auto; color: var(--muted); font-size: 14px; }
.win-body { position: absolute; left: 0; right: 0; top: 38px; bottom: 0; padding: 18px 22px; overflow: hidden; }
.h2 { font: 600 26px/1.15 var(--f-display); margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
.gbtn { display: inline-flex; align-items: center; justify-content: center; background: var(--green); color: var(--on-green); font: 600 15px var(--f-ui); border-radius: 9px; padding: 8px 14px; }
.obtn { display: inline-flex; align-items: center; justify-content: center; background: var(--surface); border: 1.5px solid var(--line); color: var(--ink); font: 600 14px var(--f-ui); border-radius: 9px; padding: 6px 11px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font: 700 12px var(--f-ui); border-radius: 999px; padding: 3px 9px; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.b-hi { color: var(--hi); background: var(--hi-bg); } .b-mid { color: var(--mid); background: var(--mid-bg); } .b-lo { color: var(--lo); background: var(--lo-bg); }
.field { display: grid; gap: 3px; }
.field label { font: 600 12px var(--f-ui); color: var(--muted); letter-spacing: .02em; }
.input { min-height: 32px; border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 15px; background: var(--surface); white-space: nowrap; overflow: hidden; }
.input.on { border-color: var(--green); box-shadow: 0 0 0 3px var(--mint); }
.ghost { color: var(--muted); opacity: .6; }
.kbd { font: 700 12px var(--f-ui); border: 1.5px solid var(--ink); border-bottom-width: 3px; border-radius: 6px; padding: 1px 6px; background: var(--surface); }
.tick { width: 22px; height: 22px; flex: none; }
.tick path { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.cursor { position: absolute; left: 0; top: 0; width: 26px; height: 30px; z-index: 35; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25)); }
.ripple { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid var(--tabby); z-index: 34; pointer-events: none; }
.look { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px dashed var(--tabby); z-index: 33; pointer-events: none; }

/* Scene specifics */
.title-tile { position: absolute; left: 330px; top: 70px; width: 150px; height: 150px; }
.title-tile svg, .logo-box svg { width: 100%; height: 100%; display: block; }
.title-word { position: absolute; left: 200px; top: 236px; width: 560px; text-align: center; font: 700 76px/1 var(--f-display); letter-spacing: -.02em; color: var(--ink); }
.title-word span { display: inline-block; }
.title-sub { position: absolute; left: 200px; top: 326px; width: 560px; text-align: center; display: flex; justify-content: center; gap: 10px; align-items: center; }
.title-sub .pill { font-size: 14px; padding: 5px 12px; }
.title-sub em { font: 500 20px var(--f-display); font-style: normal; color: var(--muted); }
.play-big { position: absolute; left: 400px; top: 380px; transform: translateX(-50%); font: 600 18px var(--f-display); background: var(--green); color: var(--on-green); border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer; box-shadow: 0 6px 0 rgba(20, 60, 40, .35); display: inline-flex; gap: 10px; align-items: center; animation: nudge 2.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(-50%) translateY(-4px); } }

.seg { display: inline-flex; position: relative; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px; }
.seg span { position: relative; z-index: 1; padding: 7px 16px; font-weight: 600; font-size: 15px; }
.seg .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: 50%; border-radius: 999px; background: var(--navy); }
.menu-row { display: flex; align-items: center; gap: 8px; height: 23px; font-size: 14.5px; overflow: hidden; white-space: nowrap; }
.menu-row i { width: 7px; height: 7px; border-radius: 2px; background: var(--line); flex: none; }
.person { width: 40px; height: 54px; position: relative; }
.person::before { content: ""; position: absolute; left: 10px; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--c, var(--green)); }
.person::after { content: ""; position: absolute; left: 3px; top: 23px; width: 34px; height: 30px; border-radius: 17px 17px 6px 6px; background: var(--c, var(--green)); }

.dtn { background: var(--amber-bg); border-left: 5px solid var(--amber); border-radius: 12px; padding: 12px 16px; }
.eyebrow { font: 700 11px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--amber); }
.dtn h3 { font: 600 19px/1.25 var(--f-display); margin: 4px 0 10px; min-height: 24px; }
.big { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.big b { display: block; font-size: 15px; } .big small { color: var(--muted); font-size: 12.5px; }
.big.g { background: var(--green); color: var(--on-green); border-color: var(--green); } .big.g small { color: var(--on-green); opacity: .85; }

.nextbar { display: flex; align-items: center; gap: 10px; background: var(--mint); border-radius: 10px; padding: 7px 12px; font-size: 15px; height: 42px; overflow: hidden; }
.nextbar .what { position: relative; flex: 1; height: 22px; overflow: hidden; }
.nextbar .what span { position: absolute; left: 0; top: 0; white-space: nowrap; }
.sec { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 8px; background: var(--surface); }
.sec-h { display: flex; align-items: center; gap: 9px; font: 600 16px var(--f-display); }
.num { width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: var(--on-green); display: grid; place-items: center; font: 700 13px var(--f-ui); flex: none; }
.ring { position: absolute; width: 64px; height: 64px; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bgc { stroke: var(--surface-2); } .ring .fg { stroke: var(--green); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring-lbl { position: absolute; width: 64px; text-align: center; font: 700 15px var(--f-ui); font-variant-numeric: tabular-nums; }

.res { display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); border-left: 5px solid var(--c); border-radius: 12px; padding: 10px 14px; background: var(--surface); }
.res b { font-size: 16px; } .res small { display: block; color: var(--muted); font-size: 13px; }
.res .why { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); max-width: 210px; }

.steps { display: flex; gap: 8px; position: relative; }
.step { font: 600 13px var(--f-ui); border-radius: 999px; padding: 6px 12px; background: var(--surface-2); color: var(--muted); position: relative; z-index: 1; }
.step.on { background: var(--green); color: var(--on-green); }
.choices { display: flex; gap: 7px; flex-wrap: wrap; }
.stamp { position: absolute; border: 4px solid var(--green); color: var(--green); border-radius: 10px; padding: 8px 14px; font: 700 20px var(--f-display); text-transform: uppercase; letter-spacing: .04em; background: var(--surface); transform: rotate(-7deg); white-space: nowrap; }
.stamp small { display: block; font: 600 13px var(--f-ui); text-transform: none; letter-spacing: 0; }
.slot { display: inline-flex; font: 700 40px/1 var(--f-display); font-variant-numeric: tabular-nums; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; border: 1.5px solid var(--line); }
.slot .col { height: 40px; overflow: hidden; display: inline-block; }
.slot .col div { display: flex; flex-direction: column; }
.slot .col span { height: 40px; display: block; }
.lock { width: 46px; height: 54px; position: relative; }
.lock .shackle { position: absolute; left: 9px; top: 0; width: 28px; height: 30px; border: 6px solid var(--amber); border-bottom: 0; border-radius: 16px 16px 0 0; transform-origin: 90% 100%; }
.lock .body { position: absolute; left: 0; bottom: 0; width: 46px; height: 32px; border-radius: 8px; background: var(--amber); }
.doc { width: 46px; height: 58px; border-radius: 6px; background: var(--surface); border: 2px solid var(--ink); position: relative; }
.doc::before { content: ""; position: absolute; left: 8px; right: 8px; top: 12px; height: 26px; background: repeating-linear-gradient(var(--line) 0 3px, transparent 3px 8px); }
.doc::after { content: ""; position: absolute; left: 8px; bottom: 7px; width: 20px; height: 8px; border-bottom: 2px solid var(--green); border-radius: 0 0 10px 10px; }
.checkrow { display: flex; align-items: center; gap: 10px; font-size: 15px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.card3 { border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px; position: absolute; }
.card3 h4 { margin: 0 0 6px; font: 600 15px var(--f-ui); color: var(--muted); }
.flipper { perspective: 600px; }
.fee { font: 700 30px var(--f-display); text-align: center; padding: 16px 0 6px; backface-visibility: hidden; }
.fee small { display: block; font: 600 14px var(--f-ui); color: var(--muted); }
.coin { position: absolute; width: 44px; height: 14px; border-radius: 50%; background: var(--brass); border: 2px solid var(--amber); }
.cal { position: relative; width: 110px; height: 110px; perspective: 500px; margin: 4px auto 6px; }
.cal .pg { position: absolute; inset: 0; border-radius: 12px; background: var(--surface); border: 2px solid var(--ink); overflow: hidden; transform-origin: 50% 0; text-align: center; backface-visibility: hidden; }
.cal .pg b { display: block; background: var(--green); color: var(--on-green); font: 700 14px var(--f-ui); padding: 4px 0; letter-spacing: .1em; }
.cal .pg span { display: block; font: 700 44px/1.1 var(--f-display); padding-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 13px var(--f-ui); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.sheet { position: absolute; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); font-size: 13.5px; }
.sheet .r { display: grid; grid-template-columns: 1.5fr 1.4fr 1fr .8fr; border-bottom: 1px solid var(--line); }

const parts = [];
const CONF = ['#2c6a4f', '#e9903f', '#d2ad6a', '#6cb891', '#b4322a', '#1f3b6e'];

  }

}

/* ---------- running the show ---------- */
const menu = $('menu'), menuBtn = $('menuBtn');
const seen = new Set(), mButtons = [];
const narrow = matchMedia('(max-width: 900px)');
function placeMenu() { const hd = document.querySelector('header.top'); if (narrow.matches) hd.after(menu); else document.querySelector('.shell').prepend(menu); }
placeMenu(); narrow.addEventListener?.('change', placeMenu);
SECTIONS.forEach(([name, idx]) => {
  h('div', 'mh' + (/additional/i.test(name) ? ' extra' : ''), name, menu);
  idx.forEach(i => { const b = h('button', null, `<span class="i">${i + 1}</span><span>${SCENES[i].title}</span>`, menu); b.type = 'button'; b.addEventListener('click', () => { unlockAudio(); enter(i); play(); if (narrow.matches) toggleMenu(false); }); mButtons[i] = b; });
});
function toggleMenu(open) { menu.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', String(open)); }
menuBtn.addEventListener('click', () => toggleMenu(!menu.classList.contains('open')));
$('sceneCount').textContent = SCENES.length + ' short scenes';
const sectionOf = (i) => (SECTIONS.find(([, idx]) => idx.includes(i)) || [''])[0];

function enter(i, rest = false) {
  cur = i; t = 0; actions = []; typers = []; parts.length = 0; nt.face = null; nt.sleeping = false; seen.add(i);
  vp.querySelectorAll('.sc, .look, .ripple').forEach(n => n.remove());
  hideCursor();
  layer = h('div', 'sc', '', null); vp.insertBefore(layer, ntEl);
  const S = SCENES[i]; placeNewton(...S.nt);
  if (!rest && !RM) A(layer, [{ clipPath: `circle(0px at ${nt.x + 66}px ${nt.y + 60}px)` }, { clipPath: `circle(1000px at ${nt.x + 66}px ${nt.y + 60}px)` }], { duration: 750, easing: 'cubic-bezier(.6,0,.3,1)', fill: 'none' });
  S.build(layer, rest);
  mButtons.forEach((b, k) => { b.setAttribute('aria-current', k === i ? 'true' : 'false'); b.classList.toggle('seen', seen.has(k) && k !== i); });
  $('now').innerHTML = `${sectionOf(i)} · scene <b>${i + 1}</b> of ${SCENES.length}`;
  menuBtn.textContent = 'Menu · ' + sectionOf(i);

function play() { if (playing) return; if (layer.querySelector('.play-big')) enter(0); playing = true; document.getAnimations().forEach(a => { if (a.playState === 'paused') a.play(); }); $('playLbl').textContent = 'Pause'; $('playIcon').innerHTML = '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/>'; }

function loop(now) {

enter(0, true);
requestAnimationFrame(loop);
