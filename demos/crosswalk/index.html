=== 7.1 cmt [3] | Rule 7.1 Comment
[3] This rule prohibits truthful statements that are misleading. A truthful statement is misleading if it omits a fact necessary to make the lawyer’s communication considered as a whole not materially misleading. A truthful statement is also misleading if it is presented in a manner that creates a substantial* likelihood that it will lead a reasonable* person* to formulate a specific conclusion about the lawyer or the lawyer’s services for which there is no reasonable* factual foundation. Any communication that states or implies “no fee without recovery” is also misleading unless the communication also expressly discloses whether or not the client will be liable for costs.

=== 7.1 cmt [4] | Rule 7.1 Comment

=== 7.2(a) | Rule 7.2 Advertising
Subject to the requirements of rules 7.1 and 7.3, a lawyer may advertise services through any written,* recorded or electronic means of communication, including public media.

=== 7.2(b) | Rule 7.2 Advertising
A lawyer shall not compensate, promise or give anything of value to a person* for the purpose of recommending or securing the services of the lawyer or the lawyer’s law firm,* except that a lawyer may:
(1) pay the reasonable* costs of advertisements or communications permitted by this rule;

Any communication made pursuant to this rule shall include the name and address of at least one lawyer or law firm* responsible for its content.

(1) is a lawyer; or
(2) has a family, close personal, or prior professional relationship with the lawyer.

=== 7.3(b) | Rule 7.3 Solicitation of Clients
A lawyer shall not solicit professional employment by written,* recorded or electronic communication or by in-person, telephone or real-time electronic contact even when not otherwise prohibited by paragraph (a), if:
(1) the person* being solicited has made known* to the lawyer a desire not to be solicited by the lawyer; or
(2) the solicitation is transmitted in any manner which involves intrusion, coercion, duress or harassment.

=== 7.3(c) | Rule 7.3 Solicitation of Clients
Every written,* recorded or electronic communication from a lawyer soliciting professional employment from any person* known* to be in need of legal services in a particular matter shall include the word “Advertisement” or words of similar import on the outside envelope, if any, and at the beginning and ending of any recorded or electronic communication, unless the recipient of the communication is a person* specified in paragraphs (a)(1) or (a)(2), or unless it is apparent from the context that the communication is an advertisement.

Notwithstanding the prohibitions in paragraph (a), a lawyer may participate with a prepaid or group legal service plan operated by an organization not owned or directed by the lawyer that uses in-person, live telephone or real-time electronic contact to solicit memberships or subscriptions for the plan from persons* who are not known* to need legal services in a particular matter covered by the plan.

=== 7.3(e) | Rule 7.3 Solicitation of Clients
As used in this rule, the terms “solicitation” and “solicit” refer to an oral or written* targeted communication initiated by or on behalf of the lawyer that is directed to a specific person* and that offers to provide, or can reasonably* be understood as offering to provide, legal services.

=== 7.3(f) | Rule 7.3 Solicitation of Clients
Even when not otherwise prohibited by this rule, a lawyer shall not solicit professional employment from a respondent in a domestic violence restraining order proceeding in connection with such proceeding, until after the respondent has been served with notice of the proceeding and proof of service appears on the court docket, unless the respondent is a current or former client and the communication is in furtherance of ongoing or potential representation consistent with rules 1.2, 1.4, or 1.9.

A lawyer shall not state that the lawyer is a certified specialist in a particular field of law, unless:
(1) the lawyer is currently certified as a specialist by the Board of Legal Specialization, or any other entity accredited by the State Bar to designate specialists pursuant to standards adopted by the Board of Trustees; and
(2) the name of the certifying organization is clearly identified in the communication.

<script>
const L = window.CW_LOGIC, D = CROSSWALK, REC = CW_RECORDED;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MODELS = { "claude-opus-5-5": { name: "Opus 5.5", tier: "complex" }, "claude-sonnet-5-5": { name: "Sonnet 5.5", tier: "default" }, "claude-fable-5-1": { name: "Fable 5.1", tier: "complex" } };
const CLASS_LABEL = { Editorial: "Wording only", ModifiedAction: "Changed duty", NewObligation: "New duty", RemovedObligation: "Duty removed" };
const ST_LABEL = { Broken: "Broken", NeedsReview: "Needs review", Valid: "Still matches" };
const ST_CLASS = { Broken: "bad", NeedsReview: "warn", Valid: "good", Stale: "warn" };
const HYP = `<span class="hyp">Hypothetical amendment — not a real rule change</span>`;

const A = L.analyze(D);
const baselineStatus = L.computeStatuses(A.edges, A.cur);
const state = { view: "after", edges: A.edges, audit: [], sel: null, models: {}, busy: false, flash: null };
let sample = null;

/* recorded model outputs, re-checked by code on load */
for (const r of REC.results) if (r.output) state.models[r.key] = { output: r.output, from: "recorded", model: REC.model };

function nodes(){ return state.view === "after" ? A.v2 : A.cur; }
function statuses(){ return L.computeStatuses(state.edges, nodes()); }
function diffOf(e){ return A.diffs.find(d => d.key === L.nodeKey(e.source_id, e.section_num)); }
function verdict(d){ const m = state.models[d.key]; if (!m) return null; return { ...L.verifyModel(m.output, d, A.edges.filter(e => d.edge_ids.includes(e.id))), from: m.from, model: m.model }; }
const short = h => h ? h.slice(0, 12) : "none";

const REAL_LABEL = { Valid: "Still matches the live page", NeedsReview: "Live page changed: needs review", Broken: "Section not found on the live page", Stale: "Matched earlier; latest fetch failed", Unchecked: "Not checked yet" };
function renderReal(){
  const box = $("#real"), R = typeof CW_REPORT === "undefined" ? null : CW_REPORT;
  if (!R){ box.innerHTML = `<div class="eyebrow">Real sources</div><div class="head">No live check has been run yet.</div><div class="meta">Run <span class="mono">node watch.js</span> in this folder, then rebuild.</div>`; return; }
  const edges = D.edges.map(e => ({ ...e, rep: R.edges[e.id] || { status: "Unchecked", reason: "Not in the report." } }));
  const n = k => edges.filter(e => e.rep.status === k).length, srcs = Object.entries(R.sources), okN = srcs.filter(([, s]) => s.ok).length;
  const demo = edges.filter(e => e.rep.pinned_demo), live = edges.filter(e => !e.rep.pinned_demo);
  const stale = live.filter(e => e.rep.status === "Stale"), bad = live.filter(e => e.rep.status !== "Valid" && e.rep.status !== "Stale"), good = live.filter(e => e.rep.status === "Valid");
  const parts = [];
  if (bad.length) parts.push(`${bad.length} ${bad.length === 1 ? "needs" : "need"} review`);
  if (stale.length) parts.push(`${stale.length} matched on an earlier fetch but the latest fetch failed, so ${stale.length === 1 ? "it is" : "they are"} not confirmed`);
  const head = (!parts.length ? `All ${live.length} real-pinned checks match the live pages.` : `${good.length} of ${live.length} real-pinned checks match the live pages; ${parts.join("; ")}.`) + (demo.length ? ` ${demo.length} more ${demo.length === 1 ? "is" : "are"} pinned to a demo snapshot and not counted.` : "");
  const aflNew = R.afl_index ? (R.afl_index.baseline ? "first snapshot of the index, so nothing is flagged as new yet" : R.afl_index.new_since_previous.length ? R.afl_index.new_since_previous.map(a => a.num).join(", ") + " new since the last check" : "no new letters since the last check") : "";
  const edgeRow = e => `<div class="row"><div class="t"><span class="mono">${esc(e.app)} · ${esc(e.item_id)}</span><br>${esc(e.item_cite)} → ${esc(e.section_num)}</div><span class="chip ${ST_CLASS[e.rep.status] || ""}">${esc(e.rep.pinned_demo ? "Pinned to a demo snapshot, not a live change" : REAL_LABEL[e.rep.status])}</span></div>`;
  const reviewBlock = e => {
    const nd = L.indexNodes(A.cur).get(L.nodeKey(e.source_id, e.section_num)), have = nd && nd.checksum === e.pinned_checksum && e.rep.live_text;
    const body = have ? L.wordDiff(nd.text, e.rep.live_text).map(o => o.t === "del" ? `<del>${esc(o.w)}</del>` : o.t === "add" ? `<ins>${esc(o.w)}</ins>` : esc(o.w)).join(" ")
      : e.rep.live_text ? esc(e.rep.live_text) : "";
    return `<div class="item">${edgeRow(e)}<div class="meta">${esc(e.rep.reason)}</div>${body ? `<details><summary>Live text${have ? " compared with the pinned text" : ""}</summary><div class="live">${body}</div><div class="mono">pinned ${esc(short(e.pinned_checksum))}… · live ${esc(short(e.rep.live_checksum))}…</div></details>` : ""}</div>`;
  };
  const srcRow = ([id, s]) => {
    const ch = s.baseline ? "first snapshot" : `+${s.sections_added.length} added · ${s.sections_changed.length} changed · ${s.sections_removed.length} removed`;
    return `<div class="row"><div class="t"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a><br><span class="mono">${esc(id)}${s.ok ? " · " + s.sections_total + " sections · " + ch : ""}</span>${s.error ? `<br><span class="meta">${esc(s.error)}${s.snapshot_date ? "; keeping the snapshot of " + esc(s.snapshot_date) : ""}</span>` : ""}</div><span class="chip ${s.ok ? "good" : "warn"}">${s.ok ? "Read OK" : "Could not read"}${s.http_status ? " · HTTP " + s.http_status : ""}</span></div>`;
  };
  box.innerHTML = `<div class="eyebrow">Real sources · live pages, not the demo</div>
    <div class="head">${esc(head)}</div>
    <div class="meta">Last fetched from the live sites ${esc(srcs.map(([, x]) => (x.fetched_at || "").slice(0, 10)).sort().pop() || "never")}. ${okN} of ${srcs.length} sources were readable${okN < srcs.length ? "; the rest are listed below with the reason" : ""}. Each check compares its pinned checksum with the checksum of the matching section on the live page.</div>
    ${bad.map(reviewBlock).join("")}
    ${stale.length ? `<details open><summary>${stale.length} checks matched earlier; latest fetch failed</summary>${stale.map(e => `<div class="item">${edgeRow(e)}<div class="meta">${esc(e.rep.reason)}</div></div>`).join("")}</details>` : ""}
    <details><summary>${good.length} checks that still match</summary>${good.map(edgeRow).join("")}</details>
    ${demo.length ? `<details><summary>${demo.length} pinned to a demo snapshot (not counted)</summary>${demo.map(e => `<div class="item">${edgeRow(e)}<div class="meta">${esc(e.rep.reason)}</div></div>`).join("")}</details>` : ""}
    ${R.afl_index ? `<details><summary>CDPH All Facilities Letters, ${esc(R.afl_index.year)}: ${R.afl_index.count} letters; ${esc(aflNew)}</summary>${R.afl_index.latest.map(a => `<div class="row"><div class="t"><span class="mono">${esc(a.num)}</span><br>${esc(a.text.replace(/\s*\|\s*AFL-[\d-]+\.aspx$/, ""))}</div></div>`).join("")}<div class="meta">Newest five shown.</div></details>` : ""}
    <details class="src-list"><summary>All ${srcs.length} watched sources</summary>${srcs.map(srcRow).join("")}</details>`;
}

function renderAll(){ renderBanner(); renderAnswer(); renderLanes(); renderDetail(); renderAdded(); renderAudit(); renderFoot(); }

function renderBanner(){
  $("#banner").innerHTML = state.view === "after" ? esc(D.amendmentNotice) + " Rule text on the right of each comparison is invented for this demo." : "Showing the current official text as fetched " + esc(D.today) + ". Switch to the amended text to see what a rule change does.";
  const mm = REC.model ? (MODELS[REC.model]?.name || REC.model) : "";
  $("#meta").textContent = `Recorded run on ${mm}, ${REC.recordedAt}, ${REC.secs} seconds. Statuses come from checksums in code; the model only explains changes and drafts updates.`;
}
function renderAnswer(){
  const st = statuses(), h = L.headline(st, baselineStatus), t = h.tally;
  const head = state.view === "after" ? h.text.replace(" need review", " need review under the hypothetical amendment") : (t.NeedsReview ? `${t.NeedsReview} of ${t.total} linked checks need review even before any amendment.` : `All ${t.total} linked checks match the current text.`);
  const stale = st.filter(e => e.status === "NeedsReview" && baselineStatus.find(b => b.id === e.id).status === "NeedsReview").length;
  const sub = state.view === "after"
    ? `${t.Valid} still match${t.Valid === 1 ? "es" : ""} their pinned text.${stale ? ` ${stale} of the ones needing review ${stale === 1 ? "was" : "were"} already out of date before the amendment: its pinned checksum never matched the current official text.` : ""}${state.audit.length ? ` ${state.audit.length} signed off in this session.` : ""}`
    : "Each check pins the checksum of the rule text it was last verified against. One check is pinned to an earlier snapshot, so it fails even here.";
  $("#answer").innerHTML = `<div class="head">${esc(head)}</div><div class="sub">${esc(sub)}</div>
    <div class="seg" role="group" aria-label="Which text to compare against"><button type="button" data-v="after" aria-pressed="${state.view === "after"}">After the amendment (hypothetical)</button><button type="button" data-v="before" aria-pressed="${state.view === "before"}">Current text</button></div>`;
  $("#answer").querySelectorAll("[data-v]").forEach(b => b.onclick = () => { state.view = b.dataset.v; state.flash = null; renderAll(); });
}
function renderLanes(){
  const st = statuses(), lanes = [["Broken", "Section deleted"], ["NeedsReview", "Needs review"], ["Valid", "Still matches"]];
  $("#lanes").innerHTML = lanes.map(([k, title]) => {
    const items = st.filter(e => e.status === k);
    return `<div class="lane"><h3>${title} <b>${items.length}</b></h3>${items.length ? items.map(e => card(e)).join("") : `<div class="empty">${k === "Broken" ? "No check points at a deleted section." : k === "NeedsReview" ? "Nothing waiting for review." : "Nothing matches yet."}</div>`}</div>`;
  }).join("");

function card(e){
  const d = diffOf(e), cls = state.view === "after" && d ? CLASS_LABEL[d.code_class] : "";

}

function diffPanes(d){
  const left = d.ops.filter(o => o.t !== "add").map(o => o.t === "del" ? `<del>${esc(o.w)}</del>` : esc(o.w)).join(" ");
  const right = d.ops.filter(o => o.t !== "del").map(o => o.t === "add" ? `<ins>${esc(o.w)}</ins>` : esc(o.w)).join(" ");
  return { left, right };
}
function renderDetail(){
  const box = $("#detail"), e = statuses().find(x => x.id === state.sel);
  if (!e){ box.hidden = true; return; }
  box.hidden = false;
  const d = diffOf(e), after = state.view === "after", node = L.indexNodes(nodes()).get(L.nodeKey(e.source_id, e.section_num)), curNode = L.indexNodes(A.cur).get(L.nodeKey(e.source_id, e.section_num));

    texts = `<div class="vs"><div class="side"><div class="lab"><span>Current text · fetched ${esc(D.today)}</span></div><div class="txt">${p.left || "<i>(section did not exist)</i>"}</div></div>
      <div class="side"><div class="lab"><span>Amended text</span>${HYP}</div><div class="txt">${d.v2 ? p.right : "<i>(section deleted in the hypothetical amendment)</i>"}</div></div></div>`;
  } else {
    texts = `<div class="side"><div class="lab"><span>${esc(e.section_num)} · ${after ? "unchanged by the amendment" : "current text"} · fetched ${esc(D.today)}</span></div><div class="txt">${esc(curNode?.text || "")}</div></div>`;

  if (after && d){
    const v = verdict(d);
    if (!v) model = `<div class="box"><h3>What the model says</h3><p>No model result yet. Use Re-classify live.</p></div>`;
    else {
      const upd = v.updates.find(u => u.edge_id === e.id);
      model = `<div class="box"><h3>What the model says <span class="chip ${v.accepted ? "good" : "bad"}">${v.accepted ? "accepted by code" : "rejected by code"}</span></h3>
        ${v.semantic_class ? `<div class="chips"><span class="chip">${esc(CLASS_LABEL[v.semantic_class])}</span><span class="chip">${v.from === "live" ? "live run" : "recorded run"}</span></div>` : ""}
        ${v.summary ? `<p>${esc(v.summary)}</p>` : ""}
        ${v.v1_quote ? `<blockquote>${esc(v.v1_quote)}</blockquote><span class="ver ${v.v1_quote_ok ? "ok" : "no"}">${v.v1_quote_ok ? "✓ verbatim in the current text" : "✗ not found in the current text"}</span>` : ""}
        ${v.v2_quote ? `<blockquote>${esc(v.v2_quote)}</blockquote><span class="ver ${v.v2_quote_ok ? "ok" : "no"}">${v.v2_quote_ok ? "✓ verbatim in the amended text" : "✗ not found in the amended text"}</span>` : ""}
        ${v.accepted ? "" : `<div class="errbox">Not used: ${esc(v.reasons.join("; "))}</div>`}</div>`;
      model += `<div class="box"><h3>Proposed update to this item</h3>${v.accepted && upd ? `<p>${esc(upd.proposed_update)}</p><p class="mono">A draft only. The item stays flagged until a reviewer signs off.</p>` : `<p>${v.accepted ? "The model did not propose an update for this item." : "None: the model's answer did not pass the code checks."}</p>`}</div>`;
    }
  } else model = `<div class="box"><h3>What the model says</h3><p>No model call for this item: ${after ? "its section did not change in the amendment." : "nothing to compare."}</p></div>`;
  const pin = `<p class="mono">pinned ${esc(short(e.pinned_checksum))}… · current ${esc(short(e.current_checksum))}…</p>${e.pin_note ? `<p>${esc(e.pin_note)}</p>` : ""}`;
  let sign = "";
  if (e.status === "NeedsReview" && after){
    sign = `<form class="signoff" id="sf"><h3>Reviewer sign-off</h3><p>Signing off says a person read the amended (hypothetical) text and confirmed or updated the item. It re-pins this check to checksum <span class="mono">${esc(short(node.checksum))}…</span> and is logged below.</p>
      <div class="row"><label class="f" for="rv">Reviewer name<input id="rv" autocomplete="off"></label><label class="f" for="rd">Date<input id="rd" value="${esc(D.today)}" inputmode="numeric"></label></div>
      <label class="f" for="rn">Note (optional)<input id="rn" autocomplete="off"></label>
      <div><button class="btn primary" type="submit">Sign off and re-pin</button></div>${state.flash ? `<div class="errbox">${esc(state.flash)}</div>` : ""}</form>`;
  } else if (e.status === "NeedsReview") sign = `<div class="warnbox">Switch to the amended text to review and sign off.</div>`;
  else if (e.status === "Broken") sign = `<div class="errbox">Broken: the section this item points at was deleted. A reviewer has to re-point or retire the item; it cannot be signed off.</div>`;
  else { const a = state.audit.filter(x => x.edge_id === e.id).pop(); sign = a ? `<div class="okbox">Signed off by ${esc(a.reviewer)} on ${esc(a.date)}; re-pinned to ${esc(short(a.to_checksum))}….${a.note ? " Note: " + esc(a.note) : ""}</div>` : ""; }
  box.innerHTML = `<div class="item"><span class="mono">${esc(e.app)} · ${esc(e.item_id)} · ${esc(e.id)} · ${esc(e.item_cite)}</span><div style="font-weight:500">${esc(e.item_text)}</div>
    <div class="chips"><span class="chip ${ST_CLASS[e.status]}">${ST_LABEL[e.status]}</span><span class="chip">${esc(e.section_num)} · ${esc(curNode?.heading || "")}</span></div><div class="meta">${esc(e.reason)}</div>${pin}</div>
    ${texts}<div class="cols">${code}${model}</div>${sign}`;
  const f = $("#sf");
  if (f) f.onsubmit = ev => {
    ev.preventDefault();
    const r = L.signOff({ edges: state.edges, audit: state.audit }, { edge_id: e.id, reviewer: $("#rv").value, date: $("#rd").value, note: $("#rn").value, checksum: node.checksum }, nodes());
    if (!r.ok){ state.flash = r.error; renderDetail(); return; }
    state.edges = r.edges; state.audit = r.audit; state.flash = null; renderAll();
  };
}
function renderAdded(){
  const box = $("#added"), list = A.unlinked.filter(d => d.diff_type === "Added");
  if (state.view !== "after" || !list.length){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<h3>New sections nothing links to ${HYP}</h3><p class="meta" style="margin:0">Added in the amendment, so no checklist item points at them yet. Code cannot decide whether you need a new item; a reviewer does.</p>` +
    list.map(d => `<div class="side"><div class="lab"><span>${esc(d.section_num)} · ${esc(d.heading)}</span><span class="chip warn">${esc(CLASS_LABEL[d.code_class])}</span></div><div class="txt"><ins>${esc(d.v2)}</ins></div></div>`).join("");
}
function renderAudit(){
  const box = $("#auditp");
  if (!state.audit.length){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<h3>Sign-off log (this session only)</h3><div class="audit">${state.audit.map(a => `<div><b>${esc(a.item_id)}</b> (${esc(a.edge_id)}, ${esc(a.section_num)}) reviewed by ${esc(a.reviewer)} on ${esc(a.date)}<br><span class="mono">${esc(short(a.from_checksum))}… → ${esc(short(a.to_checksum))}…</span>${a.note ? `<br>${esc(a.note)}` : ""}</div>`).join("")}</div>`;
}
function renderFoot(){
  $("#foot").innerHTML = `<div><b>Sources.</b> ${D.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>, retrieved ${esc(s.retrieved)}. ${esc(s.note)}`).join(" ")}</div>
    <div>Current-text sections are pasted from those pages (zero-width characters removed; paragraph letters and sub-item numbers added from the page's list numbering). Checklist items are quoted from the author's own Marketing Studio and SNF Deal Desk demos. ${HYP} Every amended passage in this page is invented for the demonstration. Checks, statuses and sign-offs are computed in code from SHA-256 checksums of whitespace-normalized text. Sign-offs live in this page only. This is a demonstration, not legal advice.</div>`;
}

/* ---------- live runs ---------- */
function modelOpts(){ const m = $("#model").value; return { model: m, modelTier: MODELS[m]?.tier || "default", effort: $("#depth").value }; }
function parseJson(text){ const a = text.indexOf("{"), b = text.lastIndexOf("}"); if (a < 0 || b < a) throw { message: "Claude did not return a result in the expected format. Run it again." }; return JSON.parse(text.slice(a, b + 1)); }
function errText(e){
  if (e?.code === "rate_limited") return "Claude is rate limited right now. Wait a minute and run it again.";
  if (e?.code === "not_granted") return "Claude access was not allowed for this page. Allow it from the page's permissions to run live.";
  return e?.message || "The run did not finish. Run it again.";
}
async function rerun(){
  if (!sample || state.busy) return;
  state.busy = true; $("#rerun").disabled = true;
  const busy = $("#busy"), ctl = new AbortController(); let done = 0, failed = 0;
  busy.hidden = false; busy.innerHTML = `<div class="warnbox">Re-classifying ${A.jobs.length} changed sections on Claude… <button class="btn" id="stop" type="button">Stop</button></div><div class="stream" id="stream"></div>`;
  $("#stop").onclick = () => ctl.abort();
  let next = 0;
  const worker = async () => {
    while (next < A.jobs.length && !ctl.signal.aborted){
      const d = A.jobs[next++], edges = A.edges.filter(x => d.edge_ids.includes(x.id));
      try {
        const res = await sample(CW_PROMPTS.classify({ diff: d, edges }), { ...modelOpts(), signal: ctl.signal, cache: false, onText: ({ text }) => { const s = $("#stream"); if (s) s.textContent = d.section_num + ": " + text.length.toLocaleString() + " characters written"; } });
        state.models[d.key] = { output: parseJson(res.text), from: "live", model: res.modelApplied || $("#model").value };
        done++; renderAll();
      } catch(e){ if (ctl.signal.aborted) return; failed++; busy.insertAdjacentHTML("beforeend", `<div class="errbox">${esc(d.section_num)}: ${esc(errText(e))}</div>`); }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  state.busy = false; $("#rerun").disabled = false;
  busy.innerHTML = ctl.signal.aborted ? `<div class="warnbox">Run stopped. Sections already finished are updated; the rest keep their recorded results.</div>` : failed ? `<div class="warnbox">${done} of ${A.jobs.length} sections re-classified; ${failed} failed and keep their recorded results.</div>` : `<div class="okbox">All ${done} sections re-classified live. Every answer was re-checked by code.</div>`;
  renderAll();
}
$("#rerun").onclick = () => { if (!sample){ $("#meta").textContent = "Open this page in Claude to re-classify live. The recorded run is shown below."; return; } rerun(); };

/* ---------- boot ---------- */
state.sel = (statuses().find(e => e.status === "Broken") || statuses().find(e => e.status === "NeedsReview") || statuses()[0]).id;
renderReal();
renderAll();
(async () => {
  try { sample = await window.claude?.use("sample"); } catch(e){ sample = null; }
  if (!sample) $("#rerun").title = "Open this page in Claude to re-classify live";
})();
</script>
