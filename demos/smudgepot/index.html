<script type="text/plain" data-lua="audio_map">-- audio_map.lua: turns game events and state into real recorded clips.
-- Pure: it only calls the play(name, volume) and loop(name, volume) it is given.
--   audio_map.run(g, events, play, loop)   call once per tick (1/20 s)
-- One-shots: match pour clank(can/lift/drop) gust snap(tree lost) owl(hourly)
--            purr cockerel(dawn) step(frosty grass, while walking).
-- Loops: fire (louder near a lit pot), wind (scales with wind strength).
local config = require("config")

local audio = {}

local ONESHOT = {
  match = { "match", 0.8 },
  pour = { "pour", 0.8 },
  can = { "clank", 0.7 },
  lift = { "clank", 0.5 },
  drop = { "clank", 0.5 },
  gust = { "gust", 0.7 },
  tree_lost = { "snap", 0.9 },
  hour = { "owl", 0.5 },
  purr = { "purr", 0.6 },
  dawn = { "cockerel", 0.8 },
}

local FIRE_RANGE, STEP_GAP = config.FIRE_RANGE, config.STEP_GAP

local function set_loop(a, loop, name, vol)
  vol = math.floor(vol * 20 + 0.5) / 20   -- quantise so the host is not spammed
  if a[name] ~= vol then
    a[name] = vol
    loop(name, vol)
  end
end

function audio.run(g, events, play, loop)
  local a = g.audio
  local w = g.w
  local live = g.scene == "play" and w ~= nil and not g.paused
  if not live then
    set_loop(a, loop, "fire", 0)
    set_loop(a, loop, "wind", 0)
    return
  end
  for _, e in ipairs(events) do
    local o = ONESHOT[e.kind]
    if o then play(o[1], o[2]) end
  end
  local k = w.keeper
  a.cooldown = math.max(0, (a.cooldown or 0) - 1)
  if w.status == "play" and (a.cx ~= k.cx or a.cy ~= k.cy) and a.cooldown == 0 then
    play("step", k.pot and 0.25 or 0.35)
    a.cooldown = STEP_GAP
  end
  a.cx, a.cy = k.cx, k.cy

  local best = FIRE_RANGE
  for _, p in ipairs(w.pots) do
    if p.lit then
      local dx, dy = p.x - k.x, p.y - k.y
      local d = math.sqrt(dx * dx + dy * dy)
      if d < best then best = d end
    end
  end
  set_loop(a, loop, "fire", 0.8 * (1 - best / FIRE_RANGE))
  set_loop(a, loop, "wind", w.wind.strength * 0.5 + (w.shift and 0.1 or 0))
end

return audio
</script>

<script type="text/plain" data-lua="game">-- game.lua: scene machine around world.lua. Pure; no host, io, os or math.random.
--
--   game.new(seed) -> g
--   game.key(g, name, down)   names: up down left right a b tab start pause
--   game.step(g) -> events    ONE tick (1/20 s). Returns the world events of
--                             this tick (also kept in g.events).
--   game.score(g) -> jars, trees_alive, cans_left
--   game.frost_map(g) -> text block (44 x 24) of where the cold won
--
-- Scenes: title -> briefing -> play -> (upgrade after nights 1, 2) -> briefing
--         -> play ... -> ending (won) ; play -> result (lost).
-- Fields read by render/main/audio: g.scene g.night g.w g.carry g.log
--   g.thermal g.paused g.frame g.choice g.minT g.export g.won g.events
local config = require("config")
local world = require("world")

local game = {}

local UPGRADES = {
  [1] = { { key = "extra_pot", name = "7TH POT", text = "One more smudge pot, set mid-orchard." },
          { key = "hedge", name = "HEDGE ROW", text = "Hedges block the wind: heat stays put." } },
  [2] = { { key = "big_cans", name = "90-MIN CANS", text = "Every can burns 90 minutes, not 60." },
          { key = "stakes", name = "THERMOMETER STAKES", text = "Every tree shows its own temperature." } },
}
game.UPGRADES = UPGRADES

local function reset(g, seed)
  g.seed = seed
  g.scene = "title"
  g.night = 1
  g.carry = { dead = {}, extra_pot = false, hedge = false, big_cans = false, stakes = false }
  g.w = nil
  g.held = { up = false, down = false, left = false, right = false }
  g.press = { a = false, b = false }
  g.thermal = false
  g.paused = false
  g.log = {}
  g.events = {}
  g.choice = 1
  g.hold = 0
  g.won = false
  g.export = nil
  g.minT = {}
  g.audio = {}
  g.picked = {}
end

function game.new(seed)
  local g = { frame = 0 }
  reset(g, seed)
  return g
end

local function logline(g, text, col)
  local w = g.w
  local stamp = w and string.format("%02d:%02d ", w.hh, w.mm) or ""
  local log = g.log
  log[#log + 1] = { text = stamp .. text, col = col or 4 }
  while #log > config.LOG_KEEP do table.remove(log, 1) end
end

local function start_night(g)
  g.w = world.new(g.seed, g.night, g.carry)
  g.log = {}
  g.hold = 0
  g.paused = false
  g.thermal = false
  for k in pairs(g.held) do g.held[k] = false end
  g.press.a, g.press.b = false, false
  logline(g, "Night " .. g.night .. ". Dusk. Cold is coming.", 5)
end

local function new_minT(g)
  local n = config.W * config.H
  for i = 1, n do g.minT[i] = 99 end
end

local function note_min(g)
  local T, mt = g.w.field.T, g.minT
  for i = 1, #T do
    if T[i] < mt[i] then mt[i] = T[i] end
  end
end

function game.score(g)
  local w = g.w
  local living, cans = 0, 0
  if w then
    for _, t in ipairs(w.trees) do
      if t.alive then living = living + 1 end
    end
    cans = w.shed.cans + w.keeper.cans
  end
  return living * config.JAR_TREE + cans * config.JAR_CAN, living, cans
end

local function export_map(g)
  g.export = game.frost_map(g)
end

function game.key(g, name, down)
  if g.held[name] ~= nil then
    g.held[name] = down
    if down and g.scene == "upgrade" then
      if name == "left" or name == "up" then g.choice = 1 end
      if name == "right" or name == "down" then g.choice = 2 end
    end
    return
  end
  if not down then return end
  local sc = g.scene
  if name == "a" or name == "b" then
    if sc == "play" and not g.paused then g.press[name] = true end
    if (sc == "result" or sc == "ending") and name == "a" then export_map(g) end
    if sc == "upgrade" and name == "a" then name = "start" else return end
  end
  if name == "tab" then
    if sc == "play" then g.thermal = not g.thermal end
  elseif name == "pause" then
    if sc == "play" and g.w.status == "play" then g.paused = not g.paused end
  elseif name == "start" then
    if sc == "title" then
      new_minT(g)
      g.scene = "briefing"
      g.w = world.new(g.seed, g.night, g.carry)
    elseif sc == "briefing" then
      start_night(g)
      g.scene = "play"
    elseif sc == "upgrade" then
      local up = UPGRADES[g.night][g.choice]
      g.carry[up.key] = true
      g.picked[#g.picked + 1] = up.name
      g.night = g.night + 1
      g.w = world.new(g.seed, g.night, g.carry)
      g.scene = "briefing"
    elseif sc == "result" or sc == "ending" then
      reset(g, g.seed + 1)
    elseif sc == "play" and g.paused then
      g.paused = false
    end
  end
end

local function describe(g, e)
  local w = g.w
  local k = e.kind
  if k == "match" then logline(g, "Lit pot " .. e.pot .. ".", 7)
  elseif k == "pour" then logline(g, "Poured a can into pot " .. e.pot .. " (" .. e.fuel .. " min).", 6)
  elseif k == "can" then logline(g, "Took a can from the shed (" .. w.shed.cans .. " left).", 4)
  elseif k == "lift" then logline(g, "Lifted pot " .. e.pot .. ", flame out.", 4)
  elseif k == "drop" then logline(g, "Set pot " .. e.pot .. " down. Light it.", 4)
  elseif k == "out" then logline(g, "Pot " .. e.pot .. " ran dry.", 8)
  elseif k == "warn" then logline(g, "Wind will turn " .. e.name .. " in " .. e.in_min .. " min.", 10)
  elseif k == "gust" then logline(g, "Gust. Wind now blows " .. e.name .. ".", 10)
  elseif k == "tree_lost" then logline(g, "Frost took a tree at " .. e.x .. "," .. e.y .. ".", 8)
  elseif k == "hour" then logline(g, "An owl calls. " .. string.format("%02d:00", e.hour), 3)
  elseif k == "purr" then logline(g, "The cat is purring. Warm here.", 13)
  elseif k == "dawn" then logline(g, "Dawn. The cockerel crows.", 6)
  elseif k == "lost" then logline(g, "Too many trees are gone.", 8)
  end
end

function game.step(g)
  g.frame = g.frame + 1
  g.events = {}
  if g.scene ~= "play" then return g.events end
  local w = g.w
  if g.paused then return g.events end
  if w.status == "play" then
    local h = g.held
    local input = {
      dx = (h.right and 1 or 0) - (h.left and 1 or 0),
      dy = (h.down and 1 or 0) - (h.up and 1 or 0),
      a = g.press.a, b = g.press.b,
    }
    g.press.a, g.press.b = false, false
    local m0 = w.minute
    world.step(w, input)
    g.events = w.events
    for _, e in ipairs(w.events) do describe(g, e) end
    if w.minute ~= m0 then note_min(g) end
  else
    g.hold = g.hold + 1
    if g.hold >= config.DAWN_HOLD then
      if w.status == "lost" then
        g.scene = "result"
      elseif g.night >= config.NIGHTS then
        g.won = true
        g.scene = "ending"
      else
        for _, t in ipairs(w.trees) do
          if not t.alive then g.carry.dead[t.id] = true end
        end
        g.choice = 1
        g.scene = "upgrade"
      end
    end
  end
  return g.events
end

local FROST = " .:-=+*#%@"

-- Text block of where the cold won: ramp = coldest temperature each cell reached.
function game.frost_map(g)
  local W, H = config.W, config.H
  local w = g.w
  local tree_at = {}
  if w then
    for _, t in ipairs(w.trees) do
      tree_at[(t.y - 1) * W + t.x] = t
    end
  end
  local jars, living = game.score(g)
  local rows = {}
  rows[1] = "SMUDGEPOT frost map  seed " .. g.seed .. "  jars " .. jars
  rows[2] = "trees " .. living .. "/" .. config.TREES_N .. "   T = tree standing, x = tree lost, ramp = how cold the ground got"
  for y = 1, H do
    local r = {}
    for x = 1, W do
      local i = (y - 1) * W + x
      local t = tree_at[i]
      if t then
        r[x] = t.alive and "T" or "x"
      else
        local m = g.minT[i] or 99
        local idx = math.floor(1 - m)
        if idx < 0 then idx = 0 elseif idx > 9 then idx = 9 end
        r[x] = string.sub(FROST, idx + 1, idx + 1)
      end
    end
    rows[#rows + 1] = table.concat(r)
  end
  return table.concat(rows, "\n") .. "\n"
end

return game
</script>
<script type="text/plain" data-lua="level">-- level.lua: deterministic level generation.
-- level.gen(seed, night, carry) -> level table:
--   w, h        grid size (44 x 24); cells indexed i = (y-1)*w + x, 1-based x,y
--   night       1..3
--   hm[i]       height 0..3 (terrain and trees depend on seed only, so they
--               are identical on every night of a run)
--   trees       list {id, x, y, alive, damage}; ids 1..24 stable across nights
--   pots        list {id, x, y, lit=false, fuel, carried=false}
--   shed        {x, y, cans}
--   start       keeper start {x, y};  cat {x, y}
--   hedge[i]    true on hedge cells (only when carry.hedge)
--   wind        {initial = dir, shifts = { {minute, dir}, ... }}  dir = {name,dx,dy}
-- carry (all optional): dead = {[tree id]=true}, extra_pot, hedge, big_cans, stakes
local config = require("config")
local rng = require("rng")

local level = {}

local function clamp(v, lo, hi)
  if v < lo then return lo end
  if v > hi then return hi end
  return v
end

local function gen_height(r, W, H)
  local hills = {}
  local function add(n, sign)
    for _ = 1, n do
      hills[#hills + 1] = {
        x = r:int(1, W), y = r:int(1, H),
        r = r:int(config.HILL_R_MIN, config.HILL_R_MAX),
        a = sign * (config.HILL_AMP_MIN + (config.HILL_AMP_MAX - config.HILL_AMP_MIN) * r:float()),
      }
    end
  end
  add(config.HILLS_N, 1)
  add(config.BASINS_N, -1)
  local hm = {}
  for y = 1, H do
    for x = 1, W do
      local v = config.HGT_BASE
      for _, k in ipairs(hills) do
        local dx, dy = x - k.x, y - k.y
        local d = math.sqrt(dx * dx + dy * dy)
        if d < k.r then v = v + k.a * (1 - d / k.r) end
      end
      hm[(y - 1) * W + x] = clamp(math.floor(v + 0.5), 0, config.HGT_MAX)
    end
  end
  return hm
end

local function gen_wind(seed, night)
  local r = rng.new(seed * 7919 + night * 104729)
  local dirs = config.DIRS
  local cur = r:int(1, #dirs)
  local initial = dirs[cur]
  local n = config.SHIFTS[night]
  local slot = config.SHIFT_SPAN // n
  local shifts = {}
  for i = 1, n do
    local m = config.SHIFT_FIRST + (i - 1) * slot + r:int(0, slot - config.SHIFT_MIN_GAP)
    local nxt = (cur - 1 + r:int(1, #dirs - 1)) % #dirs + 1
    shifts[i] = { minute = m, dir = dirs[nxt] }
    cur = nxt
  end
  return { initial = initial, shifts = shifts }
end

function level.gen(seed, night, carry)
  carry = carry or {}
  local W, H = config.W, config.H
  local r = rng.new(seed)
  local lv = { w = W, h = H, night = night }
  lv.hm = gen_height(r, W, H)

  lv.trees = {}
  local id = 0
  for j = 0, config.TREE_ROWS - 1 do
    for i = 0, config.TREE_COLS - 1 do
      id = id + 1
      local j1 = config.TREE_JITTER
      local x = config.TREE_X0 + i * config.TREE_DX + r:int(-j1, j1)
      local y = config.TREE_Y0 + j * config.TREE_DY + r:int(-j1, j1)
      local dead = carry.dead and carry.dead[id] or false
      lv.trees[id] = {
        id = id, x = clamp(x, 1, W), y = clamp(y, 1, H),
        alive = not dead, damage = dead and config.TREE_DIE_AT or 0,
      }
    end
  end

  local fuel = config.POT_START_FUEL
  lv.pots = {}
  local function addpot(p)
    local k = #lv.pots + 1
    lv.pots[k] = { id = k, x = p[1], y = p[2], lit = false, fuel = fuel, carried = false }
  end
  for _, p in ipairs(config.POTS) do addpot(p) end
  if carry.extra_pot then addpot(config.EXTRA_POT) end

  lv.shed = { x = config.SHED[1], y = config.SHED[2], cans = config.SHED_CANS[night] }
  lv.start = { x = config.KEEPER_START[1], y = config.KEEPER_START[2] }
  lv.cat = { x = config.CAT_START[1], y = config.CAT_START[2] }

  lv.hedge = {}
  if carry.hedge then
    for _, s in ipairs(config.HEDGES) do
      for y = s[2], s[4] do
        for x = s[1], s[3] do
          lv.hedge[(y - 1) * W + x] = true
        end
      end
    end
  end

  lv.wind = gen_wind(seed, night)
  return lv
end

return level
</script>
<script type="text/plain" data-lua="main">-- main.lua: the ONLY file that touches `host`. Wires the pure game to the page.
-- Host contract: GAME, game_init, game_key, game_frame (fixed 1/20 s), game_scene, game_minute.
local screen = require("screen")
local game = require("game")
local render = require("render")
local audio_map = require("audio_map")

GAME = {
  w = 64, h = 36, title = "SMUDGEPOT",
  palette = "#0b0d12,#1d2230,#3a4560,#6c7a99,#aab6cf,#e6ecf7,#ffd27a,#ff9a3c,"
         .. "#e8541e,#a02a1a,#7fd3ff,#4a9fd8,#2e6fa8,#9be39b,#4f9d5a,#ffffff",
}

local g
local scr = screen.new(GAME.w, GAME.h)

function game_init(seed)
  g = game.new(seed)
end

function game_key(name, down)
  game.key(g, name, down)
end

function game_frame(dt)
  local events = game.step(g)
  audio_map.run(g, events, host.play, host.loop)
  if g.export then
    host.export(g.export)
    g.export = nil
  end
  render.draw(g, scr)
  local chars, colors = screen.strings(scr)
  host.present(chars, colors)
end

function game_scene() return g.scene end
function game_minute() return g.w and g.w.minute or 0 end
</script>
<script type="text/plain" data-lua="render">-- render.lua: draws the whole game to a 64x36 screen buffer. Pure; reads g only.
--   render.draw(g, screen)
-- Layout: title row 0; field box at (0,1) with field cells starting (1,2);
-- side panel from column 47; log rows 28-34; hints row 35.
-- Palette indices: 1-3 dim blue-greys, 4-5 light, 6 yellow, 7 orange, 8 red,
-- 9 dark red, 10 ice, 11-12 blues, 13 light green, 14 green, 15 white.
local config = require("config")
local screen = require("screen")
local game = require("game")

local render = {}

local RAMP = " .:-=+*#%@"
local FX, FY = 1, 2
local PX = 47
local NORMAL_COL = { [0] = 0, 1, 1, 2, 2, 2, 12, 12, 11, 11 }
local THERM_COL = { [0] = 12, 12, 11, 11, 10, 5, 6, 7, 8, 8 }

local function clamp(v, lo, hi)
  if v < lo then return lo end
  if v > hi then return hi end
  return v
end

local function ramp_char(idx)
  return string.sub(RAMP, idx + 1, idx + 1)
end

-- cold density: 0 at T>=1, rising one step per degree below
local function cold_idx(T)
  return clamp(math.floor(1 - T), 0, 9)
end

local function heat_idx(T)
  return clamp(math.floor((T + 9) / 2), 0, 9)
end

local function center(s, y, str, c)
  screen.text(s, (s.w - #str) // 2, y, str, c)
end

local function pad2(n) return string.format("%02d", n) end

-- ---------------------------------------------------------------- field
local function draw_field(g, s, w)
  local W, H = config.W, config.H
  local T = w.field.T
  local thermal = g.thermal
  for y = 1, H do
    for x = 1, W do
      local t = T[(y - 1) * W + x]
      local ch, col
      if thermal then
        local i = heat_idx(t)
        ch, col = ramp_char(i), THERM_COL[i]
      else
        local i = cold_idx(t)
        ch, col = ramp_char(i), NORMAL_COL[i]
      end
      screen.put(s, FX + x - 1, FY + y - 1, ch, col)
    end
  end
  for i in pairs(w.hedge) do
    local x, y = (i - 1) % W + 1, (i - 1) // W + 1
    screen.put(s, FX + x - 1, FY + y - 1, "#", 14)
  end
  screen.put(s, FX + w.shed.x - 1, FY + w.shed.y - 1, "H", 13)
  for _, p in ipairs(w.pots) do
    if not p.carried then
      local ch, col = "o", 3
      if p.lit then
        local f = (g.frame // 3 + p.id) % 4
        ch = (p.fuel < 10 and f == 0) and "*" or "O"
        col = ({ 7, 8, 6, 7 })[f + 1]
      end
      screen.put(s, FX + p.x - 1, FY + p.y - 1, ch, col)
    end
  end
  for _, t in ipairs(w.trees) do
    local ch, col = "Y", 14
    local temp = T[(t.y - 1) * W + t.x]
    local frac = t.damage / config.TREE_DIE_AT
    local cue = nil
    if frac >= config.TREE_WARN_RED then cue = 8
    elseif frac >= config.TREE_WARN_YELLOW then cue = 6 end
    if not t.alive then
      ch, col = "x", 2
    elseif g.carry.stakes then
      ch = string.sub(tostring(clamp(math.floor(math.abs(temp)), 0, 9)), 1, 1)
      col = cue or (temp >= 0 and 13 or 10)
    else
      col = cue or ((temp < config.TREE_FROST_T) and 10 or 14)
    end
    screen.put(s, FX + t.x - 1, FY + t.y - 1, ch, col)
  end
  local c = w.cat
  screen.put(s, FX + c.x - 1, FY + c.y - 1, "c", c.purring and 6 or 5)
  local k = w.keeper
  screen.put(s, FX + k.cx - 1, FY + k.cy - 1, "@", k.pot and 6 or 15)
end

-- ---------------------------------------------------------------- panel
local DIRCH = { N = { 3, 0, "^" }, W = { 1, 1, "<" }, E = { 5, 1, ">" }, S = { 3, 2, "v" } }

local function draw_panel(g, s, w)
  local x0 = PX
  screen.text(s, x0, 1, "NIGHT " .. g.night .. "/" .. config.NIGHTS, 5)
  screen.text(s, x0, 2, pad2(w.hh) .. ":" .. pad2(w.mm), 6)
  screen.text(s, x0 + 7, 2, "-> 06:00", 2)
  local bw = 14
  local fill = clamp(w.minute * bw // config.NIGHT_MIN, 0, bw)
  screen.text(s, x0, 3, "[" .. string.rep("=", fill) .. string.rep(".", bw - fill) .. "]", 3)

  screen.text(s, x0, 5, "WIND " .. w.wind.name .. " " .. string.rep(">", math.floor(w.wind.strength * 5 + 0.5)), 10)
  local vy = 6
  screen.put(s, x0 + 3, vy + 1, "+", 2)
  for name, d in pairs(DIRCH) do
    local on = (name == w.wind.name)
    local nxt = w.shift and name == w.shift.name
    local col = on and 15 or 2
    if nxt and (g.frame // 6) % 2 == 0 then col = 7 end
    screen.put(s, x0 + d[1], vy + d[2], on and d[3] or (nxt and d[3] or "."), col)
  end
  screen.text(s, x0 + 7, vy, "you face", 2)
  screen.text(s, x0 + 7, vy + 1, "the wind", 2)
  if w.shift then
    local c = ((g.frame // 6) % 2 == 0) and 7 or 6
    screen.text(s, x0, 9, "SHIFT " .. w.shift.name .. " in " .. w.shift.in_min .. "m", c)
  else
    screen.text(s, x0, 9, "wind steady", 2)
  end

  local k = w.keeper
  local carry = "empty"
  if k.pot then carry = "POT #" .. k.pot elseif k.cans > 0 then carry = "can [#]" end
  screen.text(s, x0, 11, "CARRY " .. carry, k.pot and 6 or (k.cans > 0 and 6 or 4))
  local ratio = w.living / config.TREES_N
  local tc = ratio > 0.75 and 13 or (w.living >= config.TREES_MIN_ALIVE + 3 and 6 or 8)
  screen.text(s, x0, 12, "TREES " .. w.living .. "/" .. config.TREES_N, tc)
  screen.text(s, x0, 13, "SHED  " .. w.shed.cans .. " cans", 4)
  local lit = 0
  for _, p in ipairs(w.pots) do if p.lit then lit = lit + 1 end end
  screen.text(s, x0, 14, "POTS  " .. lit .. "/" .. #w.pots .. " lit", lit > 0 and 7 or 3)
  for i, p in ipairs(w.pots) do
    local mark, col = " off", 3
    if p.carried then mark, col = " carried", 6
    elseif p.lit then mark, col = " lit", 7
    elseif p.fuel <= 0 then mark, col = " dry", 8 end
    local line = "#" .. p.id .. mark
    screen.text(s, x0, 14 + i, line, col)
    screen.text(s, x0 + 12, 14 + i, string.format("%3dm", p.fuel), p.fuel < 15 and 8 or 4)
  end

  if g.thermal then
    screen.text(s, x0, 23, "THERMAL VIEW", 15)
    for i = 0, 9 do
      screen.put(s, x0 + i, 24, ramp_char(i) == " " and "_" or ramp_char(i), THERM_COL[i])
    end
    screen.text(s, x0, 25, "cold -9    hot +9", 2)
  elseif g.carry.stakes then
    screen.text(s, x0, 23, "stakes: digit = deg", 2)
    screen.text(s, x0, 24, "yellow/red = damage", 2)
  else
    screen.text(s, x0, 24, "TAB: thermal view", 2)
  end
end

local function draw_log(g, s)
  screen.text(s, 1, 27, "-- LOG " .. string.rep("-", 55), 2)
  local log = g.log
  local first = math.max(1, #log - config.LOG_KEEP + 1)
  local row = 28
  for i = first, #log do
    local e = log[i]
    screen.text(s, 1, row, e.text, i == #log and e.col or 3)
    row = row + 1
  end
end

local function banner(s, lines, c)
  local wd = 0
  for _, l in ipairs(lines) do wd = math.max(wd, #l) end
  wd = wd + 6
  local ht = #lines + 2
  local x0 = FX + (config.W - wd) // 2
  local y0 = FY + (config.H - ht) // 2
  for y = y0, y0 + ht - 1 do
    for x = x0, x0 + wd - 1 do screen.put(s, x, y, " ", 0) end
  end
  screen.box(s, x0, y0, wd, ht, c)
  for i, l in ipairs(lines) do
    screen.text(s, x0 + (wd - #l) // 2, y0 + i, l, c)
  end
end

local function draw_play(g, s)
  local w = g.w
  screen.text(s, 1, 0, "SMUDGEPOT", 7)
  screen.text(s, 11, 0, "keep the blossom above freezing until dawn", 3)
  screen.box(s, 0, 1, config.W + 2, config.H + 2, 2)
  draw_field(g, s, w)
  draw_panel(g, s, w)
  draw_log(g, s)
  screen.text(s, 1, 35, "arrows/WASD move  Z use  X lift/drop pot  Tab thermal  P pause", 3)
  if g.paused then
    banner(s, { "PAUSED", "P or Enter to resume" }, 15)
  elseif w.status == "dawn" then
    banner(s, { "DAWN", "The frost lifts." }, 6)
  elseif w.status == "lost" then
    banner(s, { "THE ORCHARD IS LOST", "Too many trees froze." }, 8)
  end
end

-- ---------------------------------------------------------------- other scenes
local FONT = {
  S = { ".####", "#....", ".###.", "....#", "####." },
  M = { "#...#", "##.##", "#.#.#", "#...#", "#...#" },
  U = { "#...#", "#...#", "#...#", "#...#", ".###." },
  D = { "####.", "#...#", "#...#", "#...#", "####." },
  G = { ".###.", "#....", "#..##", "#...#", ".###." },
  E = { "#####", "#....", "###..", "#....", "#####" },
  P = { "####.", "#...#", "####.", "#....", "#...." },
  O = { ".###.", "#...#", "#...#", "#...#", ".###." },
  T = { "#####", "..#..", "..#..", "..#..", "..#.." },
}

local function big_text(s, x, y, str, f)
  for n = 1, #str do
    local glyph = FONT[string.sub(str, n, n)]
    for r = 1, 5 do
      for c = 1, 5 do
        if string.sub(glyph[r], c, c) == "#" then
          local flick = (x + n * 7 + c * 3 + r * 5 + f // 5) % 4
          screen.put(s, x + (n - 1) * 6 + c - 1, y + r - 1, flick == 0 and "%" or "@", 5 + r)
        end
      end
    end
  end
end

local function cold_noise(s, g, y0, y1)
  local f = g.frame // 6
  for y = y0, y1 do
    local dens = (y - y0 + 1) * 6 // (y1 - y0 + 1)
    for x = 0, s.w - 1 do
      local v = (x * 37 + y * 91 + f * (x % 3 + 1) * 5) % 29
      if v < dens then
        screen.put(s, x, y, ramp_char(clamp((y - y0) * 9 // (y1 - y0 + 1) + 1, 1, 9)), 1 + (v % 2))
      end
    end
  end
end

local function draw_title(g, s)
  cold_noise(s, g, 19, 35)
  big_text(s, 5, 5, "SMUDGEPOT", g.frame)
  center(s, 13, "A frost night in the orchard.", 4)
  center(s, 15, "Light the pots. Move them as the wind turns.", 4)
  center(s, 16, "Keep the blossom above freezing until dawn.", 4)
  if (g.frame // 12) % 2 == 0 then center(s, 21, "- press ENTER -", 6) end
  center(s, 33, "3 nights  24 trees  6 pots", 2)
end

local function draw_briefing(g, s)
  local w = g.w
  center(s, 2, "NIGHT " .. g.night .. " OF " .. config.NIGHTS, 6)
  center(s, 3, "22:00 to 06:00", 3)
  local low = config.AMB_MIN[g.night]
  local rows = {
    "Forecast: falling to about " .. string.format("%.1f", low) .. " C near 05:00.",
    "Hollows run colder than hills. Cold pools in low ground.",
    "Wind shifts tonight: " .. config.SHIFTS[g.night] .. ", announced " .. config.SHIFT_WARN .. " minutes ahead.",
    "Fuel shed holds " .. w.shed.cans .. " cans. A can burns " .. w.can_min .. " minutes.",
  }
  for i, r in ipairs(rows) do center(s, 5 + i, r, 4) end
  local dead = 0
  for _, t in ipairs(w.trees) do if not t.alive then dead = dead + 1 end end
  center(s, 11, "Trees standing: " .. (config.TREES_N - dead) .. "/" .. config.TREES_N
    .. "   Lose below " .. config.TREES_MIN_ALIVE, dead > 0 and 6 or 13)
  if #g.picked > 0 then center(s, 12, "Kit: " .. table.concat(g.picked, ", "), 13) end
  local ctl = {
    "arrows / WASD ...... walk (slower with a pot)",
    "Z or Space ......... light pot, else pour can, else take can",
    "X .................. lift a pot / set it down (lifting snuffs it)",
    "Tab ................ thermal view      P ... pause",
    "Heat drifts DOWNWIND: put pots upwind of the cold trees.",
  }
  for i, r in ipairs(ctl) do center(s, 15 + i, r, i == 5 and 7 or 5) end
  cold_noise(s, g, 26, 35)
  if (g.frame // 12) % 2 == 0 then center(s, 24, "- press ENTER to begin -", 6) end
end

local function draw_upgrade(g, s)
  center(s, 2, "DAWN. NIGHT " .. g.night .. " SURVIVED.", 6)
  local _, living = game.score(g)
  center(s, 4, "Trees standing: " .. living .. "/" .. config.TREES_N, living >= 18 and 13 or 6)
  center(s, 6, "Choose one thing to carry into the next night.", 4)
  local opts = game.UPGRADES[g.night]
  for i, o in ipairs(opts) do
    local x0 = 4 + (i - 1) * 30
    local sel = (g.choice == i)
    screen.box(s, x0, 9, 28, 9, sel and 6 or 2)
    screen.text(s, x0 + 2, 11, (sel and "> " or "  ") .. o.name, sel and 6 or 4)
    local line, row = "", 13
    for word in string.gmatch(o.text, "%S+") do
      if #line + #word + 1 > 24 then
        screen.text(s, x0 + 2, row, line, sel and 5 or 3)
        row = row + 1
        line = word
      else
        line = (line == "") and word or (line .. " " .. word)
      end
    end
    screen.text(s, x0 + 2, row, line, sel and 5 or 3)
  end
  center(s, 21, "LEFT / RIGHT to choose   ENTER to confirm", 3)
  cold_noise(s, g, 26, 35)
end

local function draw_end(g, s)
  local won = (g.scene == "ending")
  local jars, living, cans = game.score(g)
  center(s, 0, won and "DAWN OF THE THIRD NIGHT. THE BLOSSOM HELD." or "THE FROST WON THIS ORCHARD.", won and 6 or 8)
  screen.box(s, 0, 1, config.W + 2, config.H + 2, 2)
  local W, H = config.W, config.H
  local tree_at = {}
  for _, t in ipairs(g.w.trees) do tree_at[(t.y - 1) * W + t.x] = t end
  for y = 1, H do
    for x = 1, W do
      local i = (y - 1) * W + x
      local t = tree_at[i]
      if t then
        screen.put(s, FX + x - 1, FY + y - 1, t.alive and "T" or "x", t.alive and 14 or 8)
      else
        local idx = cold_idx(g.minT[i] or 99)
        screen.put(s, FX + x - 1, FY + y - 1, ramp_char(idx), ({ [0] = 0, 10, 10, 10, 11, 11, 11, 12, 12, 12 })[idx])
      end
    end
  end
  local x0 = PX
  screen.text(s, x0, 2, "JARS", 5)
  screen.text(s, x0, 3, tostring(jars), 6)
  screen.text(s, x0, 5, "trees " .. living .. "/" .. config.TREES_N, living >= 18 and 13 or 6)
  screen.text(s, x0, 6, "cans   " .. cans, 4)
  screen.text(s, x0, 7, "nights " .. (won and config.NIGHTS or (g.night - 1)) .. "/" .. config.NIGHTS, 4)
  screen.text(s, x0, 9, "jars = trees x" .. config.JAR_TREE, 2)
  screen.text(s, x0, 10, "     + cans x" .. config.JAR_CAN, 2)
  screen.text(s, x0, 12, "FROST MAP", 5)
  screen.text(s, x0, 13, "ramp: coldest", 2)
  screen.text(s, x0, 14, "each cell got", 2)
  screen.text(s, x0, 15, "T tree   x lost", 2)
  screen.text(s, x0, 18, "Z  copy map", 6)
  screen.text(s, x0, 19, "ENTER  again", 6)
  if #g.picked > 0 then
    screen.text(s, x0, 21, "kit:", 2)
    for i, p in ipairs(g.picked) do screen.text(s, x0, 21 + i, p, 3) end
  end
  draw_log(g, s)
end

function render.draw(g, s)
  screen.clear(s)
  local sc = g.scene
  if sc == "play" then draw_play(g, s)
  elseif sc == "title" then draw_title(g, s)
  elseif sc == "briefing" then draw_briefing(g, s)
  elseif sc == "upgrade" then draw_upgrade(g, s)
  else draw_end(g, s) end
end

return render
</script>
<script type="text/plain" data-lua="rng">-- rng.lua: integer LCG (glibc constants, 2^31 modulus), high bits used.
local rng = {}
rng.__index = rng

local A, Cc, M = 1103515245, 12345, 2147483648

function rng.new(seed)
  local s = math.floor(seed or 0)
  local self = setmetatable({}, rng)
  self.s = (s * A + Cc) % M
  self.s = (self.s * A + Cc) % M
  return self
end

-- next 24-bit value
function rng.next(self)
  self.s = (self.s * A + Cc) % M
  return self.s >> 7
end

-- integer in [a, b] inclusive
function rng.int(self, a, b)
  local n = b - a + 1
  return a + ((self:next() * n) >> 24)
end

-- float in [0, 1)
function rng.float(self)
  return self:next() / 16777216.0
end

return rng
</script>
<script type="text/plain" data-lua="screen">-- screen: a fixed-size glyph buffer. Pure, ASCII only (no host/io/os).
-- Colours are palette indices 0..15 (integer) or one hex digit string.
-- Functions take the screen first (screen.put(s, ...)); methods also work (s:put(...)).
local screen = {}
screen.__index = screen

local HEX = "0123456789abcdef"

local function col(c)
  if type(c) == "string" then
    return (string.find(HEX, string.lower(c), 1, true) or 16) - 1
  end
  return c or 15
end

-- screen.new(w, h) -> s   (defaults 64 x 36)
function screen.new(w, h)
  local s = setmetatable({ w = w or 64, h = h or 36, ch = {}, co = {} }, screen)
  screen.clear(s)
  return s
end

-- Fill every cell (default: space, colour 15).
function screen.clear(s, ch, c)
  ch = ch or " "
  c = col(c)
  for i = 1, s.w * s.h do
    s.ch[i] = ch
    s.co[i] = c
  end
end

-- Write one character; out-of-range writes are ignored.
function screen.put(s, x, y, ch, c)
  if x < 0 or y < 0 or x >= s.w or y >= s.h then return end
  local i = y * s.w + x + 1
  s.ch[i] = string.sub(ch, 1, 1)
  s.co[i] = col(c)
end

-- Write a string left to right, clipped to the screen.
function screen.text(s, x, y, str, c)
  for i = 1, #str do
    screen.put(s, x + i - 1, y, string.sub(str, i, i), c)
  end
end

-- ASCII box outline: +--+ / | | / +--+ ; w and h are outer size.
function screen.box(s, x, y, w, h, c)
  if w < 2 or h < 2 then return end
  for i = 1, w - 2 do
    screen.put(s, x + i, y, "-", c)
    screen.put(s, x + i, y + h - 1, "-", c)
  end
  for j = 1, h - 2 do
    screen.put(s, x, y + j, "|", c)
    screen.put(s, x + w - 1, y + j, "|", c)
  end
  screen.put(s, x, y, "+", c)
  screen.put(s, x + w - 1, y, "+", c)
  screen.put(s, x, y + h - 1, "+", c)
  screen.put(s, x + w - 1, y + h - 1, "+", c)
end

-- -> chars, colors : two strings of w*h bytes, row-major; colour byte is a hex digit.
function screen.strings(s)
  local n = s.w * s.h
  local cs, ks = {}, {}
  for i = 1, n do
    cs[i] = s.ch[i]
    local k = s.co[i]
    if k < 0 or k > 15 then k = 15 end
    ks[i] = string.sub(HEX, k + 1, k + 1)
  end
  return table.concat(cs), table.concat(ks)
end

-- -> the characters as h lines, each ending with a newline.
function screen.plain(s)
  local rows = {}
  for y = 0, s.h - 1 do
    rows[y + 1] = table.concat(s.ch, "", y * s.w + 1, y * s.w + s.w)
  end
  return table.concat(rows, "\n") .. "\n"
end

return screen
</script>
<script type="text/plain" data-lua="thermal">-- thermal.lua: temperature field. Cells indexed i = (y-1)*w + x, x 1..w, y 1..h.
local config = require("config")

local thermal = {}

-- ambient base temperature at a game minute (0 = 22:00) of a night (1..3)
function thermal.base(night, minute)
  local lo = config.AMB_MIN[night]
  if minute <= config.AMB_MIN_AT then
    return config.AMB_START + (lo - config.AMB_START) * minute / config.AMB_MIN_AT
  end
  return lo + config.AMB_DAWN_RISE * (minute - config.AMB_MIN_AT)
    / (config.NIGHT_MIN - config.AMB_MIN_AT)
end

function thermal.ambient(night, minute, height)
  return thermal.base(night, minute) - config.AMB_HEIGHT_COOL * (config.HGT_MAX - height)
end

-- field starts at ambient everywhere
function thermal.new_field(level, minute)
  local n = level.w * level.h
  local T, buf = {}, {}
  for i = 1, n do
    T[i] = thermal.ambient(level.night, minute or 0, level.hm[i])
    buf[i] = 0
  end
  return { w = level.w, h = level.h, T = T, buf = buf }
end

-- advance one game minute. wind = {dx,dy}. level supplies hm, hedge, pots, night.
function thermal.step(field, level, minute, wind)
  local W, H = field.w, field.h
  local T, N = field.T, field.buf
  local hm, hedge = level.hm, level.hedge
  local base = thermal.base(level.night, minute)
  local kn, ka, kw = config.MIX_NEIGHBOURS, config.MIX_AMBIENT, config.MIX_WIND * (wind.strength or 1)
  local cool, hmax = config.AMB_HEIGHT_COOL, config.HGT_MAX
  local wdx, wdy = wind.dx, wind.dy
  for y = 1, H do
    local uy = y - wdy
    if uy < 1 then uy = 1 elseif uy > H then uy = H end
    for x = 1, W do
      local i = (y - 1) * W + x
      local t = T[i]
      local l = x > 1 and T[i - 1] or t
      local r = x < W and T[i + 1] or t
      local u = y > 1 and T[i - W] or t
      local d = y < H and T[i + W] or t
      local mean4 = (l + r + u + d) * 0.25
      local amb = base - cool * (hmax - hm[i])
      local nt = t + kn * (mean4 - t) + ka * (amb - t)
      local px = x - wdx
      if px < 1 then px = 1 elseif px > W then px = W end
      local ui = (uy - 1) * W + px
      if not hedge[i] and not hedge[ui] then
        nt = nt + kw * (T[ui] - t)
      end
      N[i] = nt
    end
  end
  for _, p in ipairs(level.pots) do
    if p.lit and not p.carried then
      local i = (p.y - 1) * W + p.x
      N[i] = N[i] + config.POT_HEAT
    end
  end
  for i = 1, W * H do
    T[i] = N[i]
  end
end

return thermal
</script>
<script type="text/plain" data-lua="world">-- world.lua: the frost-night simulation. Pure; no host, io, os or math.random.
--
-- TIME
--   world.step(w, input) is ONE tick = 1/20 s (config.TPS). Every
--   config.TICKS_PER_MIN (10) ticks, one GAME MINUTE passes: the wind, thermal
--   field, pot burn, tree damage, cat and clock all update together, in that
--   order. A night is config.NIGHT_MIN (480) minutes = 4800 ticks.
--
-- INPUT   input = {dx, dy, a, b}   (nil or missing fields = 0 / false)
--   dx,dy  -1/0/1 move axes (diagonals are normalised).
--   a      USE, edge-triggered: true ONLY on the tick it was pressed.
--          Priority: light a reachable pot, else refuel one (needs a can in
--          hand), else take a can at the shed. Does nothing while carrying a pot.
--   b      LIFT/DROP, edge-triggered. Carrying -> drop at keeper cell (ignored
--          if another pot sits there). Else lift nearest reachable pot
--          (lifting extinguishes it).
--
-- PUBLIC FIELDS (read-only for game / render; cells are 1-based, i=(y-1)*W+x)
--   w.night, w.seed
--   w.status      "play" | "dawn" | "lost"   (step is a no-op once not "play")
--   w.tick        ticks elapsed;  w.minute  game minutes elapsed (0..480)
--   w.hh, w.mm    clock hour 0..23 / minute 0..59 (minute 0 = 22:00)
--   w.keeper      {x, y (floats, cell centre = integer), cx, cy (cell ints),
--                  cans (0/1 carried), pot (carried pot id or nil)}
--   w.pots        list {id, x, y, lit, fuel (minutes), carried}
--   w.trees       list {id, x, y, alive, damage (dies at config.TREE_DIE_AT)}
--   w.living      living tree count (refreshed each minute)
--   w.field       {w, h, T (flat temps), buf}; read field.T[i] fresh each time
--   w.level       full level (hm[i] height map, hedge[i], shed, wind schedule)
--   w.hm, w.hedge aliases of level.hm / level.hedge
--   w.shed        {x, y, cans}  (cans left at the shed)
--   w.cat         {x, y, purring}
--   w.wind        {dx, dy, name, strength}  dx,dy = direction the air moves
--                 toward; name is that direction (N/E/S/W)
--   w.shift       nil, or {at (minute), in_min, dx, dy, name} when the next
--                 wind shift is within config.SHIFT_WARN (20) minutes
--   w.can_min     fuel minutes per can (60, or 90 with carry.big_cans)
--   w.tank_max    pot tank limit = can_min * 2
--   w.events      list of {kind=..., ...} produced by the LAST step only
--                 (reset at the start of each step; read after every step)
--
-- EVENTS (each emitted exactly once, on the tick it happens)
--   match {pot,x,y}   pour {pot,fuel}   can {}   lift {pot}   drop {pot,x,y}
--   out {pot}  (pot ran dry)   warn {in_min,name,dx,dy}  (shift announced)
--   gust {name,dx,dy}  (wind turned)   tree_lost {id,x,y}   hour {hour}
--   purr {x,y}   dawn {}   lost {}
local config = require("config")
local level = require("level")
local thermal = require("thermal")

local world = {}

local SQ = 0.70710678118654752

local function emit(w, kind, data)
  data = data or {}
  data.kind = kind
  w.events[#w.events + 1] = data
end

local function round(v)
  return math.floor(v + 0.5)
end

local function clampi(v, lo, hi)
  if v < lo then return lo end
  if v > hi then return hi end
  return v
end

local function sign(v)
  if v > 0 then return 1 elseif v < 0 then return -1 end
  return 0
end

local function set_clock(w)
  local total = (config.START_HOUR * 60 + w.minute) % 1440
  w.hh = total // 60
  w.mm = total % 60
end

local function set_wind(w, dir)
  w.wind.dx, w.wind.dy, w.wind.name = dir.dx, dir.dy, dir.name
end

function world.new(seed, night, carry)
  carry = carry or {}
  local lv = level.gen(seed, night, carry)
  local w = {
    seed = seed, night = night, level = lv,
    hm = lv.hm, hedge = lv.hedge,
    pots = lv.pots, trees = lv.trees, shed = lv.shed,
    tick = 0, minute = 0, status = "play", events = {},
    can_min = carry.big_cans and config.CAN_MIN_BIG or config.CAN_MIN,
    keeper = { x = lv.start.x, y = lv.start.y, cx = lv.start.x, cy = lv.start.y, cans = 0, pot = nil },
    cat = { x = lv.cat.x, y = lv.cat.y, purring = false },
    wind = { dx = 0, dy = 0, name = "N", strength = config.WIND_STRENGTH[night] },
    shift = nil, shift_i = 1,
  }
  w.tank_max = w.can_min * config.TANK_CANS
  set_wind(w, lv.wind.initial)
  w.field = thermal.new_field(lv, 0)
  w.living = 0
  for _, t in ipairs(w.trees) do
    if t.alive then w.living = w.living + 1 end
  end
  set_clock(w)
  return w
end

local function dist2(ax, ay, bx, by)
  local dx, dy = ax - bx, ay - by
  return dx * dx + dy * dy
end

-- nearest uncarried pot within reach satisfying pred
local function nearest_pot(w, pred)
  local k = w.keeper
  local best, bd = nil, config.REACH * config.REACH + 1e-9
  for _, p in ipairs(w.pots) do
    if not p.carried and pred(p) then
      local d = dist2(k.cx, k.cy, p.x, p.y)
      if d <= bd then
        best, bd = p, d
      end
    end
  end
  return best
end

local function use(w)
  local k = w.keeper
  if k.pot then return end
  local p = nearest_pot(w, function(q) return not q.lit and q.fuel > 0 end)
  if p then
    p.lit = true
    emit(w, "match", { pot = p.id, x = p.x, y = p.y })
    return
  end
  if k.cans > 0 then
    p = nearest_pot(w, function(q) return q.fuel < w.tank_max end)
    if p then
      p.fuel = math.min(w.tank_max, p.fuel + w.can_min)
      k.cans = k.cans - 1
      emit(w, "pour", { pot = p.id, fuel = p.fuel })
      return
    end
  end
  if k.cans < config.CAN_CARRY and w.shed.cans > 0
    and dist2(k.cx, k.cy, w.shed.x, w.shed.y) <= config.REACH * config.REACH + 1e-9 then
    k.cans = k.cans + 1
    w.shed.cans = w.shed.cans - 1
    emit(w, "can")
  end
end

local function lift_drop(w)
  local k = w.keeper
  if k.pot then
    local p = w.pots[k.pot]
    for _, q in ipairs(w.pots) do
      if q ~= p and not q.carried and q.x == k.cx and q.y == k.cy then return end
    end
    p.carried = false
    p.x, p.y = k.cx, k.cy
    k.pot = nil
    emit(w, "drop", { pot = p.id, x = p.x, y = p.y })
    return
  end
  local p = nearest_pot(w, function() return true end)
  if p then
    p.carried = true
    p.lit = false
    k.pot = p.id
    p.x, p.y = k.cx, k.cy
    emit(w, "lift", { pot = p.id })
  end
end

local function move(w, dx, dy)
  local k = w.keeper
  dx, dy = sign(dx), sign(dy)
  if dx ~= 0 or dy ~= 0 then
    local sp = config.KEEPER_SPEED / config.TPS
    if k.pot then sp = sp * config.CARRY_SPEED_MULT end
    if dx ~= 0 and dy ~= 0 then sp = sp * SQ end
    k.x = clampi(k.x + dx * sp, 1, config.W)
    k.y = clampi(k.y + dy * sp, 1, config.H)
  end
  k.cx = clampi(round(k.x), 1, config.W)
  k.cy = clampi(round(k.y), 1, config.H)
  if k.pot then
    local p = w.pots[k.pot]
    p.x, p.y = k.cx, k.cy
  end
end

local function cat_step(w)
  local k, c, T, W = w.keeper, w.cat, w.field.T, w.field.w
  local r = config.CAT_SEEK_R
  local bt, bx, by = nil, c.x, c.y
  for y = math.max(1, k.cy - r), math.min(w.field.h, k.cy + r) do
    for x = math.max(1, k.cx - r), math.min(W, k.cx + r) do
      if dist2(x, y, k.cx, k.cy) <= r * r then
        local t = T[(y - 1) * W + x]
        if bt == nil or t > bt then
          bt, bx, by = t, x, y
        end
      end
    end
  end
  local dx, dy = bx - c.x, by - c.y
  if math.abs(dx) >= math.abs(dy) then
    c.x = c.x + sign(dx)
  else
    c.y = c.y + sign(dy)
  end
end

local function minute_update(w)
  w.minute = w.minute + 1
  set_clock(w)

  -- wind schedule
  local sched = w.level.wind.shifts
  local s = sched[w.shift_i]
  if s then
    local left = s.minute - w.minute
    if left == config.SHIFT_WARN then
      emit(w, "warn", { in_min = left, name = s.dir.name, dx = s.dir.dx, dy = s.dir.dy })
    end
    if left <= 0 then
      set_wind(w, s.dir)
      emit(w, "gust", { name = s.dir.name, dx = s.dir.dx, dy = s.dir.dy })
      w.shift_i = w.shift_i + 1
      s = sched[w.shift_i]
      left = s and (s.minute - w.minute) or nil
    end
    if s and left <= config.SHIFT_WARN then
      w.shift = { at = s.minute, in_min = left, dx = s.dir.dx, dy = s.dir.dy, name = s.dir.name }
    else
      w.shift = nil
    end
  else
    w.shift = nil
  end

  thermal.step(w.field, w.level, w.minute, w.wind)

  -- pot burn
  for _, p in ipairs(w.pots) do
    if p.lit then
      p.fuel = p.fuel - 1
      if p.fuel <= 0 then
        p.fuel = 0
        p.lit = false
        emit(w, "out", { pot = p.id })
      end
    end
  end

  -- frost damage
  local T, W = w.field.T, w.field.w
  local living = 0
  for _, t in ipairs(w.trees) do
    if t.alive then
      local temp = T[(t.y - 1) * W + t.x]
      if temp < config.TREE_FROST_T then
        t.damage = t.damage + (config.TREE_FROST_T - temp)
        if t.damage >= config.TREE_DIE_AT then
          t.alive = false
          emit(w, "tree_lost", { id = t.id, x = t.x, y = t.y })
        end
      end
    end
    if t.alive then living = living + 1 end
  end
  w.living = living

  if w.minute % config.CAT_EVERY == 0 then
    cat_step(w)
  end
  local ct = T[(w.cat.y - 1) * W + w.cat.x]
  if ct > config.PURR_T then
    if not w.cat.purring then
      w.cat.purring = true
      emit(w, "purr", { x = w.cat.x, y = w.cat.y })
    end
  else
    w.cat.purring = false
  end

  if w.minute % 60 == 0 and w.minute < config.NIGHT_MIN then
    emit(w, "hour", { hour = w.hh })
  end

  if w.living < config.TREES_MIN_ALIVE then
    w.status = "lost"
    emit(w, "lost")
  elseif w.minute >= config.NIGHT_MIN then
    w.status = "dawn"
    emit(w, "dawn")
  end
end

function world.step(w, input)
  w.events = {}
  if w.status ~= "play" then return w end
  input = input or {}
  w.tick = w.tick + 1
  move(w, input.dx or 0, input.dy or 0)
  if input.a then use(w) end
  if input.b then lift_drop(w) end
  if w.tick % config.TICKS_PER_MIN == 0 then
    minute_update(w)
  end
  return w
end

return world
</script>
<script src="https://cdn.jsdelivr.net/npm/wasmoon@1.16.0/dist/index.js"></script>
<script>
// SMUDGEPOT host: wasmoon loader, glyph-grid canvas, input, WebAudio, export overlay.
// wasmoon 1.16.0 UMD (dist/index.js, verified by inspecting the file): the factory is called as
//   factory(global.wasmoon = {})  ->  window.wasmoon.LuaFactory   (also exports LuaReturn, LuaType, Lua...)
// Plain <script> load therefore gives the global `wasmoon`, NOT `Wasmoon` or `LuaFactory`.
// Constructor: new wasmoon.LuaFactory(wasmUri); mountFile(path, src) mounts into "/" (cwd), so
// require("name") finds "name.lua" via the default "./?.lua" path.
(function () {
  "use strict";

  var errors = [];
  var errBox = document.getElementById("errors");
  var luaFns = null;      // {init, key, frame, scene, minute}
  var halted = false;

  function reportError(err) {
    var msg = String(err && err.stack ? err.stack : err && err.message ? err.message : err);
    errors.push(msg);
    errBox.hidden = false;
    errBox.textContent += (errBox.textContent ? "\n\n" : "") + msg;
  }
  window.addEventListener("error", function (e) { reportError(e.error || e.message); });
  window.addEventListener("unhandledrejection", function (e) { reportError(e.reason); });

  window.__game = {
    errors: errors,
    scene: function () { return luaFns ? luaFns.scene() : "loading"; },
    minute: function () { return luaFns ? luaFns.minute() : 0; }
  };

  // ---------- screen grid ----------
  var canvas = document.getElementById("screen");
  var ctx = canvas.getContext("2d");
  var W = 64, H = 36, palette = [], bg = "#000000";
  var FONT_PX = 18, CW = 11, CH = 22, DPR = 1;
  var curChars = "", curColors = "";
  var shownChars = "", shownColors = "";

  function setupCanvas() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    ctx.font = FONT_PX + "px ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace";
    CW = Math.ceil(ctx.measureText("M".repeat(64)).width / 64 + 0.01);
    CH = Math.ceil(FONT_PX * 1.22);
    canvas.width = W * CW * DPR;
    canvas.height = H * CH * DPR;
    fit();
    shownChars = ""; shownColors = "";   // force full repaint
  }
  function fit() {
    var s = Math.min(window.innerWidth / (W * CW), window.innerHeight / (H * CH));
    canvas.style.width = Math.floor(W * CW * s) + "px";
    canvas.style.height = Math.floor(H * CH * s) + "px";
  }
  window.addEventListener("resize", function () {
    if ((window.devicePixelRatio || 1) !== DPR) setupCanvas(); else fit();
  });

  function paintCell(i) {
    var x = (i % W) * CW, y = Math.floor(i / W) * CH;
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, CW, CH);
    var ch = curChars.charAt(i);
    if (ch !== " ") {
      ctx.fillStyle = palette[parseInt(curColors.charAt(i), 16)] || "#ffffff";
      ctx.fillText(ch, x, y + CH / 2, CW);
    }
  }
  function repaint() {
    if (curChars.length !== W * H) return;
    var full = shownChars.length !== curChars.length;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.font = FONT_PX + "px ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace";
    ctx.textBaseline = "middle";
    for (var i = 0; i < curChars.length; i++) {
      if (full || curChars.charCodeAt(i) !== shownChars.charCodeAt(i) ||
          curColors.charCodeAt(i) !== shownColors.charCodeAt(i)) paintCell(i);
    }
    shownChars = curChars; shownColors = curColors;
  }

  // ---------- audio (decoded recordings only; no synthesis) ----------
  var actx = null, clips = {}, buffers = {}, loops = {}, wantLoop = {};
  try { clips = JSON.parse(document.getElementById("sfx").textContent || "{}"); } catch (e) { reportError(e); }

  function b64ToBuf(b64) {
    var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }
  function startAudio() {
    if (actx) { if (actx.state === "suspended") actx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    Object.keys(clips).forEach(function (name) {
      var done = function (buf) { buffers[name] = buf; if (wantLoop[name] > 0) hostLoop(name, wantLoop[name]); };
      try {
        var p = actx.decodeAudioData(b64ToBuf(clips[name]), done, function (e) { reportError("audio decode " + name + ": " + e); });
        if (p && p.catch) p.catch(function () {});
      } catch (e) { reportError(e); }
    });
  }
  function hostPlay(name, volume) {
    var buf = buffers[name];
    if (!actx || !buf) return;
    var src = actx.createBufferSource(), g = actx.createGain();
    src.buffer = buf; g.gain.value = volume == null ? 1 : Number(volume);
    src.connect(g); g.connect(actx.destination); src.start();
  }
  // Loops are short cuts with fades at both ends, so consecutive segments are
  // scheduled on the audio clock and overlapped by XFADE seconds (crossfade).
  function scheduleSegment(l, name) {
    var buf = buffers[name], d = buf.duration, x = Math.min(0.5, d / 4);
    var src = actx.createBufferSource(), g = actx.createGain();
    src.buffer = buf; src.connect(g); g.connect(l.master);
    var t0 = l.nextAt;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(1, t0 + x);
    g.gain.setValueAtTime(1, t0 + d - x);
    g.gain.linearRampToValueAtTime(0, t0 + d);
    src.start(t0);
    l.srcs.push(src);
    src.onended = function () { var i = l.srcs.indexOf(src); if (i >= 0) l.srcs.splice(i, 1); };
    l.nextAt = t0 + d - x;
  }
  function pumpLoops() {
    if (!actx) return;
    Object.keys(loops).forEach(function (name) {
      var l = loops[name];
      l.nextAt = Math.max(l.nextAt, actx.currentTime);
      while (l.nextAt < actx.currentTime + 0.6) scheduleSegment(l, name);
    });
  }
  function hostLoop(name, volume) {
    volume = Number(volume) || 0;
    wantLoop[name] = volume;
    var l = loops[name];
    if (volume <= 0) {
      if (l) {
        l.master.gain.setTargetAtTime(0, actx.currentTime, 0.03);
        l.srcs.forEach(function (s) { try { s.stop(actx.currentTime + 0.2); } catch (e) {} });
        delete loops[name];
      }
      return;
    }
    if (l) { l.master.gain.setTargetAtTime(volume, actx.currentTime, 0.05); return; }
    if (!actx || !buffers[name]) return;   // started once the clip has decoded
    var master = actx.createGain();
    master.gain.value = volume;
    master.connect(actx.destination);
    l = loops[name] = { master: master, srcs: [], nextAt: actx.currentTime + 0.02 };
    pumpLoops();
  }

  // ---------- export overlay ----------
  var exportBox = document.getElementById("export");
  var exportText = document.getElementById("export-text");
  function hostExport(text) {
    exportText.value = String(text);
    exportBox.hidden = false;
    exportText.focus(); exportText.select();
  }
  function closeExport() { exportBox.hidden = true; canvas.focus(); }
  document.getElementById("export-close").addEventListener("click", closeExport);

  // ---------- input ----------
  var KEYMAP = {
    ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left",
    ArrowRight: "right", KeyD: "right", KeyZ: "a", Space: "a", KeyX: "b", Tab: "tab",
    Enter: "start", NumpadEnter: "start", KeyP: "pause", Escape: "pause"
  };
  var kbDown = {}, padDown = {}, sent = {};
  function sync(name) {
    var d = !!(kbDown[name] || padDown[name]);
    if (!!sent[name] === d || !luaFns || halted) return;
    sent[name] = d;
    try { luaFns.key(name, d); } catch (e) { halted = true; reportError(e); }
  }
  window.addEventListener("keydown", function (e) {
    if (!exportBox.hidden) { if (e.code === "Escape") { closeExport(); e.preventDefault(); } return; }
    startAudio();
    var n = KEYMAP[e.code];
    if (!n) return;
    e.preventDefault();
    if (e.repeat) return;
    kbDown[n] = true; sync(n);
  });
  window.addEventListener("keyup", function (e) {
    var n = KEYMAP[e.code];
    if (!n) return;
    e.preventDefault();
    kbDown[n] = false; sync(n);
  });
  window.addEventListener("blur", function () {
    Object.keys(kbDown).forEach(function (n) { kbDown[n] = false; sync(n); });
  });
  window.addEventListener("pointerdown", startAudio);

  var PAD_BUTTONS = { 12: "up", 13: "down", 14: "left", 15: "right", 0: "a", 2: "b", 3: "tab", 9: "start", 8: "pause" };
  function pollPad() {
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    var now = {};
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i];
      if (!p) continue;
      Object.keys(PAD_BUTTONS).forEach(function (b) {
        if (p.buttons[b] && p.buttons[b].pressed) now[PAD_BUTTONS[b]] = true;
      });
      var ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      if (ax < -0.5) now.left = true; else if (ax > 0.5) now.right = true;
      if (ay < -0.5) now.up = true; else if (ay > 0.5) now.down = true;
      if (!audioStartedByPad && Object.keys(now).length) { audioStartedByPad = true; startAudio(); }
    }
    ["up", "down", "left", "right", "a", "b", "tab", "start", "pause"].forEach(function (n) {
      var d = !!now[n];
      if (!!padDown[n] !== d) {
        padDown[n] = d;
        if (d && !exportBox.hidden) { if (n === "pause" || n === "b" || n === "start") closeExport(); return; }
        sync(n);
      }
    });
  }
  var audioStartedByPad = false;

  // ---------- main loop ----------
  var STEP = 0.05, acc = 0, last = 0;
  function tick(t) {
    requestAnimationFrame(tick);
    if (!luaFns || halted) return;
    if (!last) last = t;
    acc += Math.min((t - last) / 1000, 0.25);
    last = t;
    pollPad();
    pumpLoops();
    try {
      while (acc >= STEP) { acc -= STEP; luaFns.frame(STEP); }
    } catch (e) { halted = true; reportError(e); }
    repaint();
  }

  // ---------- boot ----------
  async function boot() {
    if (!window.wasmoon || !window.wasmoon.LuaFactory) throw new Error("wasmoon failed to load from the CDN (window.wasmoon missing)");
    var wasmUri;   // undefined -> wasmoon's own default (unpkg); we pass the jsdelivr copy instead
    var inlined = document.getElementById("wasm");
    if (inlined) wasmUri = URL.createObjectURL(new Blob([b64ToBuf(inlined.textContent.trim())], { type: "application/wasm" }));
    else wasmUri = "https://cdn.jsdelivr.net/npm/wasmoon@1.16.0/dist/glue.wasm";
    var factory = new window.wasmoon.LuaFactory(wasmUri);
    var mods = document.querySelectorAll('script[data-lua]');
    for (var i = 0; i < mods.length; i++) {
      await factory.mountFile(mods[i].getAttribute("data-lua") + ".lua", mods[i].textContent);
    }
    var engine = await factory.createEngine();
    engine.global.set("host", {
      present: function (chars, colors) { curChars = chars; curColors = colors; },
      play: hostPlay,
      loop: hostLoop,
      export: hostExport
    });
    await engine.doString('require("main")');
    var info = String(await engine.doString('return GAME.w .. "|" .. GAME.h .. "|" .. GAME.title .. "|" .. GAME.palette')).split("|");
    W = parseInt(info[0], 10); H = parseInt(info[1], 10);
    document.title = info[2];
    palette = info[3].split(",").map(function (s) { return s.trim(); });
    bg = palette[0] || "#000000";
    setupCanvas();
    var g = engine.global;
    luaFns = {
      init: g.get("game_init"), key: g.get("game_key"), frame: g.get("game_frame"),
      scene: g.get("game_scene"), minute: g.get("game_minute")
    };
    var m = /[?&]seed=(\d+)/.exec(location.search);
    luaFns.init(m ? parseInt(m[1], 10) : Math.floor(Math.random() * 2147483646) + 1);
    canvas.focus();
    requestAnimationFrame(tick);
  }
  boot().catch(reportError);
})();

</script>
