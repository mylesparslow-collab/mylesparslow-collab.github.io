<script>window.TOUR = {"steps": [{"img": "../assets/praxis-overview.jpg", "focus": [0.17, 0.1, 0.82, 0.38], "chapter": "Briefing", "title": "A portfolio briefing, not a dashboard", "text": "The overview leads with a sentence a managing partner can repeat: how many ideas are under review, how many are in pilot, and how many still rest on weak evidence. Every figure under it is counted from the records."}, {"img": "../assets/praxis-map.jpg", "focus": [0.17, 0.27, 0.54, 0.56], "chapter": "Map", "title": "Where each idea came from, and how much it changes the work", "text": "The opportunity map plots demand origin against workflow transformation. Position describes the idea; it is deliberately not a score, so a flashy idea cannot look valuable just by where it sits."}, {"img": "../assets/praxis-map.jpg", "focus": [0.72, 0.1, 0.27, 0.88], "chapter": "Classification", "title": "Classification you can audit", "text": "Select any bubble and the inspector explains, in plain words, which thresholds placed it in its quadrant and what evidence its scores rest on."}, {"img": "../assets/praxis-opportunities.jpg", "focus": [0.17, 0.27, 0.66, 0.72], "chapter": "Opportunities", "title": "Scores with honest ranges", "text": "Each opportunity carries a weighted score and the plausible range around it. Unscored criteria are never treated as favorable, and thin evidence widens the range instead of hiding."}, {"img": "../assets/praxis-prioritization.jpg", "focus": [0.17, 0.22, 0.82, 0.75], "chapter": "Prioritization", "title": "Rank the portfolio under different strategies", "text": "Balanced, quick wins or differentiation: each scenario states its assumptions and weights, and the arrows show exactly how the ranking moves when leadership changes its mind."}, {"img": "../assets/praxis-comparison.jpg", "focus": [0.17, 0.2, 0.66, 0.22], "chapter": "Comparison", "title": "Trade-offs written out", "text": "Put two to four ideas side by side and Praxis writes the trade-off in a sentence, including when two options are effectively tied because their ranges overlap."}, {"img": "../assets/praxis-pilots.jpg", "focus": [0.17, 0.27, 0.48, 0.72], "chapter": "Pilots", "title": "From idea to pilot", "text": "A pilot board tracks each opportunity from discovery to adoption, with success metrics, milestones and governance gates on every card."}, {"img": "../assets/praxis-stakeholders.jpg", "focus": [0.7, 0.23, 0.3, 0.62], "chapter": "Stakeholders", "title": "Who to bring along, and how", "text": "An influence and interest map, built from each stakeholder’s stated concerns, suggests whether to manage them closely, keep them satisfied or keep them informed."}]};</script>
