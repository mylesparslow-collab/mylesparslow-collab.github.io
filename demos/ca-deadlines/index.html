<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>What's the deadline?</title>
<!--

(web/glue.py `compute(json_str) -> json_str` must follow it; dates are ISO "YYYY-MM-DD",
all within 2026-01-01..2027-12-31; service_method is one of the 8 ServiceMethod names:
Personal, MailWithinCalifornia, MailOutOfState, MailAddressConfidentiality,
MailOutOfCountry, OvernightOrExpress, Fax, Electronic)

MOTION
  in : {"mode":"motion", "hearing_date":"2026-12-18", "service_method":"Personal"}
  out: {"hearing_is_court_day":true,
        "base_day":"2026-11-24",          // 16 court days before hearing
        "serve_by_statutory":"2026-11-24",// base_day minus service extension
        "serve_by":"2026-11-24",          // headline: last court day on/before serve_by_statutory
        "opposition_by":"2026-12-07",     // 9 court days before hearing
        "reply_by":"2026-12-11"}          // 5 court days before hearing
  If hearing_is_court_day is false the page shows a warning and ignores the other fields
  (glue may return them as null).

SERVED
  in : {"mode":"served", "service_date":"2026-05-15", "period_days":30,
        "service_method":"MailWithinCalifornia", "extension_barred":false}
  out: {"effective_service_date":"2026-05-15", // Electronic on a non-court day -> next court day
        "base_day":"2026-06-14",               // effective_service_date + period_days
        "extended_day":"2026-06-19",           // base_day + service extension (before rolling)
        "deadline":"2026-06-22",               // first court day on/after extended_day (headline)
        "rolled":true}                         // deadline != extended_day

<style>
:root {
  --bg: #f7f5f0;
  --surface: #fffdf9;
  --ink: #1d2230;
  --ink-2: #4b5263;
  --ink-3: #7a8092;
  --rule: #ddd8cc;
  --accent: #23407a;
  --accent-ink: #ffffff;
  --warn-bg: #fbefe0;
  --warn-ink: #7a3e00;
  --warn-rule: #e6c79c;
  --focus: #23407a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171f;
    --surface: #1b1f2a;
    --ink: #eceae3;
    --ink-2: #b4b8c4;
    --ink-3: #8a90a2;
    --rule: #2e3342;
    --accent: #8fb0ee;
    --accent-ink: #10162a;
    --warn-bg: #2e2112;
    --warn-ink: #f0c48a;
    --warn-rule: #5a4020;
    --focus: #8fb0ee;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--sans);
}
.wrap { max-width: 560px; margin: 0 auto; padding: 48px 16px 24px; min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; }
h1 { font: 400 30px/1.15 var(--serif); letter-spacing: -0.01em; margin: 0 0 24px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule); border-radius: 10px; padding: 3px; background: var(--surface); margin-bottom: 24px; }
.seg button {
  font: 500 15px var(--sans); color: var(--ink-2); background: none; border: 0; border-radius: 7px;
  padding: 10px 8px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

form { display: grid; gap: 18px; }
label, .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; letter-spacing: 0.01em; }
input[type="date"], input[type="number"], select {
  width: 100%; font: 16px var(--sans); color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 8px; padding: 11px 12px; min-height: 46px;
}
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); font-weight: 400; margin: 0; }
.check input { margin-top: 3px; width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
[hidden] { display: none !important; }

.answer { margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--rule); min-height: 150px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
.dow { font: 400 22px/1.2 var(--serif); color: var(--ink-2); margin: 0; }
.date { font: 400 clamp(38px, 11vw, 56px)/1.05 var(--serif); letter-spacing: -0.015em; margin: 2px 0 0; }
.loading, .hint { color: var(--ink-3); font-size: 15px; margin: 0; }
.warn { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-rule); border-radius: 10px; padding: 14px 16px; font-size: 15px; }
.warn strong { display: block; margin-bottom: 2px; }
.mock { font-size: 12px; color: var(--ink-3); margin-top: 14px; }

details { margin-top: 24px; border-top: 1px solid var(--rule); padding-top: 14px; }
summary { cursor: pointer; font-weight: 600; font-size: 15px; color: var(--accent); list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "\25B8"; display: inline-block; width: 1.1em; transition: transform .15s; }
details[open] summary::before { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { summary::before { transition: none; } }
ol.steps { margin: 16px 0 0; padding-left: 22px; font-size: 15px; color: var(--ink); }
ol.steps li { margin: 0 0 10px; padding-left: 4px; }
ol.steps .sec { font-weight: 600; font-variant-numeric: tabular-nums; }
ol.steps .res { color: var(--ink); font-weight: 600; white-space: nowrap; }
.note { font-size: 14px; color: var(--ink-2); margin: 12px 0 0; }
h2 { font: 600 13px var(--sans); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 6px; }
.choices { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink-2); }
.choices li { margin-bottom: 8px; }

footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--ink-3); line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
<main>
  <h1>What's the deadline?</h1>

  <div class="seg" role="group" aria-label="Mode">
    <button type="button" id="m-served" aria-pressed="true">I was served</button>
    <button type="button" id="m-motion" aria-pressed="false">I'm setting a motion</button>
  </div>

  <form id="f" onsubmit="return false" novalidate>
    <div data-mode="served">
      <label for="service_date">Date served</label>
      <input type="date" id="service_date" value="2026-05-15" min="2026-01-01" max="2027-12-31">
    </div>
    <div data-mode="served">
      <label for="period_days">Days to respond</label>
      <input type="number" id="period_days" value="30" min="1" max="365" step="1" inputmode="numeric">
    </div>
    <div data-mode="motion" hidden>
      <label for="hearing_date">Hearing date</label>
      <input type="date" id="hearing_date" value="2026-12-18" min="2026-01-01" max="2027-12-31">
    </div>
    <div>
      <label for="service_method"><span data-mode="served">How you were served</span><span data-mode="motion" hidden>How I'll serve</span></label>
      <select id="service_method">
        <option value="Personal">Personal delivery</option>
        <option value="MailWithinCalifornia" selected>Mail, within California</option>
        <option value="MailOutOfState">Mail, outside California (in the U.S.)</option>
        <option value="MailAddressConfidentiality">Mail, to a Secretary of State address-confidentiality address</option>
        <option value="MailOutOfCountry">Mail, outside the U.S.</option>
        <option value="OvernightOrExpress">Overnight or express delivery</option>
        <option value="Fax">Fax</option>
        <option value="Electronic">Electronic service</option>
      </select>
    </div>
    <div data-mode="served">
      <label class="check"><input type="checkbox" id="extension_barred">
        <span>Notice of intention to move for new trial, notice of intention to move to vacate judgment (§663a), or notice of appeal</span></label>
    </div>
  </form>

  <section class="answer" aria-live="polite" id="answer"></section>
</main>

<footer id="disclaimer">Not legal advice. Educational demo. Verify every date against the statutes, local rules and court orders. Holiday data: Judicial Council, 2026–2027 only. The Council has not listed Fri Dec 31, 2027 as a holiday (Jan 1, 2028 is a Saturday); check before relying on that date.</footer>
</div>

) + \"]\"\n\n\nclass CatalaTuple[*T](Value):\n    __slots__ = ( 'value' )\n    value: tuple[Value]\n\n    def __new__(cls, *members) -> CatalaTuple:\n        return super().__new__(cls, value = members)\n\n    def __getitem__(self, index):\n        return self.value[index]\n\n    def __eq__(self, other: Value, pos: SourcePosition | None = None) -> Bool: #type:ignore[override]\n        if not isinstance(other, CatalaTuple): return false\n        try:\n          zipped = zip(self.value, other.value, strict=True)\n        except ValueError: return false\n        return Bool(all([x.__eq__(y, pos) for x, y in zipped]))\n\n    def compare(self, other: Value, pos: SourcePosition | None = None) -> int:\n        if not isinstance(other, CatalaTuple): raise UncomparableValues(pos)\n        for (x, y) in zip(self.value, other.value, strict=False):\n            cmp = x.compare (y, pos)\n            if cmp != 0: return cmp\n        return compare (len(self.value), len(other.value))\n\n    def __str__(self, indent: int = 0) -> str:\n        return \"({})\".format(', '.join([x.__str__(indent + 1) for x in self.value]))\n\n    def to_json(self) -> str:\n        return \"[\" + \",\".join([x.to_json() for x in self.value]) + \"]\"\n\nclass CatalaStruct(Value):\n    name: ClassVar[str]\n    fields: ClassVar[dict[str, str]]\n\n    def __new__(cls, **init_fields) -> CatalaStruct:\n        if not set(init_fields.keys()).issubset(cls.fields.keys()):\n            raise Exception(f'Extra field at initialisation of {cls}')\n        return super().__new__(cls, **init_fields)\n\n    def __eq__(self, other: Value, pos: SourcePosition | None = None) -> Bool: #type:ignore[override]\n        return Bool(isinstance(other, CatalaStruct) and self.name == other.name and\n                    all([getattr(self, fld).__eq__(getattr(other, fld), pos) for (fld, label) in self.fields.items()]))\n\n    def compare(self, other: Value, pos: SourcePosition | None = None):\n        if not isinstance(other, CatalaStruct):\n            raise UncomparableValues(pos)\n        if self.name < other.name: return -1\n        elif self.name > other.name: return 1\n        for fld, label in self.fields.items():\n            cmp = getattr(self, fld).compare(getattr(other, fld), pos)\n            if cmp != 0: return cmp\n        return 0\n\n    def __str__(self, indent: int = 0):\n        if len(self.fields) == 0: return f'{self.name} {{}}'\n        return \"%s {%s\\n%s}\" % (\n            self.name,\n            ''.join([ f\"\\n{'':>{indent+2}}-- {label}: {getattr(self, fld).__str__(indent + 2)}\"\n                      for fld, label in self.fields.items() ]),\n            f\"{'':>{indent}}\"\n        )\n\n    def to_json(self) -> str:\n        return (\"{\" +\n                \",\".join([json.dumps(label, ensure_ascii=False) + ':' + getattr(self, fld).to_json()\n                          for fld, label in self.fields.items()]) +\n                \"}\")\n\nclass CatalaEnum(Value):\n    __slots__ = ('code', 'payload')\n    name: ClassVar[str]\n    code: Code\n    payload: Value\n\n    class Code(Enum):\n        label: str\n        def __new__(cls, name):\n            obj = object.__new__(cls)\n            obj._value_ = len(cls.__members__)\n            obj._name_ = name\n            obj.label = name\n            return obj\n        def __str__(self, indent: int = 0):\n            return self.name\n\n    def __new__(cls, code: Code, payload: Value | None = None):\n        return super().__new__(cls, code=code, payload=payload)\n\n    def __eq__(self, other: Value, pos: SourcePosition | None = None) -> Bool: #type:ignore[override]\n        return Bool(isinstance(other, CatalaEnum) and\n                    self.name == other.name and\n                    self.code == other.code and\n                    self.payload.__eq__(other.payload, pos))\n\n    def compare(self, other: Value, pos: SourcePosition | None = None):\n        if not isinstance(other, CatalaEnum): raise UncomparableValues(pos)\n        if self.name < other.name: return -1\n        elif self.name > other.name: return 1\n        if self.code.value < other.code.value: return -1\n        elif self.code.value > other.code.value: return 1\n        else:\n            return self.payload.compare(other.payload, pos)\n\n    def __str__(self, indent: int = 0):\n        if isinstance(self.payload, Unit):\n            return str(self.code.label)\n        else:\n            return f'{self.code.label} %s {self.payload}' % (\n              {Lang.En: \"content\", Lang.Fr: \"contenu\", Lang.Pl: \"typu\"}[lang]\n            )\n\n    def to_json(self) -> str:\n        return \"{\" + json.dumps(self.code.label, ensure_ascii=False) + \":\" + self.payload.to_json() + \"}\"\n\nclass Function[Targs, TRet](Value):\n    __slots__ = ('value')\n    value: function\n\n    def __new__(cls, value: Callable) -> Function:\n        return super().__new__(cls, value=value)\n\n    def __call__(self, *args: Targs) -> TRet:\n        return self.value(*args)\n\n    def __eq__(self, other: object, pos: SourcePosition | None = None) -> Bool: #type:ignore[override]\n        raise UncomparableValues(pos)\n\n    def compare(self, other: object, pos: SourcePosition | None = None) -> int:\n        raise UncomparableValues(pos)\n\n    def __str__(self, indent: int = 0):\n        return \"<function>\"\n\n    def to_json(self) -> str:\n        return '\"<function>\"'\n\n# ============\n# Type classes\n# ============\n\nclass Bool(Value):\n    __slots__ = ( 'value' )\n    value: bool\n\n    def __new__(cls, value) -> Bool:\n        return super().__new__(cls, value=bool(value))\n\n    def __eq__(self, other: Value, pos: SourcePosition | None = None) -> Bool: #type:ignore[override]\n        return Bool(isinstance(other, Bool) and self.value == other.value)\n\n    def compare(self, other: Value, pos: SourcePosition | None = None) -> int:\n        if not isinstance(other, Bool): raise UncomparableValues(pos)\n        return self.value - other.value\n\n    def __bool__(self) -> bool:\n        return self.value\n\n    def not_(self) -> Bool:\n        return Bool(not self.value)\n\n    def __sub__(self, other) -> int:\n        return self.value - other.value\n\n    def __str__(self, indent: int = 0) -> str:\n        if self.value:\n            return {Lang.En: \"true\", Lang.Fr: \"vrai\", Lang.Pl: \"prawda\"}[lang]\n        else:\n            return {Lang.En: \"false\", Lang.Fr: \"faux\", Lang.Pl: \"falsz\"}[lang]\n\n    def to_json(self) -> str:\n        return json.dumps(self.value);\n\ntrue = Bool(True)\nfalse = Bool(False)\n\ndef bigsep():\n    return (' ' if lang == Lang.Fr else ',')\ndef decsep():\n    return (',' if lang == Lang.Fr else '.')\n\n\nclass Integer(Value, int): #type:ignore[misc]\n    def __new__(cls, value: Union[str, int, Decimal, Money]) -> Integer:\n        if isinstance(value, Money):\n            return super().__new__(cls, round(Decimal(value)))\n        else:\n            return super().__new__(cls, value)\n\n    def __truediv__(self, other: Integer, pos: SourcePosition | None = None) -> Decimal: #type:ignore[override]\n        return Decimal(self).__truediv__(Decimal(other), pos)\n\n    def __str__(self, indent: int = 0) -> str:\n        x = abs(int(self))\n        chunks = [x]\n        x = x // 1000\n        while x != 0:\n            chunks.append(x)\n            x = x // 1000\n        return  (\n            ('-' if int(self) < 0 else '') +\n            bigsep().join([ ('%0d' if c < 1000 else '%03d') % (c % 1000) for c in reversed(chunks) ])\n        )\n\n    def __repr__(self) -> str:\n        return f\"Integer({int(self)})\"\n\n    def to_json(self) -> str:\n        return f'\"{str(int(self))}\"'\n\nclass Decimal(Value, Fraction): #type:ignore[misc]\n    def __new__(cls, value: object, *args) -> Decimal:\n        if isinstance(value, Decimal):\n            return value\n        if isinstance(value, Fraction):\n            frac = value\n        elif isinstance(value, Money):\n            frac = Fraction(numerator=value, denominator=100)\n        else:\n            frac = Fraction(*[value, *args])\n        obj = object.__new__(cls)\n        object.__setattr__(obj, '_numerator', frac.numerator)\n        object.__setattr__(obj, '_denominator', frac.denominator)\n        return obj\n\n    def __str__(self, indent: int = 0) -> str:\n        n = abs(int(self.numerator)) % self.denominator\n        decimals = [str(10 * n // self.denominator)]\n        ndec = 1\n        n = 10 * n % self.denominator\n        while n != 0 and ndec < max_decimals:\n            if ndec % 3 == 0: decimals.append(bigsep())\n            decimals.append(str(10 * n // self.denominator))\n            n = 10 * n % self.denominator\n            ndec = ndec + 1\n        return (\n            Integer(self).__str__(indent) +\n            decsep() +\n            ''.join(decimals) +\n            ('…' if n != 0 else '')\n        )\n\n    def __repr__(self) -> str:\n        return f\"Decimal({self.numerator.__repr__()}, {self.denominator.__repr__()})\"\n\n    def round(self) -> Decimal:\n        return Decimal(round(self))\n\n    def to_json(self) -> str:\n        if self.denominator == 1:\n            return f'\"{self.numerator}\"'\n        else:\n            return f'\"{self.numerator}/{self.denominator}\"'\n\nclass Money(Value, int): #type:ignore[misc]\n    def __new__(cls, value: object) -> Money:\n        if type(value) is int:\n            # Not a catala value, raw init from number of cents\n            return super().__new__(cls, value)\n        elif isinstance(value, Money):\n            return value\n        else:\n            # Otherwise, assume a number of units (= 100 cents)\n            ret = super().__new__(cls, round(Decimal(value) * 100))\n            return ret\n\n    def __mul__(self, other: Union [Integer, Decimal]) -> Money: #type:ignore[override]\n        rat_result : Decimal = Decimal(self) * Decimal(other)\n        return Money(rat_result)\n\n    @overload #type:ignore[override]\n    def __truediv__(self, other: Money) -> Decimal: ...\n\n    @overload\n    def __truediv__(self, other: Union [Integer, Decimal]) -> Money: ...\n\n    def __truediv__(self,\n                    other: Union [Integer, Decimal, Money],\n                    pos: SourcePosition | None = None\n                    ) -> Union [Decimal, Money]:\n        if other == 0: raise DivisionByZero(pos)\n        if isinstance(other, Money):\n            return Decimal(int(self), int(other))\n        else:\n            return self * (Decimal(1).__truediv__(Decimal(other)))\n\n    def __str__(self, indent: int = 0) -> str:\n        n = abs(self)\n        return (\n            ('-' if int(self) < 0 else '') +\n            ('$' if lang == Lang.En else '') +\n            Integer(int(n) // 100).__str__(indent) +\n            decsep() +\n            '%02d' % (n % 100) +\n            (' €' if lang == Lang.Fr else\n             ' PLN' if lang == Lang.Pl else '')\n        )\n\n    def __repr__(self) -> str:\n        return f\"Money({int(self)})\"\n\n    def decimal(self) -> Decimal:\n        return Decimal(self, 100)\n\n    def __float__(self) -> float:\n        return float(self.decimal())\n\n    def round(self) -> Money:\n        return Money(Integer(self))\n\n    def to_json(self) -> str:\n        n = abs(self)\n        return (\n            ('\"-' if int(self) < 0 else '\"') +\n            str(int(n) // 100) +\n            \".\" +\n            '%02d\"' % (int(n) % 100)\n        )\n\nclass Date(Value):\n    __slots__ = ( 'value' )\n\n    value: dates.Date\n\n    def __new__(cls, value: Union [Tuple[int, int, int], dates.Date, int], *args, pos: SourcePosition | None = None) -> Date:\n        if isinstance(value, Date):\n            return value\n        if isinstance(value, dates.Date):\n            return super().__new__(cls, value=value)\n        if isinstance(value, int):\n            (y, m, d) = (value, args[0], args[1])\n        else:\n            (y, m, d) = (value[0], value[1], value[2])\n        try:\n            return super().__new__(cls, value=dates.Date(year=int(y), month=int(m), day=int(d)))\n        except dates.InvalidDate:\n            raise DateError(pos, \"|%04d-%02d-%02d| is not a valid date\" %\n                            (y, m, d))\n\n    def __eq__(self, other: object, pos: SourcePosition | None = None) -> Bool: #type:ignore[override]\n        return Bool(isinstance(other, Date) and self.value == other.value)\n\n    def __add__(self, other: Duration, round: dates.DateRounding = dates.DateRounding.AbortOnRound,  pos: SourcePosition | None = None) -> Date:\n        try: return Date(self.value.__add__(other.value, round))\n        except dates.AmbiguousComputation: raise DateError(pos, note = \"ambiguous date computation with no rounding mode specified\")\n\n    def compare(self, other: object, pos: SourcePosition | None = None) -> int:\n        if not isinstance(other, Date):\n            raise UncomparableValues(pos)\n        elif self.value < other.value: return -1\n        elif self.value > other.value: return 1\n        else: return 0\n\n    @overload\n    def __sub__(self, other: Date) -> Duration: ...\n\n    @overload\n    def __sub__(self, other: Duration, round: dates.DateRounding = dates.DateRounding.AbortOnRound, pos: SourcePosition | None = None) -> Date: ...\n\n    def __sub__(self, \\\n                other: Union[Date, Duration], \\\n                round: dates.DateRounding = dates.DateRounding.AbortOnRound, \\\n                pos: SourcePosition | None = None) -> Union[Duration, Date]:\n        if isinstance(other, Date):\n            return Duration(self.value - other.value)\n        elif isinstance(other, Duration):\n            try:\n                return Date(self.value.__add__(-other.value, round))\n            except dates.AmbiguousComputation:\n                raise DateError(pos, note = \"ambiguous date computation with no rounding mode specified\")\n        else:\n            raise Exception(\"Substracting date and invalid obj\")\n\n    def __str__(self, indent: int = 0) -> str:\n        return f\"|{self.value.year:04d}-{self.value.month:02d}-{self.value.day:02d}|\"\n\n    def __repr__(self) -> str:\n        return f\"Date({self.value.__repr__()})\"\n\n    def to_json(self) -> str:\n        return f'\"{self.value.year:04d}-{self.value.month:02d}-{self.value.day:02d}\"'\n\n\nclass Duration(Value):\n    __slots__ = ( 'value' )\n\n    value: dates.Period\n\n    def __new__(cls, value: Union [Duration, Tuple[int, int, int], dates.Period, int], *args) -> Duration:\n        if isinstance(value, Duration):\n            return value\n        if isinstance(value, dates.Period):\n            p = value\n        elif isinstance(value, int):\n            p = dates.Period(years=value, months=args[0], days=args[1])\n        else:\n            p = dates.Period(years=value[0], months=value[1], days=value[2])\n        return super().__new__(cls, value=p)\n\n    def __add__(self: Duration, rhs: Duration) -> Duration:\n        return Duration(self.value + rhs.value)\n\n    def __sub__(self: Duration, rhs: Duration) -> Duration:\n        return Duration(self.value - rhs.value)\n\n    def __neg__(self: Duration) -> Duration:\n        return Duration(Duration(0, 0, 0) - self)\n\n    def __truediv__(self, other: Duration, pos: SourcePosition | None = None) -> Decimal: #type:ignore[override]\n        if (self.value.years != 0 or other.value.years != 0 or\n            self.value.months != 0 or other.value.months != 0):\n            raise DateError(pos, note=\"dividing durations that are not in days\")\n        else:\n            return Decimal(self.value.days).__truediv__(Decimal(other.value.days), pos)\n\n    def __mul__(self: Duration, rhs: Integer) -> Duration:\n        return Duration(self.value * rhs)\n\n    def __eq__(self, other: object, pos: SourcePosition | None = None) -> Bool: #type:ignore[override]\n        if not isinstance(other, Duration): return false\n        if (self.value.years == other.value.years and\n            self.value.months == other.value.months and\n            self.value.days == other.value.days):\n            return true\n        elif self.value.days == 0 and other.value.days == 0:\n            return Bool(self.value.years * 12 + self.value.months == other.value.years * 12 + other.value.months)\n        elif self.value.years == 0 and other.value.years == 0 and self.value.months == 0 and other.value.months == 0:\n           return Bool(self.value.days == other.value.days)\n        else:\n            raise DateError(pos, \"ambiguous comparison between durations in different units (e.g. months vs. days)\")\n\n    def compare(self, other: Value, pos: SourcePosition | None = None) -> int:\n        if not isinstance(other, Duration):\n            raise UncomparableValues(pos)\n        if self.value.days == 0 and other.value.days == 0:\n            return compare (self.value.years * 12 + self.value.months, other.value.years * 12 + other.value.months)\n        elif self.value.years == 0 and other.value.years == 0 and self.value.months == 0 and other.value.months == 0:\n            return compare (self.value.days, other.value.days)\n        else:\n            raise DateError(pos, \"ambiguous comparison between durations in different units (e.g. months vs. days)\")\n\n    def __str__(self, indent: int = 0) -> str:\n        def pr(x, r):\n            if x == 0: return ''\n            label = r[lang]\n            if abs(x) > 1 and lang != Lang.Pl and label[-1] != 's':\n                label = label + 's'\n            return '%d %s' % (x, label)\n        label_year = { Lang.En: 'year', Lang.Fr: 'an', Lang.Pl: 'rok' }\n        label_month = { Lang.En: 'month', Lang.Fr: 'mois', Lang.Pl: 'miesiac' }\n        label_day = { Lang.En: 'day', Lang.Fr: 'jour', Lang.Pl: 'dzien' }\n        str = \", \".join(filter (None, [\n            pr(self.value.years, label_year),\n            pr(self.value.months, label_month),\n            pr(self.value.days, label_day)\n        ]))\n        if str == \"\": str = '0 %s' % label_day[lang]\n        return ('[' + str + ']')\n\n    def __repr__(self) -> str:\n        return f\"Duration({self.value.__repr__()})\"\n\n    def to_json(self) -> str:\n        return '{\"years\":%d,\"months\":%d,\"days\":%d}' % (\n            self.value.years, self.value.months, self.value.days\n        )\n\nclass Unit(Value):\n    def __new__(cls) -> Unit:\n        return super().__new__(cls)\n\n    def __eq__(self, other: object, pos: SourcePosition | None = None) -> Bool: #type:ignore[override]\n        if isinstance(other, Unit):\n            return true\n        else:\n            return false\n\n    def __str__(self, indent: int = 0) -> str:\n        return \"()\"\n\n    def __repr__(self) -> str:\n        return \"Unit()\"\n\n    def to_json(self) -> str:\n        return '{}'\n\nclass Option[T: Value](Value):\n    __slots__ = ( 'value' )\n    value: T | None\n\n    def __new__(cls, value: T | None) -> Option[T]:\n        return super().__new__(cls, value = value)\n\n    def __eq__(self, other: Value, pos: SourcePosition | None = None) -> Bool: #type:ignore[override]\n        if not isinstance(other, Option): return false\n        if self.value is None:\n            return Bool(other.value is None)\n        elif other.value is None:\n            return false\n        else:\n            return self.value.__eq__(other.value, pos)\n\n    def compare(self, other, pos: SourcePosition | None = None) -> int:\n        if not isinstance(other, Option):\n            raise UncomparableValues(pos)\n        if self.value is None:\n            if other.value is None: return 0\n            else: return -1\n        else:\n            if other.value is None: return 1\n            else: return self.value.compare(other.value, pos)\n\n    def __str__(self, indent: int = 0) -> str:\n        if self.value is None:\n            return {Lang.En: \"Absent\", Lang.Fr: \"Absent\", Lang.Pl: \"Nieobecny\"}[lang]\n        else:\n            return f'%s %s {self.value.__str__(indent + 2)}' % (\n                {Lang.En: \"Present\", Lang.Fr: \"Présent\", Lang.Pl: \"Obecny\"}[lang],\n                {Lang.En: \"content\", Lang.Fr: \"contenu\", Lang.Pl: \"typu\"}[lang]\n              )\n\n    def __repr__(self) -> str:\n        return f\"Option({self.value.__repr__()})\"\n\n    def to_json(self) -> str:\n        if self.value is None:\n            return '\"Absent\"'\n        else:\n            return ('{\"Present\":' + self.value.to_json() + \"}\")\n\n# ============================\n# Constructors and conversions\n# ============================\n\ndef round(q : Decimal) -> Decimal:\n    qabs = abs(q)\n    n = qabs.numerator\n    d = qabs.denominator\n    abs_round = (2 * n + d) // (2 * d)\n    if q.numerator >= 0: return Decimal(abs_round)\n    else: return Decimal(- abs_round)\n\n# ========\n# Defaults\n# ========\n\n\ndef handle_exceptions(\n    exceptions: List[Option[CatalaTuple]]) -> Option[CatalaTuple]:\n    active_exns: List[CatalaTuple] = [e.value for e in exceptions if e.value is not None]\n    count = len(active_exns)\n    if count == 0:\n        return Option(None)\n    elif count == 1:\n        return Option(active_exns[0])\n    else:\n        raise Conflict([e[1] for e in active_exns])\n\nclass Empty(Exception): pass\n\ndef no_input() -> Callable[[Unit], Alpha]:\n    def closure(_: Unit):\n        raise Empty\n    return closure\n\n\n# This value is used for the Python code generation to trump mypy and forcing\n# it to accept dead code. Indeed, when raising an exception during a variable\n# definition, mypy complains that the later dead code will not know what\n# this variable was. So we give this variable a dead value.\ndead_value: Any = 0\n\n\n# ======\n# Traces\n# ======\n\n\nclass TraceKind:\n    kind: ClassVar[str]\n\n    def to_json_kind(self, json_payload: str | None = None) -> str:\n        if json_payload is None:\n            return f'{{\"kind\":{json.dumps(self.kind)}}}'\n        else:\n            return f'{{\"kind\":{json.dumps(self.kind)},{json_payload}}}'\n\n\nclass TraceVarDef:\n    __slots__ = ( \"var_name\", \"decl_pos\" )\n    var_name: str\n    decl_pos: SourcePosition\n\n    def __init__(self, var_name: str, decl_pos: SourcePosition) -> None:\n        self.var_name = var_name\n        self.decl_pos = decl_pos\n\n    def appendable_json(self) -> str:\n        return (\n            f'\"name\":{json.dumps(self.var_name)},\"decl_pos\":{self.decl_pos.to_json()}'\n        )\n\n\nclass ScopeCall(TraceKind):\n    __slots__ = \"var_def\"\n    var_def: TraceVarDef\n\n    kind = \"scope_call\"\n\n    def __init__(self, var_name: str, decl_pos: SourcePosition) -> None:\n        self.var_def = TraceVarDef(var_name, decl_pos)\n\n    def to_json(self) -> str:\n        return self.to_json_kind(self.var_def.appendable_json())\n\n\nclass Input(StrEnum):\n    NoInput = \"no_input\"\n    OnlyInput = \"only_input\"\n    Reentrant = \"reentrant\"\n\n\nclass ScopeVarDef(TraceKind):\n    __slots__ = ( \"var_def\", \"io_input\", \"output\" )\n    var_def: TraceVarDef\n    io_input: Input\n    output: Bool\n\n    kind = \"scope_var\"\n\n    def __init__(\n        self, var_name: str, decl_pos: SourcePosition, io_input: Input, output: Bool\n    ) -> None:\n        self.var_def = TraceVarDef(var_name, decl_pos)\n        self.io_input = io_input\n        self.output = output\n\n    def to_json(self) -> str:\n        output_s = \"false\"\n        if self.output:\n            output_s = \"true\"\n        payload = f'{self.var_def.appendable_json()},\"input\":{json.dumps(self.io_input)},\"output\":{output_s}'\n        return self.to_json_kind(payload)\n\n\nclass LocalVarDef(TraceKind):\n    __slots__ = \"name\"\n    name: str\n\n    kind = \"local_var\"\n\n    def __init__(self, name: str) -> None:\n        self.name = name\n\n    def to_json(self) -> str:\n        return self.to_json_kind(f'\"name\":{json.dumps(self.name)}')\n\n\nclass LocalTupDef(TraceKind):\n    __slots__ = \"names\"\n    names: List[str]\n\n    kind = \"local_tup\"\n\n    def __init__(self, names: List[str]) -> None:\n        self.names = names\n\n    def to_json(self) -> str:\n        return self.to_json_kind(f'\"names\":{json.dumps(self.names)}')\n\n\nclass FunCall(TraceKind):\n    __slots__ = \"var_def\"\n    var_def: TraceVarDef\n\n    kind = \"function_call\"\n\n    def __init__(self, var_name: str, decl_pos: SourcePosition) -> None:\n        self.var_def = TraceVarDef(var_name, decl_pos)\n\n    def to_json(self) -> str:\n        return self.to_json_kind(self.var_def.appendable_json())\n\n\nclass BranchingCondition(TraceKind):\n    __slots__ = ()\n\n    kind = \"branch_condition\"\n\n    def to_json(self) -> str:\n        return self.to_json_kind()\n\n\nclass IfBranching(TraceKind):\n    __slots__ = ()\n\n    kind = \"if_branching\"\n\n    def to_json(self) -> str:\n        return self.to_json_kind()\n\n\nclass Assertion(TraceKind):\n    __slots__ = ()\n\n    kind = \"assertion\"\n\n    def to_json(self) -> str:\n        return self.to_json_kind()\n\nclass MatchBranching(TraceKind):\n    __slots____ = \"constr_name\"\n    constr_name: str\n\n    kind = \"match_branching\"\n\n    def __init__(self, constr_name: str) -> None:\n        self.constr_name = constr_name\n\n    def to_json(self) -> str:\n        return self.to_json_kind(f'\"constructor\":{json.dumps(self.constr_name)}')\n\n\nclass ExceptionTrace(TraceKind):\n    __slots__ = ( \"label\", \"label_pos\", \"cons_pos\" )\n    label: str | None\n    label_pos: SourcePosition | None\n    cons_pos: SourcePosition\n\n    kind = \"exception\"\n\n    def __init__(\n        self, label: str | None, label_pos: SourcePosition | None, cons_pos: SourcePosition\n    ) -> None:\n        self.label = label\n        self.label_pos = label_pos\n        self.cons_pos = cons_pos\n\n    def to_json(self) -> str:\n        payload = \"\"\n        if self.label != None and self.label_pos != None:\n            payload += f'\"label\":{json.dumps(self.label)},\"pos\":{self.label_pos.to_json()},'\n        payload += f'\"cons_pos\":{self.cons_pos.to_json()}'\n        return self.to_json_kind(payload)\n\n\nclass ErrorTrace(TraceKind):\n    __slots__ = ( \"error\", \"related_pos\" )\n    error: CatalaError\n    related_pos: List[SourcePosition]\n\n    kind = \"error\"\n\n    def __init__(self, error: CatalaError, related_pos : List[SourcePosition] = []) -> None:\n        self.error = error\n        self.related_pos = related_pos\n\n    def to_json(self) -> str:\n        related_pos_v = \"\"\n        if self.related_pos != []:\n           related_pos_v = f'[{\",\".join([pos.to_json() for pos in self.related_pos])}]'\n        payload = f'{{\"type\":{json.dumps(self.error.name)},\"message\":{json.dumps(self.error.message)}{related_pos_v}}}'\n        return self.to_json_kind(payload)\n\nclass TraceNode:\n    __slots__ = ( \"kind\", \"pos\", \"parent\", \"value\", \"sub_nodes\" )\n    kind: TraceKind\n    pos: SourcePosition\n    parent: TraceNode | None\n    value: Value | None\n    sub_nodes: List[TraceNode] | None\n\n    def __init__(self, kind: TraceKind, pos: SourcePosition, parent: TraceNode | None) -> None:\n        self.kind = kind\n        self.pos = pos\n        self.parent = parent\n        self.value = None\n        self.sub_nodes = None\n\n    def add_sub_node(self, n: TraceNode) -> None:\n        if self.sub_nodes == None:\n            self.sub_nodes = [n]\n        else:\n            self.sub_nodes.append(n)\n\n    def to_json(self):\n        v_s = \"\"\n        if self.value is not None:\n            v_s = f',\"value\":{self.value.to_json()}'\n        subtrace_s = \"\"\n        if self.sub_nodes is not None:\n            subtrace_s = f',\"trace\":[{\",\".join([node.to_json() for node in self.sub_nodes])}]'\n        return f'{{\"element\":{self.kind.to_json()},\"pos\":{self.pos.to_json()}{v_s}{subtrace_s}}}'\n\n\nclass TraceContext:\n    __slots__ = ( \"current_node\", \"root_nodes\" )\n    current_node: TraceNode | None\n    root_nodes: List[TraceNode]\n\n    def __init__(self) -> None:\n        self.current_node = None\n        self.root_nodes = []\n\n    def begin_trace(self, kind: TraceKind, pos: SourcePosition) -> None:\n        new_node: TraceNode = TraceNode(kind, pos, self.current_node)\n        if self.current_node is None:\n            # root node\n            self.root_nodes.append(new_node)\n        else:\n            parent_node: TraceNode = self.current_node\n            parent_node.add_sub_node(new_node)\n        self.current_node = new_node\n\n    def end_trace(self, v: Value | None = None) -> None:\n        if self.current_node is not None:\n            self.current_node.value = v\n            self.current_node = self.current_node.parent\n\n    def single_trace(self, kind: TraceKind, pos: SourcePosition) -> None:\n        self.begin_trace(kind, pos)\n        self.end_trace()\n\n    def error_trace(self, err: CatalaError) -> None:\n        if err.source_positions is None:\n            raise err\n        elif isinstance(err.source_positions, List):\n            self.single_trace(ErrorTrace(err, err.source_positions[1:]), err.source_positions[0])\n        else:\n            self.single_trace(ErrorTrace(err), err.source_positions)\n\n# Stateful trace context\ntrace_context = TraceContext()\n\ndef begin_trace(kind: TraceKind, pos: SourcePosition) -> None:\n    global trace_context\n    trace_context.begin_trace(kind, pos)\n\n\ndef end_trace(v: Value) -> None:\n    global trace_context\n    trace_context.end_trace(v)\n\n\ndef error_trace(e: CatalaError) -> None:\n    global trace_context\n    trace_context.error_trace(e)\n\n\ndef reset_trace() -> None:\n    global trace_context\n    trace_context = TraceContext()\n\n\ndef retrieve_trace() -> List[TraceNode]:\n    global trace_context\n    return trace_context.root_nodes\n\n\ndef trace_to_json(trace: List[TraceNode]) -> str:\n    return (\n        \"[\"\n        + \",\".join(node.to_json() for node in trace)\n        + \"]\"\n    )\n", "deadlines/dates.py": "#   This file is part of the Dates_calc library. Copyright (C) 2023 Inria,\n#   contributors: Denis Merigoux <denis.merigoux@inria.fr>, Aymeric Fromherz\n#   <aymeric.fromherz@inria.fr>, Raphaël Monat <raphael.monat@inria.fr>\n#\n#   Licensed under the Apache License, Version 2.0 (the \"License\"); you may not\n#   use this file except in compliance with the License. You may obtain a copy of\n#   the License at\n#\n#   http://www.apache.org/licenses/LICENSE-2.0\n#\n#   Unless required by applicable law or agreed to in writing, software\n#   distributed under the License is distributed on an \"AS IS\" BASIS, WITHOUT\n#   WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the\n#   License for the specific language governing permissions and limitations under\n#   the License.\n\n# This implementation is derived from the OCaml implementation dates.ml.\n# The latter acts as the reference implementation in case of any discrepancy\n\nfrom __future__ import annotations\nfrom collections import namedtuple\nfrom functools import total_ordering, partial \nfrom enum import Enum\nfrom copy import deepcopy\nimport re\nfrom typing import NewType, List, Generic, Callable, Tuple, TypeVar, Iterable, Union, Any\n\nDateRounding = Enum(\"DateRounding\", [\"RoundUp\", \"RoundDown\", \"AbortOnRound\"])\n# A dynamic way to make AbortOnRound & co top-level globals:\nglobals().update(DateRounding.__members__)\n\nclass InvalidDate(Exception): pass\n\nclass AmbiguousComputation(Exception):\n    \"\"\"When choosing `AbortOnRound`, functions may raise this exception\"\"\"\n    pass\n\n# Utilities\n\ndef is_leap_year(year : int) -> bool:\n    return (year % 400 == 0) or (year % 4 == 0 and year % 100 != 0)\n\ndef days_in_month(*, month : int, is_leap_year : bool) -> int:\n    if month in [1, 3, 5, 7, 8, 10, 12]: return 31\n    elif month in [4, 6, 9, 11]: return 30\n    elif month == 2:\n        return 29 if is_leap_year else 28\n    else:\n        raise InvalidDate\n\ndef add_months_to_first_of_month_date(*, year : int, month : int, months : int) -> tuple[int, int]:\n    \"\"\"\n    Returns new `year, month`.\n    Precondition: `1 <= month <= 12`\n    \"\"\"\n    new_month = month + months\n    if 1 <= new_month and new_month <= 12: return year, new_month\n    elif new_month > 12: return add_months_to_first_of_month_date(year = year + 1,\n                                                                  month = month,\n                                                                  months = months - 12)\n    else:\n        # new_month <= 0\n        return add_months_to_first_of_month_date(year = year - 1,\n                                                 month = month,\n                                                 months = months + 12)\n\n# A hack to do custom infix operators, documented here: https://tomerfiliba.com/blog/Infix-Operators\nclass Infix(object):\n    def __init__(self, func):\n        self.func = func\n    def __or__(self, other):\n        return self.func(other)\n    def __ror__(self, other):\n        return Infix(partial(self.func, other))\n    def __call__(self, v1, v2):\n        return self.func(v1, v2)\n\n# this decorator will automatically create the other comparison methods based\n# on the implementation of < and ==\n@total_ordering \nclass Date:\n    def __init__(self, *, year, month, day):\n        self.year = year\n        self.month = month\n        self.day = day\n        if not self.is_valid:\n            raise InvalidDate\n\n    @property\n    def is_valid(self):\n        try:\n            return self.day >= 1 and self.day <= days_in_month(month=self.month, is_leap_year=is_leap_year(self.year))\n        except InvalidDate:\n            return False\n\n    def prev_valid_date(self) -> Date:\n        \"\"\"If the date is valid, does nothing. We expect the month number to be always\n        valid when calling this. If the date is invalid due to the day number,\n        then this function rounds down: if the day number is >= days_in_month,\n        to the last day of the current month.\n\n        \"\"\"\n        assert(1 <= self.month and self.month <= 12)\n        assert(1 <= self.day and self.day <= 31)\n        if self.is_valid: return self\n        else:\n            return Date(year = self.year,\n                        month = self.month,\n                        day = days_in_month(month = self.month,\n                                            is_leap_year = is_leap_year(self.year)))\n\n    def next_valid_date(self) -> Date:\n        \"\"\" If the date is valid, does nothing. We expect the month number to be\n        always valid when calling this. If the date is invalid due to the day\n        number, then this function rounds down: if the day number is >=\n        days_in_month, to the first day of the next month.\n        \"\"\"\n        assert(1 <= self.month and self.month <= 12)\n        assert(1 <= self.day and self.day <= 31)\n        if self.is_valid: return self\n        else:\n            new_year, new_month = add_months_to_first_of_month_date(year = self.year,\n                                                                    month = self.month,\n                                                                    months = 1)\n            return Date(year = new_year,\n                        month = new_month,\n                        day = 1)\n\n    def first_day_of_month(self) -> Date:\n        assert(self.is_valid)\n        return Date(year = self.year, month = self.month, day = 1)\n\n    def last_day_of_month(self) -> Date:\n        assert(self.is_valid)\n        return Date(year = self.year, month = self.month,\n                    day = days_in_month(month = self.month,\n                                        is_leap_year = is_leap_year(self.year)))\n\n    def round(self, round : DateRounding) -> Date:\n        if self.is_valid: return self\n        else:\n            if round == DateRounding.AbortOnRound: raise AmbiguousComputation\n            elif round == DateRounding.RoundDown: return self.prev_valid_date()\n            elif round == DateRounding.RoundUp: return self.next_valid_date()\n\n    # This function is only ever called from `add_dates` below.\n    # Hence, any call to `add_dates_years` will be followed by a call\n    # to `add_dates_month`. We therefore perform a single rounding\n    # in `add_dates_month`, to avoid introducing additional imprecision here,\n    # and to ensure that adding n years + m months is always equivalent to\n    # adding (12n + m) months\n    def add_dates_years(self, years : int, round : DateRounding) -> Date:\n        # Let's deepcopy to avoid the valid date check performed in init\n        new_date = deepcopy(self)\n        new_date.year = self.year + years\n        return new_date\n\n    def add_dates_months(self, months : int, round : DateRounding) -> Date:\n        new_year, new_month = add_months_to_first_of_month_date(year = self.year,\n                                                                month = self.month,\n                                                                months = months)\n        # Let's deepcopy to avoid the valid date check performed in init\n        new_date = deepcopy(self)\n        new_date.year = new_year\n        new_date.month = new_month\n        return new_date.round(round)\n\n    def add_dates_days(self, days : int) -> Date:\n        # Hello, dear reader! Buckle up because it will be a hard ride. The first\n        # thing to do here is to retrieve how many days there are in the current\n        # month of [d].\n        days_in_self_month = days_in_month(month = self.month,\n                                           is_leap_year = is_leap_year(self.year))\n        # Now, we case analyze of the situation. To do that, we add the current days\n        # of the month with [days], 11\",\n      \"name\": \"Veterans Day\"\n    },\n    {\n      \"date\": \"2027-11-25\",\n      \"name\": \"Thanksgiving Day\"\n    },\n    {\n      \"date\": \"2027-11-26\",\n      \"name\": \"Day after Thanksgiving\"\n    },\n    {\n      \"date\": \"2027-12-24\",\n      \"name\": \"Christmas Day (observed)\"\n    }\n  ]\n}\n"}</script>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var MIN = "2026-01-01", MAX = "2027-12-31";
  var mode = "served";

  var METHOD_LABEL = {
    Personal: "personal delivery", MailWithinCalifornia: "mail within California",
    MailOutOfState: "mail outside California", MailAddressConfidentiality: "mail to an address-confidentiality address",
    MailOutOfCountry: "mail outside the U.S.", OvernightOrExpress: "overnight or express delivery",
    Fax: "fax", Electronic: "electronic service"
  };
  var MAIL_DAYS = { MailWithinCalifornia: 5, MailOutOfState: 10, MailAddressConfidentiality: 12, MailOutOfCountry: 20 };

  function fmt(iso, long) {
    var p = iso.split("-").map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    var o = { timeZone: "UTC", month: long ? "long" : "short", day: "numeric", year: "numeric" };
    if (!long) o.weekday = "short";
    return d.toLocaleDateString("en-US", o);
  }
  function weekday(iso) {
    var p = iso.split("-").map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString("en-US", { timeZone: "UTC", weekday: "long" });
  }
  function inRange(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s) && s >= MIN && s <= MAX; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  /* ---------- UI wiring ---------- */
  function setMode(m) {
    mode = m;
    $("m-served").setAttribute("aria-pressed", m === "served");
    $("m-motion").setAttribute("aria-pressed", m === "motion");
    document.querySelectorAll("[data-mode]").forEach(function (el) { el.hidden = el.getAttribute("data-mode") !== m; });
    // keep a sensible default method per mode
    if (m === "motion" && $("service_method").value === "MailWithinCalifornia" && !setMode.touched) $("service_method").value = "Personal";
    if (m === "served" && !setMode.touched) $("service_method").value = "MailWithinCalifornia";
    update();
  }
  $("m-served").onclick = function () { setMode("served"); };
  $("m-motion").onclick = function () { setMode("motion"); };
  $("service_method").addEventListener("change", function () { setMode.touched = true; });
  $("f").addEventListener("input", update);
  $("f").addEventListener("change", update);

  /* ---------- engine state ---------- */
  var engineState = window.compute ? "ready" : "loading", engineErr = "";
  window.addEventListener("engine-ready", function () { engineState = "ready"; update(); });
  window.addEventListener("engine-error", function (e) { engineState = "error"; engineErr = (e.detail && e.detail.message) || "unknown error"; update(); });

  var seq = 0;
  function update() {
    var a = $("answer"), my = ++seq;
    if (engineState === "loading") { a.innerHTML = '<p class="loading">Loading the rules engine…</p>'; return; }
    if (engineState === "error") { a.innerHTML = '<div class="warn"><strong>The rules engine did not load.</strong>' + esc(engineErr) + "</div>"; return; }

    var input = { mode: mode, service_method: $("service_method").value }, bad = "";
    if (mode === "motion") {
      input.hearing_date = $("hearing_date").value;
      if (!inRange(input.hearing_date)) bad = "Pick a hearing date between Jan 1, 2026 and Dec 31, 2027.";
    } else {
      input.service_date = $("service_date").value;
      input.period_days = Number($("period_days").value);
      input.extension_barred = $("extension_barred").checked;
      if (!inRange(input.service_date)) bad = "Pick a service date between Jan 1, 2026 and Dec 31, 2027.";
      else if (!(Number.isInteger(input.period_days) && input.period_days >= 1 && input.period_days <= 365)) bad = "Enter a response period of 1 to 365 days.";
    }
    if (bad) { a.innerHTML = '<p class="hint">' + esc(bad) + "</p>"; return; }

    Promise.resolve().then(function () { return window.compute(input); }).then(function (out) {
      if (my !== seq) return;
      render(input, out);
    }, function (err) {
      if (my !== seq) return;
      a.innerHTML = '<div class="warn"><strong>Could not calculate.</strong>' + esc(err && err.message || err) + "</div>";
    });
  }

  /* ---------- rendering ---------- */
  function answerBlock(label, iso) {
    return '<p class="eyebrow">' + label + '</p><p class="dow">' + weekday(iso) + '</p><p class="date">' + fmt(iso, true) + "</p>";
  }
  function step(sec, text, res) {
    return '<li><span class="sec">' + sec + "</span>: " + text + (res ? ' &rarr; <span class="res">' + fmt(res) + "</span>" : "") + "</li>";
  }

  var CHOICES =
    '<h2>Two judgment calls in this tool</h2><ul class="choices">' +
    "<li><strong>Counting forward:</strong> the service extension is added to the response period first, and the weekend/holiday roll (§12a) is applied once at the very end, with no roll in between. This gives the earlier, safer date.</li>" +
    "<li><strong>Counting back for a motion:</strong> if counting back by calendar days lands on a weekend or court holiday, the statutory date is shown, and the headline is the court day just before it. Rolling back is conservative practice, not something the statute says.</li>" +
    "</ul>";

  function render(inp, out) {
    var a = $("answer"), m = inp.service_method, html = "", steps = "", extra = "";
    if (out && out.error) { a.innerHTML = '<div class="warn"><strong>Could not calculate.</strong>' + esc(out.error) + "</div>"; return; }

    if (inp.mode === "motion") {
      if (!out.hearing_is_court_day) {
        a.innerHTML = '<div class="warn"><strong>That hearing date is not a court day.</strong>' + fmt(inp.hearing_date, true) +
          " falls on a weekend or a judicial holiday, so a motion can't be heard that day. Pick another date.</div>";
        return;
      }
      html = answerBlock("Serve the motion by", out.serve_by);
      steps += step("§1005(b)", "16 court days before the hearing on " + fmt(inp.hearing_date), out.base_day);
      if (MAIL_DAYS[m]) steps += step("§1005(b)", "service by " + METHOD_LABEL[m] + " adds " + MAIL_DAYS[m] + " calendar days, so count back that many more", out.serve_by_statutory);
      else if (m === "OvernightOrExpress" || m === "Fax") steps += step("§1005(b)", METHOD_LABEL[m] + " adds 2 calendar days (not court days), so count back 2 more", out.serve_by_statutory);
      else if (m === "Electronic") steps += step("§1010.6(a)(3)(B)", "electronic service adds 2 court days, so count back 2 more court days (an interpretive reading, since §1005 does not say so)", out.serve_by_statutory);
      else steps += step("§1005(b)", "personal delivery adds no extension");
      var differs = out.serve_by_statutory !== out.serve_by;
      if (differs) {
        steps += step("Roll back", "the date above is a weekend or court holiday; the headline is the last court day before it", out.serve_by);
        extra += '<p class="note">Statutory date (before rolling back): <strong>' + fmt(out.serve_by_statutory) + "</strong>. Headline date: <strong>" + fmt(out.serve_by) + ".</strong></p>";
      }
      steps += step("§1005(b)", "opposition is due 9 court days before the hearing", out.opposition_by);
      steps += step("§1005(b)", "reply is due 5 court days before the hearing", out.reply_by);
    } else {
      html = answerBlock("Your response is due", out.deadline);
      var eff = out.effective_service_date;
      if (eff !== inp.service_date) steps += step("§1010.6(a)(4)", "electronic service on a non-court day counts as served the next court day", eff);
      steps += step("§12", "count " + inp.period_days + " days from " + fmt(eff) + ", excluding the first day and including the last", out.base_day);
      if (inp.extension_barred) steps += step("§1013 / §1010.6", "no service extension: this is a notice of intention to move for a new trial, a §663a motion to vacate, or a notice of appeal", out.extended_day);
      else if (MAIL_DAYS[m]) steps += step("§1013(a)", "service by " + METHOD_LABEL[m] + " adds " + MAIL_DAYS[m] + " calendar days", out.extended_day);
      else if (m === "OvernightOrExpress" || m === "Fax") steps += step("§1013(c), (e)", METHOD_LABEL[m] + " adds 2 court days", out.extended_day);
      else if (m === "Electronic") steps += step("§1010.6(a)(3)(B)", "electronic service adds 2 court days", out.extended_day);
      else steps += step("§1013", "personal delivery adds no extension", out.extended_day);
      if (out.rolled) {
        steps += step("§12a", "that day is a weekend or court holiday, so the deadline moves to the next court day", out.deadline);
        extra += '<p class="note">Rolled: the unrolled date was <strong>' + fmt(out.extended_day) + "</strong>. A deadline that lands on a non-court day moves forward to the next court day.</p>";
      } else {
        steps += step("§12a", "that day is a court day, so it stands", out.deadline);
      }
    }

    var wasOpen = !!a.querySelector("details[open]");
    a.innerHTML = html +
      "<details" + (wasOpen ? " open" : "") + "><summary>Show the working</summary><ol class=\"steps\">" + steps + "</ol>" + extra + CHOICES + "</details>" +
      (window.__MOCK__ ? '<p class="mock">Preview data: the real rules engine is not connected, so these dates are fixed samples.</p>' : "");
  }

  setMode("served");
})();
</script>


<script>
(function () {
  var files = JSON.parse(document.getElementById("bundle").textContent);
  function fail(e) { window.dispatchEvent(new CustomEvent("engine-error", { detail: { message: String((e && e.message) || e) } })); }
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js";
  s.onerror = function () { fail("Could not download Pyodide from the CDN. Check your connection."); };
  s.onload = function () {
    loadPyodide().then(function (py) {
      Object.keys(files).forEach(function (p) {
        var full = "/app/" + p, dir = full.slice(0, full.lastIndexOf("/"));
        py.FS.mkdirTree(dir);
        py.FS.writeFile(full, files[p]);
      });
      py.runPython("import sys\n[sys.path.insert(0, p) for p in ('/app/deadlines', '/app') if p not in sys.path]\nimport glue");
      var glue = py.pyimport("glue");
      window.compute = function (input) {
        return Promise.resolve().then(function () { return JSON.parse(glue.compute(JSON.stringify(input))); });
      };
      window.dispatchEvent(new Event("engine-ready"));
    }).catch(fail);
  };
  document.head.appendChild(s);
})();
</script>
