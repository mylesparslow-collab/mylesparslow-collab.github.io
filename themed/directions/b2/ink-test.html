<!doctype html><meta charset="utf-8"><title>ink test</title>
<style>body{margin:0;padding:20px;background:#fff;font:13px system-ui}.g{display:grid;grid-template-columns:1fr 1fr;gap:20px}canvas{width:100%;display:block;border:1px solid #111}</style>
<div class="g" id="g"></div>
<script>
// "Drawing" of a screenshot: luminance -> small blur -> Sobel -> ink line on paper.
function inkDraw(img, W, opts){
  opts = opts||{}; const H = Math.round(W*img.naturalHeight/img.naturalWidth);
  const c = document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high'; x.drawImage(img,0,0,W,H);
  const d=x.getImageData(0,0,W,H), s=d.data, L=new Float32Array(W*H);
  for(let i=0;i<W*H;i++) L[i]=(0.2126*s[i*4]+0.7152*s[i*4+1]+0.0722*s[i*4+2])/255;
  const k=opts.gain||3.2, th=opts.th||0.06, o=new Uint8ClampedArray(W*H*4);
  for(let y=0;y<H;y++)for(let X=0;X<W;X++){ const i=y*W+X; let e=0;
    if(X>0&&y>0&&X<W-1&&y<H-1){ const a=L[i-W-1],b=L[i-W],cc=L[i-W+1],dd=L[i-1],f=L[i+1],g=L[i+W-1],h=L[i+W],j=L[i+W+1];
      const gx=(cc+2*f+j)-(a+2*dd+g), gy=(g+2*h+j)-(a+2*b+cc); e=Math.sqrt(gx*gx+gy*gy); }
    let v=Math.min(1,Math.max(0,(e-th)*k)); const p=255-(255-17)*v;
    o[i*4]=o[i*4+1]=o[i*4+2]=p; o[i*4+3]=255; }
  x.putImageData(new ImageData(o,W,H),0,0); return c;
}
(async()=>{ const q=new URLSearchParams(location.search);
 for(const src of ['/assets/conflion-hits.jpg','/assets/thumbs-hd/songs.jpg','/assets/byz-atlas-1025.jpg','/assets/specimen-room-home.jpg','/assets/thumbs-hd/rsc.jpg','/assets/blackbox-recorder.jpg']){
  const im=new Image(); im.src=src; await im.decode();
  const c=inkDraw(im, +(q.get('w')||1400), {gain:+(q.get('k')||3.2), th:+(q.get('t')||0.06)}); document.getElementById('g').appendChild(c); }
 document.title='ready'; })();
</script>
